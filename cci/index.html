<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corewell Contract Intelligence - Sourcing Command</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Cdefs%3E%3Cmask%20id%3D%27c%27%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2748%27%20fill%3D%27%23fff%27%2F%3E%3Ccircle%20cx%3D%2757.07%27%20cy%3D%2742.93%27%20r%3D%2740%27%2F%3E%3C%2Fmask%3E%3Cmask%20id%3D%27g%27%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2748%27%20fill%3D%27%23fff%27%2F%3E%3Ccircle%20cx%3D%2742.93%27%20cy%3D%2757.07%27%20r%3D%2740%27%2F%3E%3C%2Fmask%3E%3C%2Fdefs%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20rx%3D%2722%27%20fill%3D%27%23002855%27%2F%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20fill%3D%27%2357d869%27%20mask%3D%27url%28%23g%29%27%2F%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20fill%3D%27%231ab4e8%27%20mask%3D%27url%28%23c%29%27%2F%3E%3C%2Fsvg%3E">
  <style>
    :root {
      color-scheme: light;
      --bg-grad:
        radial-gradient(circle at top left, rgba(0, 167, 200, .18), transparent 32rem),
        linear-gradient(140deg, #eef4f9, #f8fbff 58%, #eaf4f8);
      --panel: linear-gradient(180deg, rgba(255, 255, 255, .96), rgba(255, 255, 255, .9));
      --panel-solid: #ffffff;
      --ink: #0b1b2e;
      --ink-soft: #516175;
      --line: rgba(148, 163, 184, .28);
      --shadow: 0 10px 28px rgba(15, 23, 42, .08);
      --shadow-lg: 0 28px 80px rgba(0, 41, 85, .14);
      --topbar: rgba(248, 251, 255, .82);
      --chip: #eef4f9;
      --kpi-ghost: rgba(0, 41, 85, .05);
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: var(--bg-grad);
      background-attachment: fixed;
    }

    button, input, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .nx.dark {
      color-scheme: dark;
      --bg-grad:
        radial-gradient(circle at top left, rgba(0, 167, 200, .12), transparent 32rem),
        linear-gradient(140deg, #071120, #0c1728 62%, #071120);
      --panel: linear-gradient(180deg, #111c2d, #0b1524);
      --panel-solid: #101b2c;
      --ink: #e8f0fa;
      --ink-soft: #90a2ba;
      --line: rgba(124, 148, 180, .22);
      --shadow: 0 10px 28px rgba(0, 0, 0, .4);
      --shadow-lg: 0 28px 80px rgba(0, 0, 0, .55);
      --topbar: rgba(10, 20, 36, .78);
      --chip: #16263c;
      --kpi-ghost: rgba(255, 255, 255, .04);
    }

    .nx {
      min-height: 100vh;
      background: var(--bg-grad);
      background-attachment: fixed;
      color: var(--ink);
    }

    .nx ::-webkit-scrollbar { width: 10px; height: 10px; }
    .nx ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 9px; }
    .nx-shell { min-height: 100vh; }

    .nx-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 0 0 auto;
      margin-left: 4px;
      padding-right: 8px;
      border-right: 1px solid var(--line);
    }

    .nx-logo {
      width: 42px;
      height: 42px;
      background: transparent;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .nx-logo svg { width: 100%; height: 100%; display: block; }

    .nx-brand h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
      margin: 0;
      line-height: 1.1;
    }

    .nx-brand span {
      font-size: 10.5px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--ink-soft);
      font-weight: 700;
    }

    .nx-nav {
      align-items: center;
      display: flex;
      gap: 10px;
      min-width: 0;
      flex: 1 1 auto;
      margin-right: auto;
    }

    .nx-tabbar {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      max-width: 100%;
      min-height: 46px;
      padding: 4px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .88), rgba(255, 255, 255, .72)),
        var(--panel-solid);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .nx.dark .nx-tabbar {
      background:
        linear-gradient(180deg, rgba(16, 27, 44, .9), rgba(16, 27, 44, .72)),
        var(--panel-solid);
    }

    .nx-tab {
      position: relative;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      overflow: hidden;
      white-space: nowrap;
      isolation: isolate;
      transition:
        color .22s cubic-bezier(.4, 0, .2, 1),
        background .22s cubic-bezier(.4, 0, .2, 1),
        transform .22s cubic-bezier(.4, 0, .2, 1),
        box-shadow .22s cubic-bezier(.4, 0, .2, 1);
    }

    .nx-tab::before {
      content: "";
      position: absolute;
      inset: auto 16px 4px;
      height: 2px;
      border-radius: 999px;
      background: #67F48C;
      transform: scaleX(0);
      transform-origin: center;
      transition: transform .24s cubic-bezier(.4, 0, .2, 1);
      z-index: -1;
    }

    .nx-tab::after {
      content: "";
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(103, 244, 140, .24);
      opacity: 0;
      transform: scale(.2);
      transition: opacity .24s cubic-bezier(.4, 0, .2, 1), transform .24s cubic-bezier(.4, 0, .2, 1);
      z-index: -1;
    }

    .nx-tab:hover {
      color: var(--ink);
      background: rgba(0, 167, 200, .08);
      transform: translateY(-1px);
    }

    .nx-tab:hover::after {
      opacity: 1;
      transform: scale(2.7);
    }

    .nx-tab.active {
      color: #002955;
      background: linear-gradient(135deg, rgba(103, 244, 140, .34), rgba(0, 167, 200, .16));
      box-shadow: inset 0 0 0 1px rgba(103, 244, 140, .35), 0 10px 22px rgba(0, 41, 85, .08);
    }

    .nx.dark .nx-tab.active {
      color: #e8f0fa;
      background: linear-gradient(135deg, rgba(103, 244, 140, .2), rgba(0, 167, 200, .18));
    }

    .nx-tab.active::before {
      transform: scaleX(1);
    }

    .nx-tab:active {
      transform: scale(.98);
    }

    .nx-main { min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }

    .nx-top {
      position: sticky;
      top: 0;
      z-index: 50;
      min-height: 78px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 26px;
      background: var(--topbar);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
      overflow: hidden;
    }

    .nx-top-left {
      display: flex;
      align-items: center;
      gap: 18px;
      flex: 1;
      min-width: 0;
    }

    .nx-page-copy {
      min-width: 210px;
    }

    .nx-top h2 { font-size: 19px; font-weight: 800; letter-spacing: 0; margin: 0; line-height: 1.1; }
    .nx-top p { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-soft); }

    .nx-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 0 13px;
      border-radius: 999px;
      background: var(--panel-solid);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
    }

    .nx-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #37d399; box-shadow: 0 0 8px #37d399; }

    .nx-icbtn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel-solid);
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--ink);
      position: relative;
      transition: all .18s;
      flex: 0 0 auto;
    }

    .nx-icbtn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }

    .nx-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      border-radius: 9px;
      background: #e11d48;
      color: #fff;
      font-size: 10.5px;
      font-weight: 800;
      display: grid;
      place-items: center;
      box-shadow: 0 2px 6px rgba(225, 29, 72, .5);
    }

    .nx-body { padding: 24px 26px 60px; display: flex; flex-direction: column; gap: 22px; }

    .nx-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 18px;
      min-width: 0;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .nx-card.hoverable:hover { transform: translateY(-2px); box-shadow: 0 18px 40px rgba(15, 23, 42, .13); }
    .nx-card.clickable { cursor: pointer; }
    .nx-card.clickable:hover { transform: scale(1.01); box-shadow: 0 18px 40px rgba(15, 23, 42, .13); }
    .nx-cardhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 12px; min-width: 0; }
    .nx-cardhead > div { min-width: 0; }
    .nx-cardhead h3 { margin: 0; font-size: 14.5px; font-weight: 850; letter-spacing: 0; line-height: 1.25; overflow-wrap: anywhere; }
    .nx-cardhead .sub { margin-top: 4px; font-size: 12px; color: var(--ink-soft); font-weight: 650; line-height: 1.45; overflow-wrap: anywhere; }

    .nx-label {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .13em;
      font-weight: 800;
      color: var(--ink-soft);
    }

    .nx-hero {
      position: relative;
      overflow: hidden;
      border-radius: 36px;
      padding: 30px 32px;
      color: #fff;
      background:
        radial-gradient(circle at 12% 8%, rgba(103, 244, 140, .28), transparent 40%),
        radial-gradient(circle at 88% 0%, rgba(0, 167, 200, .34), transparent 44%),
        radial-gradient(circle at 80% 120%, rgba(11, 87, 151, .5), transparent 55%),
        linear-gradient(135deg, #002955, #063b73 60%, #031c39);
      box-shadow: var(--shadow-lg);
      display: flex;
      gap: 24px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .nx-hero h2 {
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 850;
      letter-spacing: 0;
      margin: 0 0 8px;
      line-height: 1.08;
      max-width: 560px;
    }

    .nx-hero p { margin: 0; color: rgba(255, 255, 255, .72); font-size: 14px; max-width: 560px; line-height: 1.55; }

    .nx-hero .eyebrow {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .18em;
      font-weight: 800;
      color: #67F48C;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nx-herocard {
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 22px;
      padding: 18px;
      min-width: 230px;
      backdrop-filter: blur(8px);
    }

    .nx-herocard .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 7px 0; }
    .nx-herocard .row + .row { border-top: 1px solid rgba(255, 255, 255, .1); }
    .nx-herocard b { font-weight: 800; font-size: 15px; }
    .nx-herocard small { color: rgba(255, 255, 255, .6); font-size: 11.5px; font-weight: 600; }
    .nx-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
    .nx-kpi { position: relative; overflow: hidden; min-height: 142px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }

    .nx-kpi .glow {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      right: -30px;
      top: -40px;
      background: radial-gradient(circle, var(--g, #67F48C) 0%, transparent 70%);
      opacity: .16;
    }

    .nx-kpi .val { font-size: clamp(24px, 2.5vw, 30px); font-weight: 850; letter-spacing: 0; margin: 6px 0 2px; line-height: 1.05; overflow-wrap: anywhere; }
    .nx-kpi .help { font-size: 12px; color: var(--ink-soft); font-weight: 650; display: flex; align-items: center; gap: 5px; line-height: 1.4; overflow-wrap: anywhere; }
    .nx-grid2 { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(280px, 1fr); gap: 18px; }
    .nx-grid2b { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(0, 1.4fr); gap: 18px; }

    .nx-pillbadge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0;
      line-height: 1.25;
      max-width: 100%;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .nx-table-wrap { border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
    .nx-table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: auto; }

    .nx-table thead th {
      position: sticky;
      top: 0;
      background: var(--chip);
      text-align: left;
      padding: 11px 14px;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .1em;
      font-weight: 800;
      color: var(--ink-soft);
      white-space: nowrap;
    }

    .nx-table tbody td { padding: 13px 14px; border-top: 1px solid var(--line); white-space: normal; vertical-align: top; line-height: 1.45; overflow-wrap: anywhere; }
    .nx-table tbody td:nth-child(3),
    .nx-table tbody td:nth-child(6) { white-space: nowrap; }
    .nx-table tbody tr { transition: background .15s, transform .15s; }
    .nx-table tbody tr:hover { background: var(--kpi-ghost); }
    .nx-table tbody tr[data-contract-id] { cursor: pointer; }
    .nx-table tbody tr[data-contract-id]:hover { transform: translateX(2px); }
    .nx-vend { font-weight: 800; line-height: 1.35; overflow-wrap: anywhere; }
    .nx-id { font-size: 11.5px; color: var(--ink-soft); font-weight: 650; line-height: 1.45; margin-top: 3px; overflow-wrap: anywhere; }
    .nx-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    .nx-pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 14px;
      flex-wrap: wrap;
    }

    .nx-page-meta {
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 700;
    }

    .nx-pager-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nx-pager .nx-btn[disabled] {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    .nx-input, .nx-select {
      height: 42px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--panel-solid);
      color: var(--ink);
      padding: 0 14px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      transition: box-shadow .18s, border-color .18s;
    }

    .nx-input:focus, .nx-select:focus { border-color: #00a7c8; box-shadow: 0 0 0 4px rgba(0, 167, 200, .24); }
    .nx-input { padding-left: 38px; }
    .nx-search { position: relative; flex: 1; min-width: 200px; }
    .nx-search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); }

    .nx-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 14px;
      min-height: 42px;
      padding: 0 18px;
      font-weight: 800;
      font-size: 13.5px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all .18s;
      white-space: nowrap;
      text-decoration: none;
    }

    .nx-btn:hover { transform: translateY(-1px); }
    .nx-btn.primary { background: linear-gradient(135deg, #002955, #0b5797); color: #fff; box-shadow: 0 14px 28px rgba(0, 41, 85, .22); }
    .nx-btn.ghost { background: transparent; border-color: var(--line); color: var(--ink-soft); }
    .nx-btn.ghost:hover { color: var(--ink); }

    .nx-smart {
      position: relative;
      overflow: hidden;
      border-radius: 999px;
      background: linear-gradient(135deg, #002955, #00a7c8 90%);
      color: #fff;
      box-shadow: 0 14px 30px rgba(0, 167, 200, .32);
    }

    .nx-smart:hover {
      transform: scale(1.02);
      background: linear-gradient(135deg, #063b73, #008aaa 92%);
      box-shadow: 0 16px 34px rgba(0, 167, 200, .38);
    }

    .nx-chart-card { min-height: 366px; display: flex; flex-direction: column; }
    .nx-chartbox { min-height: 286px; margin-top: 2px; display: flex; align-items: stretch; min-width: 0; }
    .nx-chart-scroll { width: 100%; max-height: 360px; overflow: auto; padding: 2px 2px 8px; }
    .nx-svgchart { width: 100%; min-height: 286px; height: 286px; display: block; overflow: visible; }
    .nx-axis { fill: var(--ink-soft); font-size: 11px; font-weight: 700; }
    .nx-axis.label { font-size: 11.5px; font-weight: 750; }
    .nx-gridline { stroke: var(--line); stroke-dasharray: 3 3; }
    .nx-chart-node { transition: opacity .18s ease, filter .18s ease, stroke-width .18s ease, transform .18s ease; transform-box: fill-box; transform-origin: center; }
    .nx-chart-node:hover { filter: drop-shadow(0 8px 12px rgba(0, 41, 85, .22)); transform: scale(1.01); }
    .nx-chart-node.active { filter: drop-shadow(0 10px 16px rgba(0, 41, 85, .34)); stroke: #fff; stroke-width: 3; opacity: 1 !important; }
    .nx-bar { cursor: pointer; }
    .nx-bar-label { fill: var(--ink); font-size: 11.5px; font-weight: 800; }
    .nx-trend-hit { cursor: pointer; }
    .nx-chart-empty { min-height: 286px; display: grid; place-items: center; color: var(--ink-soft); font-size: 13px; font-weight: 700; text-align: center; line-height: 1.5; padding: 18px; }
    .nx-chart-tip {
      position: fixed;
      z-index: 120;
      max-width: min(280px, calc(100vw - 28px));
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, .38);
      background: rgba(255, 255, 255, .74);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 16px 38px rgba(15, 23, 42, .2);
      color: #0b1b2e;
      pointer-events: none;
      opacity: 0;
      transform: translate3d(0, 8px, 0);
      transition: opacity .14s ease, transform .14s ease;
    }

    .nx.dark .nx-chart-tip {
      background: rgba(16, 27, 44, .76);
      border-color: rgba(124, 148, 180, .34);
      color: #e8f0fa;
      box-shadow: 0 18px 44px rgba(0, 0, 0, .46);
    }

    .nx-chart-tip.open { opacity: 1; transform: translate3d(0, 0, 0); }
    .nx-chart-tip .k { font-size: 10px; text-transform: uppercase; letter-spacing: .13em; color: var(--ink-soft); font-weight: 850; margin-bottom: 5px; }
    .nx-chart-tip .v { font-size: 13px; line-height: 1.45; font-weight: 750; overflow-wrap: anywhere; }

    .nx-view {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .nx-view.enter {
      animation: viewIn .26s cubic-bezier(.2, .8, .2, 1);
    }

    .nx-skel {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .nx-skel .sk-line { border-radius: 10px; }
    .nx-skel .nx-kpi { min-height: 128px; display: flex; flex-direction: column; gap: 12px; }

    @keyframes viewIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .nx-donut-wrap {
      min-height: 286px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 14px;
      margin-top: 2px;
    }

    .nx-donut-svg { width: min(210px, 72vw); height: min(210px, 72vw); max-width: 210px; max-height: 210px; overflow: visible; }
    .nx-donut-seg { cursor: pointer; fill: none; stroke-width: 28; pointer-events: bounding-box; transition: opacity .18s ease, stroke-width .18s ease, filter .18s ease; }
    .nx-donut-seg:hover, .nx-donut-seg.active { filter: drop-shadow(0 8px 14px rgba(0, 41, 85, .28)); stroke-width: 32; opacity: 1 !important; }

    .nx-filter-fade { animation: filterFadeIn .24s cubic-bezier(.2, .8, .2, 1) both; }

    /* Row / card highlight pulse for smart-search jumps */

    tr.nx-row-highlight > td { animation: nxHighlightCell 2.8s cubic-bezier(.4, 0, .2, 1); }
    @keyframes nxHighlightPulse {

    /* Spend by category: full-row hover focus */

    .nx-svgchart .nx-cat-row:hover .nx-bar { opacity: 1 !important; }
    .nx-bar-label { pointer-events: none; }
    .nx-axis { pointer-events: none; }

    /* Risk donut: hover dimming + clickable legend */

    .nx-donut-svg:hover .nx-donut-seg:not(.hover) { opacity: .26 !important; }
    .nx-donut-seg.hover { opacity: 1 !important; filter: drop-shadow(0 8px 14px rgba(0, 41, 85, .28)); stroke-width: 32; }
    .nx-legend .nx-leg {
      display: inline-flex;

    .nx-legend .nx-leg:hover { border-color: var(--line); background: var(--kpi-ghost); transform: translateY(-1px); }
    .nx-legend:hover .nx-leg:not(:hover) { opacity: .45; }
    .nx-legend .nx-leg.active { border-color: #00a7c8; background: rgba(0, 167, 200, .12); color: var(--ink); }

    /* Modal cross-navigation action bar */

      margin: 4px 0 14px;
      padding-bottom: 14px;

    }

    .nx-act-btn {

      min-height: 34px;
      border-radius: 999px;
      border: 1px solid rgba(0, 167, 200, .4);

    .nx-act-btn.solid { background: linear-gradient(135deg, #002955, #0b5797); color: #fff; border-color: transparent; }
    .nx-tier-card {

    }
    .nx-tier-card h4 { margin: 0 0 6px; font-size: 14.5px; font-weight: 850; }
    .nx-tier-card p { margin: 0; font-size: 13px; color: var(--ink-soft); line-height: 1.6; }
    .nx-modal-table .rowact { display: flex; gap: 6px; flex-wrap: wrap; }

    /* Renewal Timeline filter bar + horizontal board */
    .nx-tl-bar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }
    .nx-tl-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .nx-tl-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel-solid);
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 800;
      padding: 0 13px;
      cursor: pointer;
      transition: transform .16s, background .16s, border-color .16s, color .16s;
    }
    .nx-tl-chip:hover { transform: translateY(-1px); color: var(--ink); border-color: rgba(0, 167, 200, .45); }
    .nx-tl-chip .ct { font-size: 10.5px; background: var(--chip); border-radius: 999px; padding: 1px 7px; font-weight: 850; }
    .nx-tl-chip.active { color: #002955; background: linear-gradient(135deg, rgba(103, 244, 140, .34), rgba(0, 167, 200, .16)); border-color: rgba(0, 167, 200, .5); box-shadow: inset 0 0 0 1px rgba(103, 244, 140, .35); }

    .nx-tl-clear { margin-left: auto; }
    .nx-tl-board { display: flex; flex-direction: column; gap: 12px; }
    .nx-tl-card {
      display: grid;
      grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.1fr) auto;
      gap: 14px;
      align-items: center;
      border: 1px solid var(--line);
      border-left: 5px solid var(--accent, #37d399);
      border-radius: 16px;
      background: var(--panel);
      padding: 14px 16px;
      min-width: 0;
    }
    .nx-tl-card .tl-main { min-width: 0; }
    .nx-tl-card .tl-vend { font-size: 14.5px; font-weight: 850; line-height: 1.3; overflow-wrap: anywhere; }
    .nx-tl-card .tl-sub { font-size: 11.5px; color: var(--ink-soft); font-weight: 650; margin-top: 3px; overflow-wrap: anywhere; }
    .nx-tl-card .tl-cell { min-width: 0; }
    .nx-tl-card .tl-k { font-size: 9.5px; text-transform: uppercase; letter-spacing: .09em; font-weight: 850; color: var(--ink-soft); display: block; margin-bottom: 3px; }
    .nx-tl-card .tl-v { font-size: 12.5px; font-weight: 750; overflow-wrap: anywhere; }
    .nx-tl-card .tl-actions { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }

    .nx-tl-empty { padding: 40px 16px; text-align: center; color: var(--ink-soft); font-size: 13px; font-weight: 650; }
    @media (max-width: 760px) {

      .nx-tl-card .tl-main { grid-column: 1 / -1; }
      .nx-tl-card .tl-actions { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; }
    }

    .nx-notif-scrim { position: fixed; inset: 0; z-index: 109; background: transparent; }

    .nx-notif-item .ni-ic { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--chip); color: var(--tone, #f59e0b); margin-top: 1px; }

    .nx-notif-item .ni-count { min-width: 24px; height: 22px; padding: 0 7px; border-radius: 999px; display: grid; place-items: center; font-size: 12px; font-weight: 850; color: #fff; background: var(--tone, #f59e0b); }
    .nx-notif-item .ni-sev { font-size: 9px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--tone, #f59e0b); }

    .nx-notif-foot { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; border: 0; border-top: 1px solid var(--line); background: var(--panel); color: var(--ink-soft); font-size: 12px; font-weight: 750; cursor: pointer; transition: background .16s, color .16s; }
    .nx-notif-foot:hover { background: var(--kpi-ghost); color: var(--ink); }

    .nx-sourcing { display: flex; flex-direction: column; gap: 12px; margin-top: 2px; }
    .nx-srow { cursor: pointer; border-radius: 14px; padding: 10px 11px; border: 1px solid transparent; transition: background .16s, border-color .16s, transform .16s, box-shadow .16s; min-width: 0; }
    .nx-srow:hover, .nx-srow.active { background: var(--kpi-ghost); border-color: var(--line); transform: translateX(2px); box-shadow: var(--shadow); }

    .nx-srow .top .lab { font-size: 12.5px; font-weight: 850; display: inline-flex; align-items: center; gap: 8px; min-width: 0; line-height: 1.35; overflow-wrap: anywhere; }
    .nx-srow .top .lab i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .nx-srow .top .val { font-size: 12px; font-weight: 750; color: var(--ink-soft); white-space: nowrap; text-align: right; line-height: 1.35; }
    .nx-strack { height: 12px; border-radius: 7px; background: var(--chip); overflow: hidden; }
    .nx-strack i { display: block; height: 100%; border-radius: 7px; transition: width .4s cubic-bezier(.2, .8, .2, 1); }
    .nx-srow.unassigned { border-color: rgba(148,163,184,.35); background: rgba(148,163,184,.07); }
    .nx-srow.unassigned:hover, .nx-srow.unassigned.active { background: rgba(148,163,184,.14); }
    .nx-schips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

    .nx-swork-stats b { color: var(--ink); font-weight: 850; }
    .nx-swork-stats .warn b { color: #b45309; }
    .nx-swork-stats .ok { color: var(--brand-green, #10b981); font-weight: 800; }

    .nx-matrix { margin-top: 2px; overflow-x: auto; padding-bottom: 2px; }
    .nx-matrix table { width: 100%; border-collapse: separate; border-spacing: 6px; min-width: 520px; table-layout: fixed; }
    .nx-matrix th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; font-weight: 850; color: var(--ink-soft); padding: 4px 6px; text-align: center; line-height: 1.25; }
    .nx-matrix th.dep { text-align: left; }
    .nx-matrix td.dep { font-size: 12px; font-weight: 800; padding: 8px 8px 8px 0; line-height: 1.35; overflow-wrap: anywhere; }
    .nx-mcell {
      cursor: pointer;
      text-align: center;
      border-radius: 12px;
      padding: 10px 8px;
      font-size: 15px;
      font-weight: 850;

      border: 1px solid var(--line);

    .nx-mcell.zero { color: var(--ink-soft); opacity: .6; cursor: default; }
    .nx-mcell.zero:hover { transform: none; box-shadow: none; }

    .nx-jump { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--ink-soft); }
    .nx-jump input {

      height: 38px;
      border-radius: 12px;

      background: var(--panel-solid);

      outline: none;

    .nx-toasts { position: fixed; right: 22px; bottom: 22px; z-index: 100; display: flex; flex-direction: column; gap: 10px; max-width: min(340px, calc(100vw - 32px)); }
    .nx-toast { background: var(--panel-solid); border: 1px solid var(--line); border-left: 4px solid #f59e0b; border-radius: 14px; padding: 13px 15px; box-shadow: var(--shadow-lg); display: flex; gap: 11px; align-items: flex-start; animation: slidein .3s ease; }
    .nx-toast .t { font-weight: 800; font-size: 13px; margin-bottom: 2px; }
    .nx-toast .d { font-size: 12px; color: var(--ink-soft); line-height: 1.4; }

    @keyframes slidein {
      from { transform: translateX(40px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .nx-foot {
      padding: 18px 26px;
      border-top: 1px solid var(--line);
      color: var(--ink-soft);
      font-size: 11.5px;
      line-height: 1.55;
      text-align: center;
      display: flex;
      justify-content: center;
    }

      max-width: 1080px;
      overflow-wrap: anywhere;
    }

    .shimmer { background: linear-gradient(90deg, var(--chip) 25%, rgba(255, 255, 255, .5) 37%, var(--chip) 63%); background-size: 400% 100%; animation: sh 1.3s ease infinite; border-radius: 10px; }

    @keyframes sh {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    .nx-statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px; }
    .nx-stat { padding: 14px; border-radius: 14px; background: var(--kpi-ghost); border: 1px solid var(--line); }
    .nx-stat .value { font-size: 22px; font-weight: 850; margin-top: 4px; letter-spacing: 0; }

    .nx-modal-scrim {
      position: fixed;
      inset: 0;
      z-index: 140;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(3, 12, 25, .54);
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
      animation: modalFade .18s ease both;
    }

      max-height: min(820px, 88vh);

      display: flex;
      flex-direction: column;
      border-radius: 24px;
      border: 1px solid var(--line);
      background: var(--panel-solid);
      color: var(--ink);

    .nx-modal-head p { margin: 6px 0 0; color: rgba(255, 255, 255, .72); font-size: 12.5px; line-height: 1.45; overflow-wrap: anywhere; }
    .nx-modal-body { padding: 22px 24px 24px; overflow: auto; line-height: 1.6; }
    .nx-modal-grid {

    .nx-modal-stat {

      border: 1px solid var(--line);
      background: var(--kpi-ghost);

      padding: 14px 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 7px;

    .nx-modal-table-wrap {

      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel-solid);
    }

      min-width: 760px;
      border-collapse: collapse;
      font-size: 12px;
    }
    .nx-modal-table th, .nx-modal-table td {

    .nx-modal-table th {

      background: var(--chip);

      letter-spacing: .08em;

      font-weight: 850;
      white-space: nowrap;

    @keyframes modalSectionIn {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }

      function addDays(n) {
        const d = new Date();

      function fmtDate(d) {
        if (!d) return "No date";
        const date = d instanceof Date ? d : new Date(d);
        if (Number.isNaN(date.getTime())) return "No date";
        return date.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
      }

      function fmtMoney(n) {
        const value = Number(n) || 0;
        if (Math.abs(value) >= 1000000) return "$" + (value / 1000000).toFixed(2) + "M";
        return "$" + (value / 1000).toFixed(0) + "K";
      }

      function escapeHTML(value) {

          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function getKpis() {
        const total = state.data.filter(c => c.hasTcv !== false).reduce((sum, c) => sum + Number(c.annualSpend || 0), 0);
        const tail = state.data.filter(c => c.tail && c.hasTcv !== false).reduce((sum, c) => sum + Number(c.annualSpend || 0), 0);
        const avgRisk = state.data.length ? Math.round(state.data.reduce((sum, c) => sum + Number(c.riskScore || 0), 0) / state.data.length) : 0;
        const expiring = state.data.filter(c => Number.isFinite(c.daysOut) && c.daysOut >= 0 && c.daysOut <= 90).length;
        return {
          total,
          tail,
          tailPct: total ? Math.round((tail / total) * 100) : 0,
          avgRisk,
          expiring,
          expired: state.data.filter(c => Number.isFinite(c.daysOut) && c.daysOut < 0).length,
          noTcv: state.data.filter(c => c.hasTcv === false).length,
          missingExpiry: state.data.filter(c => !contractDate(c)).length,
          autoRenew: state.data.filter(isAutoRenewContract).length,
          terminate: state.data.filter(isTerminateContract).length,
          marketCheck: state.data.filter(isMarketCheckContract).length,
          active: state.data.length
        };

      function getCatData() {
        // Aggregate on the canonical category name so taxonomy variants merge into one
        // bar, and count only positive TCV so the chart reflects real, on-file spend.
        const map = new Map();
        state.data.forEach(c => {
          const name = canonicalCategoryName(c.category) || c.category || "Other / Needs Review";
          if (!map.has(name)) map.set(name, { name, spend: 0, count: 0, noTcv: 0 });
          const bucket = map.get(name);
          bucket.count += 1;
          if (c.hasTcv) bucket.spend += Number(c.annualSpend || 0);
          else bucket.noTcv += 1;
        });
        return Array.from(map.values())
          .map(d => ({ name: d.name, spend: Math.round(d.spend / 1000), count: d.count, noTcv: d.noTcv }))
          .sort((a, b) => b.spend - a.spend || b.count - a.count || a.name.localeCompare(b.name));
      }
