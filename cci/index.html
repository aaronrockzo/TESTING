      function render(opts = {}) {
        const kpis = getKpis();
        const pageMeta = {
          dashboard: { t: "Intelligence Hub", s: "Indirect spend, tail-spend optimization and risk" },
          expirations: { t: "Renewal Timeline", s: "30 / 60 / 90-day renewal command board" },
          upload: { t: "Secure Data Loader", s: "Upload contracts, run local intelligence" }
        };
        const pageBody = state.skeleton
          ? renderSkeleton()
          : state.page === "dashboard" ? renderDashboard() : state.page === "expirations" ? renderExpirations() : renderUploadPage();
        const localStatus = state.data.length ? "Local - " + kpis.active + " contracts" : "No data loaded";
        const managedText = state.data.length ? fmtMoney(kpis.total) + " managed" : "Ready for upload";
        const viewClass = opts.viewTransition ? "nx-view enter" : "nx-view";
        const alertCount = getAlertGroups().length;
        const tabs = NAV_ITEMS.map(item =>
          '<button class="nx-tab ' + (state.page === item.id ? 'active' : '') + '" data-page="' + item.id + '" type="button" aria-current="' + (state.page === item.id ? 'page' : 'false') + '">' + icon(item.icon, 15) + '<span>' + escapeHTML(item.label) + '</span></button>'
        ).join("");

        app.innerHTML = '<div class="nx ' + (state.theme === "dark" ? "dark" : "") + (opts.focusId ? " nx-no-anim" : "") + '"><div class="nx-shell"><div class="nx-main"><header class="nx-top"><div class="nx-brand"><div class="nx-logo">' + LOGO_SVG + '</div><div><h1>Corewell Contract Intelligence</h1><span>Private sourcing command</span></div></div><nav class="nx-nav" aria-label="Primary"><div class="nx-tabbar" role="tablist">' + tabs + '</div></nav><span class="nx-pill nx-hide-sm"><span class="dot"></span> ' + localStatus + '</span><span class="nx-pill nx-hide-sm">' + managedText + '</span><button type="button" class="nx-icbtn" data-action="open-genius" aria-label="Open Contract Genius">' + icon("sparkle", 18) + '</button><button type="button" class="nx-icbtn" id="notif-bell" data-action="notifications" aria-label="Notifications">' + icon("bell", 18) + (alertCount > 0 ? '<span class="nx-badge">' + alertCount + '</span>' : '') + '</button><button type="button" class="nx-icbtn" data-action="theme" aria-label="Toggle theme">' + (state.theme === "dark" ? icon("sun", 18) : icon("moon", 18)) + '</button></header><main class="nx-body"><div class="' + viewClass + '" data-view="' + state.page + '">' + pageBody + '</div></main><footer class="nx-foot"><span>&copy; 2026 Corewell Health. All rights reserved. Confidential - Internal Use Only. Built and maintained by Intern Aaron Hodor. Project sponsor: Allison Myers. This enterprise preview contains non-functional HIPAA/SOC2 workflow indicators and does not itself certify regulatory compliance.</span></footer></div></div>' + renderNotifications() + renderDrawer() + renderModal() + renderWelcome() + renderToasts() + renderContractLoader() + '<div id="chart-tooltip" class="nx-chart-tip" aria-hidden="true"></div></div>';

        wireEvents();

          const el = document.getElementById(opts.focusId);

            try { el.focus({ preventScroll: opts.preventScroll !== false }); }
            catch (err) { el.focus(); }
            if (typeof opts.cursor === "number" && el.setSelectionRange) el.setSelectionRange(opts.cursor, opts.cursor);
          }
        } else if (!opts.skipLayerFocus) {
          const layer = topLayer();
          if (layer && !layer.contains(document.activeElement)) {
            const focusable = layer.querySelector('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
            try { (focusable || layer).focus({ preventScroll: true }); }
            catch (err) { (focusable || layer).focus(); }
          }

        if (opts.scrollGenius) requestAnimationFrame(scrollGeniusToBottom);
        if (state.suggestOpen) requestAnimationFrame(fitSuggestionsPanel);

      function topLayer() {
        if (state.importing) return app.querySelector(".contract-loader");
        if (state.activeModal) return app.querySelector("[data-modal-card]");
        if (app.querySelector("[data-welcome-card]")) return app.querySelector("[data-welcome-card]");
        if (state.notifOpen) return app.querySelector(".nx-notif");
        if (state.drawerOpen) return app.querySelector(".nx-drawer");
        return null;
      }

      function wireEvents() {
        app.querySelectorAll("[data-page]").forEach(btn => {
          btn.addEventListener("click", () => {
            const changed = state.page !== btn.dataset.page;
            state.page = btn.dataset.page;
            state.tablePage = 1;
            state.menuOpen = false;
            state.notifOpen = false;
            if (changed) withSkeleton();
            else render();
          });
        });

        app.querySelectorAll("[data-run-reader]").forEach(btn => btn.addEventListener("click", runSmartReader));

        const geniusForm = document.getElementById("genius-form");
        const geniusInput = document.getElementById("genius-input");
        if (geniusForm && geniusInput) {
          geniusInput.addEventListener("input", e => { state.chatInput = e.target.value; });
          geniusInput.addEventListener("keydown", e => {
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              geniusForm.requestSubmit();
            }
          });
          geniusForm.addEventListener("submit", e => {
            e.preventDefault();
            e.stopPropagation();
            if (state.chatLoading) return;
            askContractGenius(geniusInput.value);
          });
        }

        app.querySelectorAll("[data-suggest-tab]").forEach(btn => {
          btn.addEventListener("click", e => {
            e.preventDefault();
            e.stopPropagation();
            state.suggestOpen = !state.suggestOpen;
            preserveWindowScroll(() => render({ focusId: state.suggestOpen ? "genius-input" : null, preventScroll: true, skipLayerFocus: true }));
          });
        });

        app.querySelectorAll("[data-genius-chip]").forEach(btn => {
          btn.addEventListener("click", e => {
            e.preventDefault();
            e.stopPropagation();
            if (state.chatLoading) return;
            state.suggestOpen = false;
            askContractGenius(btn.dataset.geniusChip);
          });
        });

        app.querySelectorAll("[data-suggest-id]").forEach(btn => {
          btn.addEventListener("mousedown", e => { e.preventDefault(); });
          btn.addEventListener("click", e => {
            e.preventDefault();
            e.stopPropagation();
            state.searchSuggestOpen = false;
            state.timelineSuggestOpen = false;
            state.activeSearchBox = null;
            const view = state.page === "expirations" ? "timeline" : "register";
            navigateToContract(btn.dataset.suggestId, { targetView: view, highlight: true });
          });
          btn.addEventListener("keydown", e => {
            if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
            e.preventDefault();
            const rows = [...app.querySelectorAll("[data-suggest-id]")];
            const index = rows.indexOf(btn);
            rows[(index + (e.key === "ArrowDown" ? 1 : -1) + rows.length) % rows.length]?.focus();
          });
        });

        const modalSearch = app.querySelector("[data-modal-search]");
        const applyModalRowFilter = () => {
          if (!modalSearch) return;
          const query = normalizeText(modalSearch.value);
          const active = app.querySelector(".nx-modal-filter.active")?.dataset.modalFilter || "all";
          app.querySelectorAll("[data-modal-row]").forEach(row => {
            const textMatch = !query || String(row.dataset.modalSearchText || "").includes(query);
            const chipMatch = active === "all" || (active === "high" && row.dataset.risk === "high") || (active === "urgent" && row.dataset.urgent === "true") || (active === "quality" && row.dataset.quality === "true");
            row.hidden = !(textMatch && chipMatch);
          });
        };
        if (modalSearch) modalSearch.addEventListener("input", applyModalRowFilter);
        app.querySelectorAll("[data-modal-filter]").forEach(btn => btn.addEventListener("click", () => {
          app.querySelectorAll("[data-modal-filter]").forEach(other => other.classList.toggle("active", other === btn));
          applyModalRowFilter();
        }));

        app.querySelectorAll("[data-open-contract]").forEach(btn => {
          btn.addEventListener("click", e => {
            e.stopPropagation();
            openContractModal(btn.dataset.openContract);
          });
        });

        app.querySelectorAll("[data-action]").forEach(el => {
          el.addEventListener("click", e => {
            const action = el.dataset.action;
            if (action === "theme") {
              state.theme = state.theme === "dark" ? "light" : "dark";
              saveTheme(state.theme);
            }
            if (action === "open-genius") {
              state.drawerOpen = true;
              state.notifOpen = false;
              preserveWindowScroll(() => render({ focusId: "genius-input", preventScroll: true, scrollGenius: true }));
              return;
            }
            if (action === "close-drawer") {
              state.drawerOpen = false;
              state.suggestOpen = false;
            }
            if (action === "close-modal") {
              closeModal();
              return;
            }
            if (action === "show-welcome") state.welcomeOpen = true;
            if (action === "close-welcome") state.welcomeOpen = false;
            if (action === "clear-chat") {
              state.chatMessages = [];
              state.chatInput = "";
              state.chatLoading = false;
              state.chatMessageSeq = 0;
              state.latestUserMessageId = null;
              state.suggestOpen = false;
              state.geniusMemory = { lastQuery: "", lastIntent: "", lastCompany: "", lastSupplier: "", lastOwner: "", lastContracts: [], lastCategory: "", lastRiskLevel: "", lastTimelineBucket: "", lastAnswerText: "", lastEmailDraft: "" };
              preserveWindowScroll(() => render({ focusId: "genius-input", preventScroll: true }));
              return;
            }
            if (action === "copy-answer") {
              copyLatestGeniusAnswer();
              return;
            }
            if (action === "save-insight") {
              saveLatestGeniusInsight();

        state.drawerOpen = true;

        preserveWindowScroll(() => render({ skipLayerFocus: true }));
        window.setTimeout(() => {
          try {
            const highPriority = state.data
              .map(c => {
                const score = priorityScore(c);
                const riskLevel = score >= 70 ? "High" : score >= 45 ? "Medium" : "Low";
                return {
                  id: c.id,
                  vendor: c.vendor,
                  contractNumber: c.contractNumber,
                  contractName: c.contractName,
                  category: c.category,
                  riskScore: score,
                  riskLevel,
                  tcv: c.hasTcv ? fmtMoney(c.totalContractValue) : c.tcvStatus,
                  expiry: fmtDate(contractDate(c)) + (Number.isFinite(c.daysOut) ? " (" + c.daysOut + "d)" : ""),
                  renewalType: c.renewalType,
                  disposition: c.disposition,
                  sourcingOwner: c.sourcingOwner,
                  anomaly: priorityReason(c),
                  leverage: [recommendedNextAction(c)]
                };
              })
              .sort((a, b) => b.riskScore - a.riskScore)
              .slice(0, 6);
            const kpis = getKpis();
            state.smartResult = {
              summary: kpis.expiring + " contracts renew within 90 days, " + kpis.expired + " are expired, " + kpis.noTcv + " have zero/missing TCV, and " + kpis.autoRenew + " contain auto-renewal signals.",
              vendors: highPriority

          } catch (err) {
            state.smartError = "The local reader did not complete. Try again after reloading the file.";

            requestAnimationFrame(() => {

      function anomalyFor(c, score) {
        if (Number.isFinite(c.daysOut) && c.daysOut <= 30) return "Urgent renewal window.";
        if (score >= 75 && c.annualSpend >= 400000) return "High spend concentration with elevated internal risk.";
        if (c.tail && c.riskScore >= 55) return "Tail-spend vendor carries above-average risk.";
        if (Number.isFinite(c.daysOut) && c.daysOut <= 90) return "Renewal window creates timing pressure.";
        return "Benchmark terms before next sourcing cycle.";
      }

      function leverageFor(c) {
        const levers = [];
        if (isMarketCheckContract(c)) levers.push("Confirm market-check sourcing plan.");
        if (c.tail) levers.push("Bundle with adjacent tail-spend vendors.");
        if (Number.isFinite(c.daysOut) && c.daysOut <= 90) levers.push("Use renewal timing to reopen pricing.");
        if (c.annualSpend >= 300000) levers.push("Anchor discount ask to annual volume.");
        if (levers.length < 2) levers.push("Request benchmark pricing and SLA credits.");
        if (levers.length < 3) levers.push("Tighten renewal terms and notice windows.");
        return levers.slice(0, 3);
      }

      function detectCSVDelimiter(text) {
        const counts = { ",": 0, "\t": 0, ";": 0, "|": 0 };
        let quoted = false;
        let lines = 0;
        for (let i = 0; i < Math.min(text.length, 8000); i += 1) {
          const ch = text[i];
          const next = text[i + 1];
          if (ch === '"') {
            if (quoted && next === '"') i += 1;
            else quoted = !quoted;
          } else if (!quoted && Object.prototype.hasOwnProperty.call(counts, ch)) {
            counts[ch] += 1;
          } else if (!quoted && (ch === "\n" || ch === "\r")) {
            if (ch === "\r" && next === "\n") i += 1;
            lines += 1;
            if (lines >= 8) break;
          }
        }
        return Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0] || ",";
      }

      function parseCSV(text) {
        text = String(text || "").replace(/^\uFEFF/, "");
        const delimiter = detectCSVDelimiter(text);
        const rows = [];
        let row = [];
        let field = "";
        let quoted = false;
        let physicalRowNumber = 1;
        for (let i = 0; i < text.length; i += 1) {
          const ch = text[i];
          const next = text[i + 1];
          if (ch === '"') {
            if (quoted && next === '"') {
              field += '"';
              i += 1;
            } else {
              quoted = !quoted;
            }
          } else if (ch === delimiter && !quoted) {
            row.push(field);
            field = "";
          } else if ((ch === "\n" || ch === "\r") && !quoted) {
            if (ch === "\r" && next === "\n") i += 1;
            row.push(field);
            row.__sourceRowNumber = physicalRowNumber;
            if (row.some(cell => String(cell).trim())) rows.push(row);
            row = [];
            field = "";
            physicalRowNumber += 1;
          } else {
            field += ch;
          }
        }
        row.push(field);
        row.__sourceRowNumber = physicalRowNumber;
        if (row.some(cell => String(cell).trim())) rows.push(row);
        if (!rows.length) return [];
        let headerIndex = 0;
        let bestStrength = -1;
        rows.slice(0, 25).forEach((cells, i) => {
          const strength = headerRowStrength(cells);
          if (strength > bestStrength) {
            bestStrength = strength;
            headerIndex = i;
          }
        });
        if (bestStrength < 2) headerIndex = 0;
        const headers = rows[headerIndex].map((h, i) => String(h || "").trim() || ("Column " + (i + 1)));
        const parsedRows = rows.slice(headerIndex + 1).map((cells, rowOffset) => {
          if (duplicateHeaderLike(cells, headers, bestStrength)) return null;
          const obj = {};
          headers.forEach((header, i) => { obj[header || ("Column " + (i + 1))] = cells[i] ?? ""; });
          obj.__sheetName = "CSV upload";
          obj.__rowNumber = cells.__sourceRowNumber || (headerIndex + rowOffset + 2);
          return obj;
        }).filter(Boolean);
        parsedRows.__workbookAudit = { selectedSheet: "CSV upload", headerRow: rows[headerIndex].__sourceRowNumber || (headerIndex + 1), confidence: bestStrength };
        return parsedRows;
      }

      function cleanCell(value) {
        if (value == null) return "";
        return String(value)
          .replace(/\u00a0/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function isBlankish(value) {
        const text = cleanCell(value);
        return !text || text === "?" || text === " ";
      }

      function cleanTextField(value, allowNumericPlaceholder = false) {
        const text = cleanCell(value);
        if (!text || text === "?") return "";
        if (!allowNumericPlaceholder && text === "91") return "";
        return text;
      }

      function normalizeText(value) {
        return cleanCell(value)
          .toLowerCase()
          .replace(/&/g, " and ")
          .replace(/[^a-z0-9]+/g, " ")
          .trim();
      }

      function compactText(value) {
        return normalizeText(value).replace(/\s+/g, "");
      }

      function levenshtein(a, b) {
        if (a === b) return 0;
        if (!a.length) return b.length;
        if (!b.length) return a.length;
        const prev = Array.from({ length: b.length + 1 }, (_, i) => i);
        const curr = new Array(b.length + 1);
        for (let i = 1; i <= a.length; i += 1) {
          curr[0] = i;
          for (let j = 1; j <= b.length; j += 1) {
            const cost = a[i - 1] === b[j - 1] ? 0 : 1;
            curr[j] = Math.min(curr[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost);
          }
          for (let j = 0; j <= b.length; j += 1) prev[j] = curr[j];
        }
        return prev[b.length];
      }

      function tokenScore(a, b) {
        const left = normalizeText(a).split(" ").filter(Boolean);
        const right = normalizeText(b).split(" ").filter(Boolean);
        if (!left.length || !right.length) return 0;
        const overlap = left.filter(t => right.includes(t)).length;
        return overlap / Math.max(left.length, right.length);
      }

      function headerScore(header, aliases) {
        const h = normalizeText(header);
        const hc = compactText(header);
        if (!h) return 0;
        return aliases.reduce((best, alias) => {
          const a = normalizeText(alias);
          const ac = compactText(alias);
          let score = 0;
          if (h === a || hc === ac) score = 1;
          // Header fully contains the alias phrase -> strong, specific match
          else if (h.includes(a) && a.length >= 4) score = .9;
          else if (hc.includes(ac) && ac.length >= 4) score = .86;
          // Header is only a fragment of a longer alias (e.g. "contract" inside "contract sponsor")
          // -> scale by coverage so a generic token does not claim every related field
          else if (a.includes(h) && h.length >= 4) score = Math.max(.44, .9 * (h.length / a.length));
          else if (ac.includes(hc) && hc.length >= 4) score = Math.max(.42, .86 * (hc.length / ac.length));
          score = Math.max(score, tokenScore(h, a) * .72);
          const distanceBase = Math.max(hc.length, ac.length, 1);
          score = Math.max(score, (1 - levenshtein(hc, ac) / distanceBase) * .78);
          return Math.max(best, score);
        }, 0);
      }

      function buildHeaderMap(rows) {
        const headers = [...new Set(rows.flatMap(row => Object.keys(row || {})))];
        const fields = {};
        const scores = {};
        Object.entries(HEADER_DICTIONARY).forEach(([field, aliases]) => {
          let best = { key: null, score: 0 };
          headers.forEach(header => {
            const score = headerScore(header, aliases);
            if (score > best.score) best = { key: header, score };
          });
          const strictFields = ["contractSubType", "contractType", "entityDescription", "contractAdministrator", "responsibleVP", "responsibleDirector", "contractSponsor", "authorizedSignatory", "sourcingOwner", "sourcingResponsibility", "categoryLevel2", "disposition", "dispositionNotes", "executionDate", "executionQuarter", "executionBusinessDays", "noticeDeadline"];
          const minScore = field === "categoryLevel2" ? .8 : (strictFields.includes(field) ? .62 : .46);
          if (best.key && best.score >= minScore) {
            fields[field] = best.key;
            scores[field] = Number(best.score.toFixed(2));
          }
        });
        return { fields, scores };
      }

      function mappedValue(row, headerMap, field) {
        const key = headerMap.fields[field];
        return key ? row[key] : undefined;
      }

      function parseMoney(raw) {
        if (isBlankish(raw)) return null;
        if (typeof raw === "number") return Number.isFinite(raw) ? Math.round(raw) : null;
        let text = cleanCell(raw);
        // Explicit non-numeric placeholders are "no value on file", not zero.
        if (/^(tbd|to be determined|n\/?a|none|null|nil|free|no charge|no cost|waived|pending|unknown|varies|various|see notes?|see contract|at cost|cost plus)$/i.test(text)) return null;
        // A bare percentage is a rate, not a contract value.
        if (/^[-+]?\d+(?:\.\d+)?\s*%$/.test(text)) return null;
        const negative = /^\(.*\)$/.test(text) || /^-/.test(text) || /\bcr\b/i.test(text);
        let multiplier = 1;
        if (/(billion|bn)\b/i.test(text)) multiplier = 1000000000;
        else if (/(million|mm|mn)\b/i.test(text)) multiplier = 1000000;
        else if (/(thousand)\b/i.test(text)) multiplier = 1000;
        else {
          const suffix = /(\d)\s*([kmb])\s*\)?$/i.exec(text);
          if (suffix) multiplier = { k: 1000, m: 1000000, b: 1000000000 }[suffix[2].toLowerCase()] || 1;
        }
        // Drop currency codes/words and per-period suffixes so they don't corrupt digits.
        let numeric = text.replace(/\b(usd|us\$|eur|gbp|cad|aud|dollars?|euros?|pounds?)\b/gi, " ")
          .replace(/\b(per|\/)\s*(year|yr|annum|month|mo|quarter|qtr|week|wk|day)\b/gi, " ")
          .replace(/\bannually|\bmonthly|\byearly/gi, " ");
        // European decimal format: 1.234.567,89 (dot thousands) or 1234,56 (comma decimal).
        const euroDecimal = /^[^\d-]*\d{1,3}(?:\.\d{3})*,\d{1,2}[^\d]*$/.test(numeric);
        const euroDots = /^[^\d-]*\d{1,3}(?:\.\d{3}){2,}[^\d]*$/.test(numeric);
        if (euroDecimal || euroDots) numeric = numeric.replace(/\./g, "").replace(",", ".");
        else numeric = numeric.replace(/,/g, "");
        numeric = numeric.replace(/[^0-9.\-]/g, "");
        // Collapse any stray extra decimal points to keep Number() well-defined.
        const firstDot = numeric.indexOf(".");
        if (firstDot !== -1) numeric = numeric.slice(0, firstDot + 1) + numeric.slice(firstDot + 1).replace(/\./g, "");
        if (!/\d/.test(numeric)) return null;
        const n = Number(numeric);
        if (!Number.isFinite(n)) return null;
        return Math.round(Math.abs(n * multiplier) * (negative ? -1 : 1));
      }

      function median(values) {
        const clean = values.filter(v => Number.isFinite(v) && v > 0).sort((a, b) => a - b);
        if (!clean.length) return 125000;
        return clean[Math.floor(clean.length / 2)];
      }

      function excelSerialToDate(serial) {
        if (!Number.isFinite(serial)) return null;
        return new Date(Math.round((serial - 25569) * 86400000));
      }

      const MONTH_INDEX = {
        jan: 0, january: 0, feb: 1, february: 1, mar: 2, march: 2, apr: 3, april: 3,
        may: 4, jun: 5, june: 5, jul: 6, july: 6, aug: 7, august: 7,
        sep: 8, sept: 8, september: 8, oct: 9, october: 9, nov: 10, november: 10, dec: 11, december: 11
      };

      function safeDate(year, monthIndex, day) {
        if (!Number.isFinite(year) || !Number.isFinite(monthIndex) || !Number.isFinite(day)) return null;
        const date = new Date(year, monthIndex, day);
        return date.getFullYear() === year && date.getMonth() === monthIndex && date.getDate() === day ? date : null;
      }

      function lastDayOfMonth(year, monthIndex) {
        return new Date(year, monthIndex + 1, 0);
      }

      function fullYear(value) {
        const n = Number(value);
        if (!Number.isFinite(n)) return n;
        if (n >= 100) return n;
        // Two-digit pivot: 00-69 -> 2000s, 70-99 -> 1900s.
        return n <= 69 ? 2000 + n : 1900 + n;
      }

      function daysUntil(date) {
        if (!(date instanceof Date) || Number.isNaN(date.getTime())) return null;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const target = new Date(date);
        target.setHours(0, 0, 0, 0);
        return Math.ceil((target - today) / 86400000);
      }

      function parseDateValue(raw, options = false) {
        if (typeof options === "boolean") options = { allowDayBucket: options };
        const allowDayBucket = Boolean(options.allowDayBucket);
        const dateOrder = options.dateOrder === "DMY" ? "DMY" : "MDY";
        const rawText = cleanCell(raw);
        const ok = date => Number.isFinite(daysUntil(date)) ? { date, days: daysUntil(date), raw: rawText } : { date: null, days: null, raw: rawText };
        const fail = { date: null, days: null, raw: rawText };
        if (isBlankish(raw)) return fail;
        if (typeof raw === "number") {
          if (raw > 10000) return ok(excelSerialToDate(raw));
          if (!allowDayBucket && Number.isInteger(raw) && raw >= 1990 && raw <= 2100) return ok(lastDayOfMonth(raw, 11));
          if (allowDayBucket) { const days = Math.round(raw); return { date: addDays(days), days, raw: rawText }; }
          return fail;
        }
        const text = rawText;
        const compact = text.replace(/,/g, "");
        const numberOnly = Number(compact);
        if (Number.isFinite(numberOnly) && /^-?\d+(?:\.\d+)?$/.test(compact)) {
          if (numberOnly > 10000) return ok(excelSerialToDate(numberOnly));
          // A bare 4-digit calendar year resolves to end of that year (renewal/expiry context).
          if (!allowDayBucket && /^\d{4}$/.test(compact) && numberOnly >= 1990 && numberOnly <= 2100) return ok(lastDayOfMonth(numberOnly, 11));
          if (allowDayBucket) { const days = Math.round(numberOnly); return { date: addDays(days), days, raw: rawText }; }
          return fail;
        }
        if (allowDayBucket) {
          const dayMatch = /(-?\d+(?:\.\d+)?)\s*(day|days|d)\b/i.exec(text);
          if (dayMatch) { const days = Math.round(Number(dayMatch[1])); return { date: addDays(days), days, raw: rawText }; }
          const monthMatch = /(-?\d+(?:\.\d+)?)\s*(month|months|mo)\b/i.exec(text);
          if (monthMatch) { const days = Math.round(Number(monthMatch[1]) * 30.44); return { date: addDays(days), days, raw: rawText }; }
          const yearMatch = /(-?\d+(?:\.\d+)?)\s*(year|years|yr)\b/i.exec(text);
          if (yearMatch) { const days = Math.round(Number(yearMatch[1]) * 365.25); return { date: addDays(days), days, raw: rawText }; }
        }
        // ISO 8601: YYYY-MM-DD (also covers YYYY/MM/DD via the separated-numeric branch)
        const isoDate = /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/.exec(text);
        if (isoDate) return ok(safeDate(Number(isoDate[1]), Number(isoDate[2]) - 1, Number(isoDate[3])));
        // Separated numeric dates: a/b/year with / . or - separators, order detected per column
        const sep = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/.exec(text);
        if (sep) {
          const first = Number(sep[1]);
          const second = Number(sep[2]);
          const year = fullYear(sep[3]);
          let order = dateOrder;
          if (first > 12 && second <= 12) order = "DMY";
          else if (second > 12 && first <= 12) order = "MDY";
          const month = (order === "DMY" ? second : first) - 1;
          const day = order === "DMY" ? first : second;
          const date = safeDate(year, month, day);
          return date ? ok(date) : fail;
        }
        // Month-name dates: "Jan 5, 2026", "5 Jan 2026", "5-Jan-26"
        const monthNameMid = /^([a-z]{3,9})\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{2,4})$/i.exec(text);
        if (monthNameMid && monthNameMid[1].toLowerCase() in MONTH_INDEX) {
          const date = safeDate(fullYear(monthNameMid[3]), MONTH_INDEX[monthNameMid[1].toLowerCase()], Number(monthNameMid[2]));
          if (date) return ok(date);
        }
        const dayMonthName = /^(\d{1,2})(?:st|nd|rd|th)?[\s\-]([a-z]{3,9})\.?[\s\-](\d{2,4})$/i.exec(text);
        if (dayMonthName && dayMonthName[2].toLowerCase() in MONTH_INDEX) {
          const date = safeDate(fullYear(dayMonthName[3]), MONTH_INDEX[dayMonthName[2].toLowerCase()], Number(dayMonthName[1]));
          if (date) return ok(date);
        }
        // Quarter: "Q2 2026", "2026 Q2", "2026-Q2" -> last day of quarter
        const qFront = /^q([1-4])[\s\-]?(\d{4})$/i.exec(text);
        const qBack = /^(\d{4})[\s\-]?q([1-4])$/i.exec(text);
        if (qFront || qBack) {
          const q = Number(qFront ? qFront[1] : qBack[2]);
          const year = Number(qFront ? qFront[2] : qBack[1]);
          return ok(lastDayOfMonth(year, q * 3 - 1));
        }
        // Month + year only: "Jan 2026", "January 2026" -> last day of that month
        const monthYear = /^([a-z]{3,9})\.?[\s\-](\d{4})$/i.exec(text);
        if (monthYear && monthYear[1].toLowerCase() in MONTH_INDEX) {
          return ok(lastDayOfMonth(Number(monthYear[2]), MONTH_INDEX[monthYear[1].toLowerCase()]));
        }
        const parsed = new Date(text);
        return Number.isFinite(daysUntil(parsed)) ? ok(parsed) : fail;
      }

      function detectDateOrder(rows, headerMap) {
        const keys = [headerMap.fields.expiryDate, headerMap.fields.timeline, headerMap.fields.noticeDeadline, headerMap.fields.executionDate].filter(Boolean);
        if (!keys.length) return "MDY";
        let dmy = 0;
        let mdy = 0;
        rows.slice(0, 300).forEach(row => {
          keys.forEach(key => {
            const match = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-]\d{2,4}$/.exec(cleanCell(row[key]));
            if (!match) return;
            const first = Number(match[1]);
            const second = Number(match[2]);
            if (first > 12 && second <= 12) dmy += 1;
            else if (second > 12 && first <= 12) mdy += 1;
          });
        });
        return dmy > mdy ? "DMY" : "MDY";
      }

      function parseTimeline(raw, index, options = {}) {
        const parsed = parseDateValue(raw, { allowDayBucket: Boolean(options.allowDayBucket), dateOrder: options.dateOrder });
        return Number.isFinite(parsed.days) ? parsed.days : null;
      }

      function statusFromDays(days) {
        if (!Number.isFinite(days)) return "No Date";
        if (days < 0) return "Expired";
        if (days <= 30) return "Critical";
        if (days <= 90) return "Renewal";
        return "Active";
      }

      function leastUsedCategory(counts, index) {
        const categories = Object.keys(CATEGORY_COLORS);
        return categories
          .map((name, offset) => ({ name, count: counts[name] || 0, offset: (offset + index) % categories.length }))
          .sort((a, b) => a.count - b.count || a.offset - b.offset)[0].name;
      }

      function canonicalCategoryName(name) {
        const text = cleanTextField(name, true);
        if (!text) return "";
        const exact = Object.keys(CATEGORY_COLORS).find(key => normalizeText(key) === normalizeText(text));
        const normalized = CATEGORY_NORMALIZATION[exact || text] || CATEGORY_NORMALIZATION[text];
        return normalized || exact || text;
      }

      function rowValueByHeaderAlias(row, aliases) {
        let best = { value: "", score: 0 };
        Object.entries(row || {}).forEach(([key, value]) => {
          if (key.startsWith("__") || isBlankish(value)) return;
          aliases.forEach(alias => {
            const score = headerScore(key, [alias]);
            if (score > best.score) best = { value, score };
          });
        });
        return best.score >= .48 ? cleanTextField(best.value, true) : "";
      }

      function scoreCategoryText(text) {
        const value = cleanTextField(text, true);
        if (!value) return { name: "", score: 0 };
        const normalizedValue = normalizeText(value);
        let best = { name: "", score: 0 };
        Object.entries(CATEGORY_KEYWORDS).forEach(([category, aliases]) => {
          const categoryName = canonicalCategoryName(category);
          let score = headerScore(value, [category, categoryName, ...aliases]) * .88;
          aliases.forEach(alias => {
            const a = normalizeText(alias);
            if (a.length > 2 && normalizedValue.includes(a)) score = Math.max(score, .94);
            score = Math.max(score, tokenScore(normalizedValue, a) * .84);
          });
          score = Math.max(score, (1 - levenshtein(compactText(value), compactText(categoryName)) / Math.max(compactText(value).length, compactText(categoryName).length, 1)) * .72);
          if (score > best.score) best = { name: categoryName, score };
        });
        return best;
      }

      function mapCategory(raw, row, index, counts) {
        const rawCategory = cleanTextField(raw, true) || rowValueByHeaderAlias(row, ["category", "category level 1", "category level 2", "commodity", "unspsc", "service line"]);
        const sourceText = normalizeText(rawCategory);
        const sourceIsUseful = rawCategory && !/(other|unknown|misc|uncategorized|needs review|not provided|n a|na)$/.test(sourceText);
        if (sourceIsUseful) {
          const scored = scoreCategoryText(rawCategory);
          if (scored.score >= .42) {
            return {
              category: scored.name,
              rawCategory,
              normalizedCategory: scored.name,
              categoryConfidence: Number(Math.max(.78, scored.score).toFixed(2)),
              categorySource: "source-column",
              categoryReviewFlag: ""
            };
          }
          return {
            category: rawCategory,
            rawCategory,
            normalizedCategory: rawCategory,
            categoryConfidence: .72,
            categorySource: "source-column",
            categoryReviewFlag: "Source category kept; canonical healthcare category needs review"
          };
        }

        const hintGroups = [
          { source: "keyword-contract-name", value: [rowValueByHeaderAlias(row, ["contract name", "agreement title", "contract title"]), rowValueByHeaderAlias(row, ["contract description", "scope", "service description"])].join(" ") },
          { source: "keyword-vendor", value: rowValueByHeaderAlias(row, ["supplier name", "vendor name", "vendor legal name", "counterparty", "payee"]) },
          { source: "keyword-request-area", value: [rowValueByHeaderAlias(row, ["request area", "request type", "request area"]), rowValueByHeaderAlias(row, ["entity description", "service line", "department"])].join(" ") },
          { source: "keyword-contract-type", value: [rowValueByHeaderAlias(row, ["contract type", "contract subtype", "subtype"]), rowValueByHeaderAlias(row, ["disposition", "recommended action", "notes"])].join(" ") }
        ];
        let best = { name: "", source: "needs-review", score: 0 };
        hintGroups.forEach(group => {
          const scored = scoreCategoryText(group.value);
          if (scored.score > best.score) best = { name: scored.name, source: group.source, score: scored.score };
        });
        if (best.name && best.score >= .5) {
          return {
            category: best.name,
            rawCategory: rawCategory || "",
            normalizedCategory: best.name,
            categoryConfidence: Number(best.score.toFixed(2)),
            categorySource: best.source,
            categoryReviewFlag: best.score < .65 ? "Category assigned from keywords; review recommended" : ""
          };
        }
        return {
          category: "Other / Needs Review",
          rawCategory: rawCategory || "",
          normalizedCategory: "Other / Needs Review",
          categoryConfidence: .2,
          categorySource: "needs-review",
          categoryReviewFlag: "Category needs review"
        };
      }

      function parseSourcing(raw, row, index) {
        const text = normalizeText(raw);
        if (!text) return "Unknown";
        if (/(sole|sole source|exclusive|only supplier|no alternate)/.test(text)) return "Sole Source";
        if (/(single|one supplier)/.test(text)) return "Single Source";
        if (/(multi|multiple|competitive|bid|rfp|dual)/.test(text)) return "Multi Source";
        return "Unknown";
      }

      function parseRisk(raw, spend, days, sourcing) {
        const text = normalizeText(raw);
        const numeric = Number(String(raw ?? "").replace(/[^0-9.-]/g, ""));
        if (Number.isFinite(numeric) && numeric > 0) return clamp(Math.round(numeric <= 5 ? numeric * 20 : numeric), 0, 100);
        if (/high|critical|red/.test(text)) return 82;
        if (/medium|moderate|amber|yellow/.test(text)) return 58;
        if (/low|green/.test(text)) return 28;
        const spendLift = Math.min(24, Math.round((spend || 0) / 45000));
        const expiryLift = !Number.isFinite(days) ? 8 : days < 0 ? 22 : days <= 30 ? 24 : days <= 60 ? 16 : days <= 90 ? 10 : 0;
        const sourceLift = /single|sole/i.test(sourcing || "") ? 8 : 0;
        return clamp(28 + spendLift + expiryLift + sourceLift, 0, 95);
      }

      function hasText(value) {
        const text = normalizeText(cleanTextField(value, true));
        return Boolean(text && !/^(unassigned|unknown|not provided|n a|na|none|tbd|to be determined|pending|vacant|open)$/.test(text));
      }

      // Normalize a person/owner name so the same human is grouped consistently,
      // regardless of casing, "Last, First" order, surrounding quotes, titles, or
      // trailing credentials. Conservative: anything that does not look like a
      // simple person name (companies, free text, values with digits) is returned
      // lightly cleaned so we never mangle non-name fields such as signatory clauses.
      function canonicalPersonName(raw) {
        let text = cleanTextField(raw, true);
        if (!text) return "";
        text = text.replace(/^["'\s]+|["'\s]+$/g, "");
        if (!text || /^(unassigned|unknown|not provided|n\/?a|none|tbd|pending|vacant|open)$/i.test(text)) return "";
        // If it carries an email, prefer the human-readable part before it.
        const emailSplit = text.split(/\s*[<(]?[\w.+-]+@[\w.-]+\.[a-z]{2,}[>)]?\s*/i)[0].trim();
        if (emailSplit && /[a-z]/i.test(emailSplit)) text = emailSplit;
        const looksLikeCompany = /\b(inc|llc|l\.l\.c|corp|corporation|co|ltd|llp|plc|group|services|service|company|partners|associates|systems|solutions|health|hospital|university|department|dept|team|office|division)\b/i.test(text);
        const wordCount = text.split(/\s+/).filter(Boolean).length;
        const hasDigits = /\d/.test(text);
        // "Last, First Middle" -> "First Middle Last" (only for real-looking names).
        // Guard against "Name, Title/Credential" (e.g. "Smith, CFO") which must NOT reorder.
        const ROLE_AFTER_COMMA = /^(cfo|ceo|coo|cio|cto|vp|svp|evp|avp|director|sr director|manager|mgr|president|chief|officer|lead|analyst|buyer|specialist|coordinator|administrator|admin|counsel|sourcing|procurement|esq|esquire)\b/i;
        if (!looksLikeCompany && !hasDigits && /^[^,]+,[^,]+$/.test(text)) {
          const [last, rest] = text.split(",").map(s => s.trim());
          if (last && rest && !ROLE_AFTER_COMMA.test(rest) && last.split(/\s+/).length <= 3 && rest.split(/\s+/).length <= 3) text = rest + " " + last;
        }
        if (!looksLikeCompany && !hasDigits && wordCount <= 4) {
          text = text.replace(/^(dr|mr|mrs|ms|miss|prof|sir|rev)\.?\s+/i, "");
          text = text.replace(/[,]?\s*\b(rn|md|do|mba|cpa|cpm|cpsm|phd|jd|esq|pmp|chfp|fache|bsn|msn|pa|np|aprn)\b\.?/gi, "");
          // Normalize per-token casing so the same human always displays identically.
          // Leave intentionally mixed-case tokens (McDonald, DeVos, O'Brien) untouched.
          text = text.split(/\s+/).map(tok => {
            if (!tok || (/[a-z]/.test(tok) && /[A-Z]/.test(tok))) return tok;
            return tok.toLowerCase()
              .replace(/^([a-z])/, (m, c) => c.toUpperCase())
              .replace(/^(mc)([a-z])/, (m, a, b) => "Mc" + b.toUpperCase())
              .replace(/[-'.]([a-z])/g, (m, c) => m[0] + c.toUpperCase());
          }).join(" ");
        }
        return text.replace(/\s+/g, " ").trim();
      }

      // Stable grouping key for an owner: same human -> same key.
      function ownerKey(raw) {
        return normalizeText(canonicalPersonName(raw));
      }

      function isAutoRenewContract(c) {
        return /auto\s*-?\s*renew|automatically|evergreen|perpetual/i.test([c.renewalType, c.disposition, c.dispositionNotes].join(" "));
      }

      function isEvergreenContract(c) {
        return /evergreen|perpetual|continues until terminated/i.test([c.renewalType, c.disposition, c.dispositionNotes].join(" "));
      }

      function isTerminateContract(c) {
        return /terminate|let expire|expiration/i.test([c.disposition, c.dispositionNotes].join(" "));
      }

      function isMarketCheckContract(c) {
        return /market check|sourcing|renew\s*-?\s*reduce/i.test([c.disposition, c.dispositionNotes].join(" "));
      }

      function isSoleOrSingleSource(c) {
        return /sole source|single source/i.test([c.sourceType, c.sourcingProfile, c.sourcing].join(" "));
      }

      function healthcareCategoryRisk(c) {
        const text = normalizeText([c.category, c.normalizedCategory, c.rawCategory, c.requestArea, c.contractType].join(" "));
        if (/clinical supplies|lab diagnostics|medical equipment|biomedical|pharmacy|it software telecom|revenue cycle|patient access/.test(text)) return 8;
        if (/facilities|construction|environmental services|waste|staffing|workforce|logistics|distribution|purchased services/.test(text)) return 5;
        if (/insurance|legal|compliance/.test(text)) return 4;
        return 0;
      }

      function missingOwnershipFields(c) {
        return [
          ["Sourcing Owner", c.sourcingOwner],
          ["Authorized Signatory", c.authorizedSignatory],
          ["Responsible VP", c.responsibleVP],
          ["Contract Administrator", c.contractAdministrator],
          ["Contract Sponsor", c.contractSponsor],
          ["Responsible Director", c.responsibleDirector]
        ].filter(([, value]) => !hasText(value)).map(([label]) => label);
      }

      function dataQualityFlagsFor(c) {
        const flags = [];
        if (!hasText(c.contractNumber)) flags.push("Missing contract number");
        if (!hasText(c.supplierName)) flags.push("Missing supplier name");
        if (!contractDate(c)) flags.push(c.expiryDateRaw ? "Expiry date could not be parsed" : "Missing expiry date");
        if (!c.hasTcv) flags.push(c.tcvStatus);
        if (c.categoryReviewFlag) flags.push(c.categoryReviewFlag);
        else if (c.categorySource === "needs-review" || (Number.isFinite(c.categoryConfidence) && c.categoryConfidence < .5)) flags.push("Category needs review");
        missingOwnershipFields(c).forEach(label => flags.push("Missing " + label));
        if (isAutoRenewContract(c) && !c.noticeDeadlineDate) flags.push("Auto-renew notice deadline not mapped");
        if (isAutoRenewContract(c) && isTerminateContract(c)) flags.push("Auto-renew / terminate conflict");
        return flags;
      }

      function qualityFlags(c) {
        return c.dataQualityFlags && c.dataQualityFlags.length ? c.dataQualityFlags : dataQualityFlagsFor(c);
      }

      function fieldMapScore(headerMap, fields) {
        return fields.reduce((best, field) => Math.max(best, Number(headerMap?.scores?.[field]) || 0), 0);
      }

      function buildImportConfidence(rows, headerMap, audit, metadata = {}) {
        const total = Math.max(rows.length, 1);
        const dimensions = [
          { label: "Supplier / vendor", fields: ["supplierName", "vendor"], weight: 14 },
          { label: "Contract name / number", fields: ["contractName", "contractNumber"], weight: 13 },
          { label: "Expiration / renewal date", fields: ["expiryDate", "timeline"], weight: 15 },
          { label: "TCV / contract value", fields: ["totalContractValue", "spend", "annualValue"], weight: 13 },
          { label: "Owner / sponsor / signatory", fields: ["sourcingOwner", "sourcingResponsibility", "contractSponsor", "responsibleDirector", "contractAdministrator", "authorizedSignatory"], weight: 13 },
          { label: "Category", fields: ["category", "categoryLevel1", "categoryLevel2"], weight: 10 },
          { label: "Risk / renewal status", fields: ["risk", "renewalType", "disposition", "noticeDeadline"], weight: 8 }
        ];
        const weightTotal = dimensions.reduce((sum, item) => sum + item.weight, 0);
        const mappingScore = dimensions.reduce((sum, item) => sum + fieldMapScore(headerMap, item.fields) * item.weight, 0) / weightTotal;
        const missingExpiry = rows.filter(c => !contractDate(c)).length;
        const missingOwners = rows.filter(c => !hasText(c.sourcingOwner) && !hasText(c.contractSponsor) && !hasText(c.responsibleDirector) && !hasText(c.contractAdministrator)).length;
        const missingTcv = rows.filter(c => !c.hasTcv).length;
        const categoryReview = rows.filter(c => c.categorySource === "needs-review" || c.categoryReviewFlag).length;
        const suspicious = rows.filter(c => qualityFlags(c).some(flag => /duplicate|conflict|summary|header/i.test(flag))).length + (metadata.duplicateRowsFound || 0);
        const unmapped = metadata.unmappedFields || [];
        const qualityPenalty =
          (missingExpiry / total) * .25 +
          (missingOwners / total) * .25 +
          (missingTcv / total) * .25 +
          (categoryReview / total) * .15 +
          (suspicious / total) * .15 +
          Math.min(.18, unmapped.length * .012);
        const qualityScore = clamp(1 - qualityPenalty, .08, 1);
        const score = clamp(Math.round(mappingScore * 55 + qualityScore * 45), 5, 99);
        const missingCriticalFields = dimensions.filter(item => fieldMapScore(headerMap, item.fields) < .46).map(item => item.label);
        const risks = [
          missingCriticalFields.length ? "Critical fields not confidently mapped: " + missingCriticalFields.join(", ") : null,
          missingExpiry ? missingExpiry + " contract" + (missingExpiry === 1 ? " has" : "s have") + " no usable expiration or renewal date" : null,
          missingOwners ? missingOwners + " contract" + (missingOwners === 1 ? " has" : "s have") + " no detected owner, sponsor, director, or administrator" : null,
          missingTcv ? missingTcv + " contract" + (missingTcv === 1 ? " has" : "s have") + " missing or zero TCV; no value was estimated" : null,
          categoryReview ? categoryReview + " categor" + (categoryReview === 1 ? "y needs" : "ies need") + " source validation" : null,
          suspicious ? suspicious + " duplicate or suspicious row" + (suspicious === 1 ? " requires" : "s require") + " review" : null,
          unmapped.length ? unmapped.length + " source column" + (unmapped.length === 1 ? " was" : "s were") + " preserved but not mapped" : null
        ].filter(Boolean).slice(0, 6);
        return {
          score,
          label: confidenceLabel(score),
          mappedFields: Object.entries(headerMap.fields || {}).map(([field, key]) => field + " <- " + key),
          missingCriticalFields,
          warnings: audit?.warnings || [],
          risks: risks.length ? risks : ["No material import risks detected in mapped contract fields"],
          needsReviewCount: new Set(rows.filter(c => qualityFlags(c).length).map(c => c.id)).size,
          missingExpiry,
          missingOwners,
          missingTcv,
          categoryReview,
          suspicious,
          unmappedFields: unmapped
        };
      }

      function priorityScore(c) {
        let score = 18;
        if (!Number.isFinite(c.daysOut)) score += 10;
        else if (c.daysOut < 0) score += 30;
        else if (c.daysOut <= 30) score += 32;
        else if (c.daysOut <= 60) score += 24;
        else if (c.daysOut <= 90) score += 18;
        else if (c.daysOut <= 180) score += 9;
        if (c.hasTcv) score += Math.min(20, Math.round(contractTcv(c) / 275000));
        else score += Number.isFinite(c.daysOut) && c.daysOut <= 180 ? 7 : 4;
        if (isAutoRenewContract(c)) score += 8;
        if (isEvergreenContract(c)) score += 5;
        if (isMarketCheckContract(c)) score += 9;
        if (isTerminateContract(c)) score += 6;
        if (isSoleOrSingleSource(c)) score += 7;
        if (!c.sourceType || c.sourceType === "Unknown") score += 3;
        score += healthcareCategoryRisk(c);
        const nearOrMaterial = !Number.isFinite(c.daysOut) || c.daysOut <= 180 || contractTcv(c) >= 250000 || isAutoRenewContract(c);
        const missingWeight = nearOrMaterial ? 3 : 1;
        score += Math.min(14, missingOwnershipFields(c).length * missingWeight);
        if (!c.hasTcv && !contractDate(c)) score += 5;
        if (c.categorySource === "needs-review") score += 3;
        if (isAutoRenewContract(c) && isTerminateContract(c)) score += 8;
        return clamp(score, 0, 100);
      }

      function priorityReason(c) {
        const reasons = [];
        if (c.status === "Expired") reasons.push("already expired");
        else if (c.status === "Critical") reasons.push("inside 30-day expiry window");
        else if (c.status === "Renewal") reasons.push("inside 90-day renewal window");
        else if (c.status === "No Date") reasons.push("missing expiry date");
        if (c.hasTcv && c.totalContractValue >= 500000) reasons.push("high TCV exposure");
        if (!c.hasTcv) reasons.push("zero or missing TCV");
        if (isAutoRenewContract(c)) reasons.push("auto-renewal language");
        if (isEvergreenContract(c)) reasons.push("evergreen terms");
        if (isMarketCheckContract(c)) reasons.push("market check / sourcing disposition");
        if (isTerminateContract(c)) reasons.push("terminate disposition");
        if (isSoleOrSingleSource(c)) reasons.push("sole/single-source continuity risk");
        if (!c.sourceType || c.sourceType === "Unknown") reasons.push("unknown source type");
        if (healthcareCategoryRisk(c) >= 8) reasons.push("critical healthcare category");
        if (c.categorySource === "needs-review") reasons.push("category needs review");
        const missing = missingOwnershipFields(c);
        if (missing.length) reasons.push("missing " + missing.slice(0, 2).join(" and ") + (missing.length > 2 ? " fields" : ""));
        return reasons.length ? reasons.join("; ") : "standard renewal monitoring";
      }

      function recommendedNextAction(c) {
        if (c.status === "Expired") return "Confirm whether service continues, document interim authority, and close or renew immediately.";
        if (isTerminateContract(c)) return "Validate termination decision with sponsor and sourcing owner; document final disposition.";
        if (isMarketCheckContract(c)) return "Start market-check sourcing plan, confirm scope, and assign accountable owner.";
        if (isAutoRenewContract(c) && !c.noticeDeadlineDate) return "Pull the exact auto-renew notice deadline from the contract document before approving renewal.";
        if (isAutoRenewContract(c) && (c.status === "Critical" || c.status === "Renewal")) return "Review auto-renew notice terms and decide whether to renew, renegotiate, or terminate.";
        if (isEvergreenContract(c)) return "Confirm evergreen termination rights, notice period, and service-continuity plan before leaving it unmanaged.";
        if (!contractDate(c)) return "Recover expiry date from the contract record before operational planning.";
        if (!c.hasTcv) return "Confirm TCV or mark as intentionally unpriced before spend reporting.";
        return "Confirm sponsor/admin ownership and prepare renewal decision package.";
      }

      function pct(n, d) {
        return d ? Math.round((Number(n) / Number(d)) * 100) : 0;
      }

      function contractDate(c) {
        return c.expiryDate || c.expires || null;
      }

      function contractTcv(c) {
        return c.hasTcv ? Number(c.totalContractValue || c.annualSpend || 0) : 0;
      }

      function contractValueText(c) {
        return c.hasTcv ? fmtMoney(contractTcv(c)) : escapeHTML(c.tcvStatus || "No TCV");
      }

      function contractDateText(c) {
        const date = fmtDate(contractDate(c));
        return Number.isFinite(c.daysOut) ? date + " (" + c.daysOut + "d)" : date;
      }

      function scoreContractPriority(c) {
        const score = priorityScore(c);
        return {
          score,
          tier: score >= 70 ? "High" : score >= 45 ? "Medium" : "Low",
          reasons: priorityReason(c),
          nextAction: recommendedNextAction(c)
        };
      }

      function getPriorityContracts(limit = 10) {
        return state.data
          .slice()
          .sort((a, b) => {
            const scoreDiff = priorityScore(b) - priorityScore(a);
            if (scoreDiff) return scoreDiff;
            return contractTcv(b) - contractTcv(a);
          })
          .slice(0, limit);
      }

      function getExpiringContracts(days = 90) {
        return state.data
          .filter(c => Number.isFinite(c.daysOut) && c.daysOut >= 0 && c.daysOut <= days)
          .sort((a, b) => a.daysOut - b.daysOut || contractTcv(b) - contractTcv(a));
      }

      function getExpiredContracts() {
        return state.data
          .filter(c => c.status === "Expired" || (Number.isFinite(c.daysOut) && c.daysOut < 0))
          .sort((a, b) => a.daysOut - b.daysOut);
      }

      function getMissingExpiryContracts() {
        return state.data.filter(c => !contractDate(c) || !Number.isFinite(c.daysOut));
      }

      function getZeroTcvContracts() {
        return state.data.filter(c => !c.hasTcv);
      }

      function getAutoRenewContracts() {
        return state.data
          .filter(isAutoRenewContract)
          .sort((a, b) => {
            const ad = Number.isFinite(a.daysOut) ? a.daysOut : 99999;
            const bd = Number.isFinite(b.daysOut) ? b.daysOut : 99999;
            return ad - bd || contractTcv(b) - contractTcv(a);
          });
      }

      function groupContracts(rows, keyFn) {
        const map = new Map();
        rows.forEach(row => {
          const key = keyFn(row) || "Not provided";
          if (!map.has(key)) map.set(key, { name: key, rows: [], spend: 0 });
          const bucket = map.get(key);
          bucket.rows.push(row);
          bucket.spend += contractTcv(row);
        });
        return Array.from(map.values()).sort((a, b) => b.spend - a.spend || b.rows.length - a.rows.length);
      }

      function getDispositionBreakdown() {
        return groupContracts(state.data, c => cleanTextField(c.disposition, true) || "Not provided");
      }

      function getOwnerWorkload() {
        return groupContracts(state.data, c => hasText(c.sourcingOwner) ? (canonicalPersonName(c.sourcingOwner) || cleanTextField(c.sourcingOwner, true)) : "Unassigned").map(bucket => ({
          ...bucket,
          urgent: bucket.rows.filter(c => Number.isFinite(c.daysOut) && c.daysOut >= 0 && c.daysOut <= 90).length,
          missingData: bucket.rows.filter(c => qualityFlags(c).length).length,
          autoRenew: bucket.rows.filter(isAutoRenewContract).length
        }));
      }

      function getSupplierConcentration() {
        return groupContracts(state.data, c => cleanTextField(c.vendor || c.supplierName, true) || "Unknown supplier");
      }

      function getCategoryConcentration() {
        return groupContracts(state.data, c => cleanTextField(c.category, true) || "Unmapped category");
      }

      function getDuplicateContracts() {
        const buckets = groupContracts(state.data, c => {
          const natural = normalizeText([c.vendor, c.contractName || c.contractNumber].filter(Boolean).join(" "));
          return c.duplicateGroupKey || natural;
        });
        return buckets.filter(bucket => bucket.name && bucket.name !== "Not provided" && bucket.rows.length > 1);
      }

      function getDuplicateContractGroups() {
        return getDuplicateContracts();
      }

      function getMissingOwnershipFields() {
        const groups = {};
        state.data.forEach(c => {
          missingOwnershipFields(c).forEach(field => {
            if (!groups[field]) groups[field] = { name: field, rows: [], spend: 0 };
            groups[field].rows.push(c);
            groups[field].spend += contractTcv(c);
          });
        });
        return Object.values(groups).sort((a, b) => b.rows.length - a.rows.length || b.spend - a.spend);
      }

      function explainPriorityReasons(c) {
        return priorityReason(c);
      }

      function recommendNextAction(c) {
        return recommendedNextAction(c);
      }

      function getPortfolioSummary() {
        const kpis = getKpis();
        const suppliers = getSupplierConcentration();
        const categories = getCategoryConcentration();
        const owners = getOwnerWorkload();
        return {
          contracts: state.data.length,
          positiveTcv: kpis.total,
          noTcv: kpis.noTcv,
          missingExpiry: kpis.missingExpiry,
          expired: kpis.expired,
          expiring90: kpis.expiring,
          autoRenew: kpis.autoRenew,
          marketCheck: kpis.marketCheck,
          terminate: kpis.terminate,
          highRisk: state.data.filter(c => c.riskLevel === "High").length,
          topSupplier: suppliers[0] || null,
          topCategory: categories[0] || null,
          busiestOwner: owners[0] || null
        };
      }

      function highestOpportunityContracts(limit = 8) {
        return state.data.slice().sort((a, b) => {
          const aScore = (isMarketCheckContract(a) ? 22 : 0) + (a.tail ? 8 : 0) + Math.min(30, contractTcv(a) / 50000) + (Number.isFinite(a.daysOut) && a.daysOut <= 180 ? 12 : 0);
          const bScore = (isMarketCheckContract(b) ? 22 : 0) + (b.tail ? 8 : 0) + Math.min(30, contractTcv(b) / 50000) + (Number.isFinite(b.daysOut) && b.daysOut <= 180 ? 12 : 0);
          return bScore - aScore || contractTcv(b) - contractTcv(a);
        }).slice(0, limit);
      }

      function hiddenRiskContracts(limit = 8) {
        return state.data.slice().sort((a, b) => {
          const aScore = (!contractDate(a) ? 20 : 0) + (!a.hasTcv ? 16 : 0) + (isAutoRenewContract(a) ? 14 : 0) + (missingOwnershipFields(a).length * 5) + (isTerminateContract(a) && isAutoRenewContract(a) ? 14 : 0);
          const bScore = (!contractDate(b) ? 20 : 0) + (!b.hasTcv ? 16 : 0) + (isAutoRenewContract(b) ? 14 : 0) + (missingOwnershipFields(b).length * 5) + (isTerminateContract(b) && isAutoRenewContract(b) ? 14 : 0);
          return bScore - aScore || priorityScore(b) - priorityScore(a);
        }).slice(0, limit);
      }

      function generateExecutiveSummary() {
        const s = getPortfolioSummary();
        const leaderAsk = s.expired || s.expiring90 || s.autoRenew
          ? "Stand up a renewal-control lane for expired, 90-day, and auto-renew items while the cleanup lane fixes TCV, expiry, and ownership gaps."
          : "Maintain governance rhythm, validate upcoming renewals, and use concentration views for negotiation leverage.";
        let html = '<h4>Executive summary</h4>';
        html += '<div class="nx-answer-section"><span class="nx-answer-kicker">Portfolio readout</span><p>The loaded register has <strong>' + s.contracts + '</strong> contracts and <strong>' + fmtMoney(s.positiveTcv) + '</strong> in positive TCV. It flags <strong>' + s.expiring90 + '</strong> renewals inside 90 days, <strong>' + s.expired + '</strong> expired contracts, <strong>' + s.autoRenew + '</strong> auto-renew signals, and <strong>' + s.noTcv + '</strong> zero/missing TCV rows.</p></div>';
        html += '<div class="nx-answer-section"><span class="nx-answer-kicker">Executive ask</span><p><strong>' + escapeHTML(leaderAsk) + '</strong></p></div>';
        if (s.topSupplier || s.topCategory || s.busiestOwner) {
          html += '<ul><li><strong>Top supplier by TCV:</strong> ' + escapeHTML(s.topSupplier ? s.topSupplier.name + " (" + fmtMoney(s.topSupplier.spend) + ")" : "Not available") + '</li><li><strong>Top category:</strong> ' + escapeHTML(s.topCategory ? s.topCategory.name + " (" + fmtMoney(s.topCategory.spend) + ")" : "Not available") + '</li><li><strong>Busiest owner:</strong> ' + escapeHTML(s.busiestOwner ? s.busiestOwner.name + " (" + s.busiestOwner.rows.length + " contracts)" : "Not available") + '</li></ul>';
        }
        const conf = state.importConfidence;
        if (conf && Number.isFinite(conf.score)) {
          const grounding = conf.score >= 75 ? "judgments here are well-grounded in mapped fields" : conf.score >= 50 ? "treat conclusions as directional and validate flagged gaps before committing" : "data confidence is low; confirm mapping and gaps before acting on specifics";
          html += '<div class="nx-answer-note"><strong>Evidence confidence: ' + conf.score + '/100 (' + escapeHTML(conf.label || confidenceLabel(conf.score)) + ').</strong> ' + escapeHTML(grounding) + '. ' + (conf.needsReviewCount || 0) + ' row' + ((conf.needsReviewCount || 0) === 1 ? '' : 's') + ' need review' + (conf.missingTcv ? ', ' + conf.missingTcv + ' missing TCV' : '') + (conf.missingExpiry ? ', ' + conf.missingExpiry + ' missing an expiry date' : '') + '.</div>';
        }
        html += contractMiniTable(getPriorityContracts(5), 5);
        return html;
      }

      function generateMeetingPrep() {
        let html = generateExecutiveSummary();
        html += '<div class="nx-answer-section"><span class="nx-answer-kicker">Meeting talk track</span><ul><li>“I separated spend facts from data-quality gaps, so we are not using estimated TCV.”</li><li>“Sourcing Responsibility is owner workload, not source type, so accountability and supplier strategy are tracked separately.”</li><li>“The first operating move is renewal control; the second is metadata cleanup; the third is leverage through market checks and consolidation.”</li></ul></div>';
        return html;
      }

      function generate30DayActionPlan() {
        const critical = getExpiredContracts().concat(getExpiringContracts(30)).filter((c, i, arr) => arr.findIndex(x => x.id === c.id) === i);
        const cleanup = hiddenRiskContracts(6);
        const market = state.data.filter(isMarketCheckContract).sort((a, b) => priorityScore(b) - priorityScore(a)).slice(0, 6);
        let html = '<h4>30-day contract intelligence action plan</h4>';
        html += '<div class="nx-answer-section"><span class="nx-answer-kicker">Days 1-7</span><ul><li>Lock the expired and 30-day renewal list.</li><li>Assign owner, sponsor, and decision path for each critical row.</li><li>Confirm notice windows for auto-renew items from the actual contract documents.</li></ul></div>';
        html += '<div class="nx-answer-section"><span class="nx-answer-kicker">Days 8-20</span><ul><li>Resolve missing TCV and expiry fields before executive reporting.</li><li>Package market-check and renew-reduce candidates into sourcing workstreams.</li><li>Draft owner emails for the highest priority contracts.</li></ul></div>';
        html += '<div class="nx-answer-section"><span class="nx-answer-kicker">Days 21-30</span><ul><li>Prepare negotiation positions for high-TCV and concentrated suppliers.</li><li>Escalate missing sponsor/signatory records that block execution.</li><li>Publish a renewal-control dashboard with actions, owners, and dates.</li></ul></div>';
        html += '<p><strong>Critical first queue</strong></p>' + contractMiniTable(critical.length ? critical : getPriorityContracts(5), 5);
        if (market.length) html += '<p><strong>Market-check queue</strong></p>' + contractMiniTable(market, 5);
        if (cleanup.length) html += '<p><strong>Cleanup queue</strong></p>' + contractMiniTable(cleanup, 5);
        return html;
      }

      function generateDataCleanupPlan() {
        return answerMissingData();
      }

      function generateNegotiationPlan(contract) {
        return negotiationPlan(contract);
      }

      function generateOwnerEmail(contract) {
        return answerOwnerEmail(contract ? contract.vendor + " " + (contract.contractNumber || "") : "");
      }

      function generateLegalReviewQuestions(contract) {
        const c = contract || getPriorityContracts(1)[0];
        let html = '<h4>Legal review checklist</h4>';
        if (c) {
          html += '<p>Use this for <strong>' + escapeHTML(c.vendor || "selected supplier") + '</strong> (' + escapeHTML(c.contractNumber || c.id) + '). I can flag metadata-driven issues, but the actual contract document is needed to confirm clause language.</p>';
        } else {
          html += '<p>No contract is selected. Use this as a general checklist and open a contract for row-specific context.</p>';
        }
        html += '<ul><li>Does auto-renew apply, and what is the notice deadline and delivery method?</li><li>Are termination for convenience, termination for cause, transition assistance, and data return obligations clear?</li><li>Are PHI/BAA, confidentiality, data security, audit rights, insurance, indemnification, and limitation of liability aligned to vendor risk?</li><li>Are price escalation, benchmarking, SLA remedies, and service credits commercially enforceable?</li><li>Do amendments, order forms, SOWs, and the master agreement agree on term, scope, TCV, and renewal mechanics?</li></ul>';
        if (c) html += contractLinks([c], 1);
        return html + legalGuardrail();
      }

      function generateSponsorQuestions(contract) {
        const c = contract || getPriorityContracts(1)[0];
        if (!c) return '<h4>Sponsor questions</h4><p>No contracts are loaded.</p>';
        return ownerQuestions(c) + '<div class="nx-answer-section"><span class="nx-answer-kicker">Sponsor decision</span><p>Ask the sponsor to confirm business need, funding, service performance, renewal disposition, and whether a market check is acceptable before the renewal window closes.</p></div>';
      }

      function missingDataMatrix() {
        const specs = [
          ["Missing expiry date", c => !contractDate(c) || !Number.isFinite(c.daysOut)],
          ["Zero or missing TCV", c => !c.hasTcv],
          ["Category needs review", c => c.categorySource === "needs-review" || c.categoryReviewFlag],
          ["Auto-renew notice deadline not mapped", c => isAutoRenewContract(c) && !c.noticeDeadlineDate],
          ["Missing contract number", c => !hasText(c.contractNumber)],
          ["Missing supplier name", c => !hasText(c.supplierName || c.vendor)],
          ["Missing sourcing owner", c => !hasText(c.sourcingOwner)],
          ["Missing sponsor", c => !hasText(c.contractSponsor)],
          ["Missing administrator", c => !hasText(c.contractAdministrator)],
          ["Missing responsible VP", c => !hasText(c.responsibleVP)],
          ["Missing authorized signatory", c => !hasText(c.authorizedSignatory)]
        ];
        return specs.map(([label, test]) => ({
          label,
          count: state.data.filter(test).length
        })).filter(item => item.count > 0).sort((a, b) => b.count - a.count);
      }

      function parseDaysFromQuery(query) {
        const match = String(query).match(/(\d{1,4})\s*(?:day|days|d)\b/i);
        if (!match) return 90;
        return clamp(parseInt(match[1], 10), 1, 3650);
      }

      function normalizeQueryTokens(query) {
        const stop = new Set([
          "what", "which", "show", "find", "give", "tell", "about", "the", "and", "for", "with", "have", "has",
          "contracts", "contract", "supplier", "vendor", "risk", "risks", "should", "focus", "first", "make",
          "look", "smart", "leadership", "meeting", "data", "missing", "blank", "zero", "renew", "renewal",
          "auto", "tcv", "spend", "value", "days", "within", "expiring", "expired", "please", "from", "loaded"
        ]);
        return normalizeText(query).split(" ").filter(t => t.length > 2 && !stop.has(t));
      }

      function findContractsFromQuery(query, limit = 8) {
        const q = normalizeText(query);
        const tokens = normalizeQueryTokens(query);
        if (!q || !tokens.length) return [];
        const directIdentityMatches = state.data.filter(c => [c.vendor, c.supplierName, c.contractNumber, c.contractName].some(value => {
          const field = normalizeText(value);
          return field && field.length >= 4 && q.includes(field);
        }));
        if (directIdentityMatches.length) return directIdentityMatches.sort((a, b) => priorityScore(b) - priorityScore(a)).slice(0, limit);
        return state.data.map(c => {
          const fields = [
            c.vendor,
            c.supplierName,
            c.contractNumber,
            c.contractName,
            c.category,
            c.disposition,
            c.renewalType,
            c.sourcingOwner,
            c.contractSponsor,
            c.contractAdministrator
          ].map(normalizeText);
          const haystack = fields.join(" ");
          let score = 0;
          fields.forEach(field => {
            if (field && q.includes(field)) score += 10;
          });
          tokens.forEach(token => {
            if (haystack.includes(token)) score += 2;
          });
          if (normalizeText(c.contractNumber) && q.includes(normalizeText(c.contractNumber))) score += 14;
          return { c, score };
        }).filter(hit => hit.score > 0)
          .sort((a, b) => b.score - a.score || priorityScore(b.c) - priorityScore(a.c))
          .slice(0, limit)
          .map(hit => hit.c);
      }

      function findOwnerFromQuery(query) {
        const q = normalizeText(query);
        if (!q) return "";
        const owners = [...new Set(state.data.map(c => cleanTextField(c.sourcingOwner, true)).filter(Boolean))];
        return owners.find(owner => {
          const normalized = normalizeText(owner);
          if (!normalized) return false;
          if (q.includes(normalized)) return true;
          return normalized.split(" ").some(part => part.length > 2 && q.includes(part));
        }) || "";
      }

      function findConceptFromQuery(query) {
        const q = normalizeText(query);
        return Object.keys(CONTRACT_CONCEPTS)
          .sort((a, b) => b.length - a.length)
          .find(term => q.includes(normalizeText(term))) || "";
      }

      function routeBotIntent(query) {

      function answerContractGenius(query, memory = state.geniusMemory) {
        if (!state.data.length) return answerContractGeniusCore(query);
        const routed = routeBotIntent(query);
        const normalizedQuery = normalizeText(query);
        const explicitRows = state.data.filter(c => [c.vendor, c.supplierName, c.contractNumber, c.contractName].some(value => {
          const field = normalizeText(value);
          return field && field.length >= 4 && normalizedQuery.includes(field);
        }));
        const directRows = findContractsFromQuery(query, 20);
        const priorRows = memoryContracts(memory);
        const contextual = geniusUsesPriorContext(query);
        const intentRows = rowsForGeniusIntent(routed.intent);
        let rows = explicitRows.length ? explicitRows : (contextual && priorRows.length ? priorRows : (intentRows.length ? intentRows : directRows));
        if (!rows.length && /draft supplier email|supplier email|email to them|email them/i.test(query)) rows = priorRows.length ? priorRows : getPriorityContracts(3);
        let html;
        if ((/more direct/i.test(query) && /email|supplierOutreach/.test(memory.lastIntent)) || (/supplier email|email to them|email them|draft.*email.*supplier/i.test(query) && (contextual || rows.length))) {
          routed.intent = "supplierEmail";
          html = supplierEmailDraft(rows.length ? rows : priorRows, { direct: /more direct/i.test(query) });
        } else if (/owner escalation|escalation note|draft an escalation|send this to the owner/i.test(query) && (contextual || rows.length)) {
          routed.intent = "ownerEscalation";
          html = ownerEscalationDraft(rows.length ? rows : priorRows);
        } else if (/summarize (this|that|these)|leadership summary|for leadership/i.test(query) && (contextual || priorRows.length)) {
          routed.intent = "leadershipFollowUp";
          rows = rows.length ? rows : priorRows;
          html = leadershipSummaryForRows(rows);
        } else if (/renewal action plan|action plan for (these|them|this)|create.*action plan/i.test(query) && (contextual || priorRows.length)) {
          routed.intent = "renewalFollowUp";
          rows = rows.length ? rows : priorRows;
          html = renewalActionPlanForRows(rows);
        } else {
          html = answerContractGeniusCore(query, routed);
          if (!rows.length) rows = rowsForGeniusIntent(routed.intent);
        }
        updateGeniusMemory(query, routed, rows, html);
        return html;

      function askContractGenius(prompt) {

        state.suggestOpen = false;

        state.latestUserMessageId = userMessageId;
        state.chatMessages = [...state.chatMessages, { role: "user", text: query, id: userMessageId }];

        requestAnimationFrame(() => {

          try {

              text: "Contract Genius could not complete that request.",
              id: "genius-bot-" + (++state.chatMessageSeq)
            }];
