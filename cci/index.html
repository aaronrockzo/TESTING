        const categoryFilter = state.selectedCat || state.tableCategoryFilter;
        return state.data
          .filter(c => categoryFilter ? c.category === categoryFilter : true)
          .filter(c => state.registerRiskFilter ? c.riskLevel === state.registerRiskFilter : true)
          .filter(c => state.registerStatusFilter ? contractMatchesFilter(c, state.registerStatusFilter) : true)
          .filter(c => q ? [c.vendor, c.supplierName, c.contractNumber, c.contractName, c.category, c.sourcingOwner, c.contractSponsor, c.disposition, c.renewalType].some(v => String(v || "").toLowerCase().includes(q)) : true)
          .sort((a, b) => b.annualSpend - a.annualSpend);
      }

      function getBuckets() {
        const sort = rows => rows.sort((a, b) => (a.daysOut ?? 99999) - (b.daysOut ?? 99999));
        return {
          expired: sort(state.data.filter(c => Number.isFinite(c.daysOut) && c.daysOut < 0)),
          d30: sort(state.data.filter(c => Number.isFinite(c.daysOut) && c.daysOut >= 0 && c.daysOut <= 30)),
          d90: sort(state.data.filter(c => Number.isFinite(c.daysOut) && c.daysOut > 30 && c.daysOut <= 90)),
          noDate: sort(state.data.filter(c => !Number.isFinite(c.daysOut)))
        };
      }

      function sourcingClass(c) {
        return c.sourceType && c.sourceType !== "Unknown" ? c.sourceType : "Unknown";
      }

      const SOURCING_META = {
        "Single Source": { color: BRAND.amber, icon: "shield", note: "One contracted supplier with viable alternates on record." },
        "Sole Source": { color: BRAND.rose, icon: "warning", note: "No qualified alternate supplier - highest continuity exposure." },
        "Competitive Multi-Source": { color: BRAND.mint, icon: "check", note: "Bid across multiple suppliers - strongest pricing leverage." }
      };

      // Owner workload split: groups by canonical owner so name variants merge,
      // keeps Unassigned as its own band, rolls overflow owners into one band so
      // counts always reconcile, and carries actionable signals (near-term renewals,
      // high risk, data gaps) per owner instead of just a raw count.
      function getSourcingSplit() {
        const map = new Map();
        state.data.forEach(c => {
          const assigned = hasText(c.sourcingOwner);
          const key = assigned ? ownerKey(c.sourcingOwner) : "__unassigned__";
          const display = assigned ? (canonicalPersonName(c.sourcingOwner) || cleanTextField(c.sourcingOwner, true)) : "Unassigned";
          if (!map.has(key)) map.set(key, { name: display, key, assigned, rows: [], spend: 0, count: 0, urgent: 0, highRisk: 0, missing: 0 });
          const b = map.get(key);
          b.rows.push(c);
          b.count += 1;
          if (c.hasTcv) b.spend += Number(c.annualSpend || 0);
          if (Number.isFinite(c.daysOut) && c.daysOut >= 0 && c.daysOut <= 90) b.urgent += 1;
          if (c.riskLevel === "High") b.highRisk += 1;
          if (qualityFlags(c).length) b.missing += 1;
        });
        const total = state.data.length || 1;
        const withPct = b => ({ ...b, pct: Math.round((b.count / total) * 100) });
        const all = Array.from(map.values());
        const assignedOwners = all.filter(b => b.assigned).sort((a, b) => b.count - a.count || b.spend - a.spend);
        const unassigned = all.filter(b => !b.assigned);
        const TOP = 7;
        const top = assignedOwners.slice(0, TOP).map(withPct);
        const rest = assignedOwners.slice(TOP);
        if (rest.length) {
          const agg = rest.reduce((a, b) => {
            a.rows.push(...b.rows); a.count += b.count; a.spend += b.spend;
            a.urgent += b.urgent; a.highRisk += b.highRisk; a.missing += b.missing;
            return a;
          }, { name: rest.length + " more owners", key: "__more__", assigned: true, overflow: true, ownerCount: rest.length, rows: [], spend: 0, count: 0, urgent: 0, highRisk: 0, missing: 0 });
          top.push(withPct(agg));
        }
        return top.concat(unassigned.map(withPct));
      }

      // Portfolio-level workload signals shown above the owner bands.
      function getSourcingWorkloadStats() {
        const split = getSourcingSplit();
        const ownerCountTrue = split.reduce((sum, b) => sum + (b.assigned ? (b.overflow ? b.ownerCount : 1) : 0), 0);
        const unassigned = split.find(b => !b.assigned);
        const busiest = split.filter(b => b.assigned && !b.overflow).sort((a, b) => b.count - a.count)[0] || null;
        const total = state.data.length || 1;
        return {
          ownerCount: ownerCountTrue,
          unassignedCount: unassigned ? unassigned.count : 0,
          unassignedPct: unassigned ? Math.round((unassigned.count / total) * 100) : 0,
          busiest,
          busiestPct: busiest ? Math.round((busiest.count / total) * 100) : 0
        };
      }

      function getRiskMatrix() {
        const departments = [...new Set(state.data.map(c => c.category).filter(Boolean))].sort();
        const levels = ["High", "Medium", "Low"];
        const rows = departments.map(dep => {
          const cells = levels.map(level => state.data.filter(c => c.category === dep && c.riskLevel === level).length);
          return { dep, cells, total: cells.reduce((a, b) => a + b, 0) };
        }).filter(r => r.total > 0);
        return { departments, levels, rows };
      }

      // Notifications are grouped into a small set of action lanes instead of one
      // row per contract, so a large import never floods the panel with 150+ items.
      function getAlertGroups() {
        const data = state.data || [];
        if (!data.length) return [];
        const exposure = rows => rows.reduce((sum, c) => sum + (c.hasTcv ? c.annualSpend : 0), 0);
        const nearestDays = rows => {
          const days = rows.map(c => c.daysOut).filter(d => Number.isFinite(d)).sort((a, b) => a - b);
          return days.length ? days[0] : null;
        };
        const defs = [
          {
            id: "expired", filter: "expired", severity: "critical", icon: "clock",
            rows: data.filter(c => Number.isFinite(c.daysOut) && c.daysOut < 0),
            title: n => n + (n === 1 ? " contract has" : " contracts have") + " already expired",
            detail: rows => fmtMoney(exposure(rows)) + " exposure · oldest " + Math.abs(Math.min(...rows.map(c => c.daysOut))) + "d overdue"
          },
          {
            id: "critical", filter: "critical", severity: "critical", icon: "warning",
            rows: data.filter(c => Number.isFinite(c.daysOut) && c.daysOut >= 0 && c.daysOut <= 30),
            title: n => n + (n === 1 ? " renewal is" : " renewals are") + " due within 30 days",
            detail: rows => { const d = nearestDays(rows); return fmtMoney(exposure(rows)) + " · nearest " + (d === 0 ? "due today" : d + "d out"); }
          },
          {
            id: "autoRenew", filter: "autoRenew", severity: "warning", icon: "zap",
            rows: data.filter(c => c.hasTcv && c.annualSpend >= 300000 && isAutoRenewContract(c)),
            title: n => n + " high-spend auto-renewal" + (n === 1 ? "" : "s"),
            detail: rows => fmtMoney(exposure(rows)) + " renews automatically without action"
          },
          {
            id: "highRisk", filter: "highRisk", severity: "warning", icon: "shield",
            rows: data.filter(c => c.riskLevel === "High" && (!Number.isFinite(c.daysOut) || c.daysOut <= 90)),
            title: n => n + " high-risk contract" + (n === 1 ? "" : "s") + " in the renewal window",
            detail: rows => "Avg risk " + Math.round(rows.reduce((s, c) => s + c.riskScore, 0) / rows.length) + " · " + fmtMoney(exposure(rows))
          },
          {
            id: "renewal", filter: "renewal", severity: "info", icon: "clock",
            rows: data.filter(c => Number.isFinite(c.daysOut) && c.daysOut > 30 && c.daysOut <= 90),
            title: n => n + " renewal" + (n === 1 ? "" : "s") + " in 31-90 days",
            detail: rows => fmtMoney(exposure(rows)) + " · time to plan sourcing"
          },
          {
            id: "missingOwner", filter: "missingOwner", severity: "info", icon: "user",
            rows: data.filter(c => !hasText(c.sourcingOwner) && !hasText(c.contractSponsor) && !hasText(c.responsibleDirector) && !hasText(c.contractAdministrator)),
            title: n => n + " contract" + (n === 1 ? "" : "s") + " missing an owner",
            detail: rows => fmtMoney(exposure(rows)) + " unowned · assign accountability"
          },
          {
            id: "missingDate", filter: "noDate", severity: "info", icon: "calendar",
            rows: data.filter(c => !contractDate(c)),
            title: n => n + " contract" + (n === 1 ? "" : "s") + " missing an expiry date",
            detail: rows => fmtMoney(exposure(rows)) + " · renewal timing unknown"
          }
        ];
        const order = { critical: 0, warning: 1, info: 2 };
        const tones = { critical: BRAND.rose, warning: BRAND.amber, info: BRAND.teal };
        return defs
          .filter(d => d.rows.length)
          .map(d => ({
            id: d.id,
            filter: d.filter,
            severity: d.severity,
            tone: tones[d.severity],
            icon: d.icon,
            count: d.rows.length,
            title: d.title(d.rows.length),
            detail: d.detail(d.rows)
          }))
          .sort((a, b) => order[a.severity] - order[b.severity] || b.count - a.count);
      }

      function pushToast(title, detail) {
        const id = Math.random().toString(36).slice(2);
        state.toasts = [...state.toasts, { id, title, detail }];
        state.notifCount += 1;
        render();
        window.setTimeout(() => {
          state.toasts = state.toasts.filter(t => t.id !== id);
          render();
        }, 6500);
      }

      function tipAttrs(title, body) {
        return ' data-chart-title="' + escapeHTML(title) + '" data-chart-body="' + escapeHTML(body) + '"';
      }

      function chartLabel(name, max = 18) {
        const label = CATEGORY_SHORT[name] || name || "Unknown";
        return label.length > max ? label.slice(0, Math.max(0, max - 1)).trim() + "…" : label;
      }

      function renderBarChart(catData) {
        if (!catData.length) return '<div class="nx-chart-empty">No category data to chart.</div>';
        const max = Math.max(...catData.map(d => d.spend), 1);
        if (catData.length > 7) {
          const width = 760;
          const rowH = 38;
          const height = Math.max(286, 42 + (catData.length * rowH));
          const pad = { top: 18, right: 78, bottom: 26, left: 168 };
          const innerW = width - pad.left - pad.right;
          const grid = [0, .25, .5, .75, 1].map(p => {
            const x = pad.left + innerW * p;
            return '<line class="nx-gridline" x1="' + x + '" x2="' + x + '" y1="' + pad.top + '" y2="' + (height - pad.bottom) + '"></line><text class="nx-axis" x="' + x + '" y="' + (height - 8) + '" text-anchor="middle">$' + Math.round(max * p) + 'K</text>';
          }).join("");
          const rows = catData.map((d, i) => {
            const y = pad.top + (i * rowH);
            const barW = Math.max(2, (d.spend / max) * innerW);
            const color = CATEGORY_COLORS[d.name] || BRAND.blue600;
            const dimmed = state.selectedCat && state.selectedCat !== d.name ? .26 : 1;
            const active = state.selectedCat === d.name ? " active" : "";
            const hit = '<rect class="nx-cat-hit" data-cat-bar="' + escapeHTML(d.name) + '" role="button" tabindex="0" aria-label="Open ' + escapeHTML(d.name) + ' drill-down"' + tipAttrs(d.name, "$" + d.spend + "K positive TCV · " + d.count + " contract" + (d.count === 1 ? "" : "s") + (d.noTcv ? " · " + d.noTcv + " no TCV" : "")) + ' x="0" y="' + y + '" width="' + width + '" height="' + rowH + '" fill="transparent"></rect>';
            return '<g class="nx-cat-row">' + hit + '<text class="nx-axis label" x="' + (pad.left - 12) + '" y="' + (y + 19) + '" text-anchor="end">' + escapeHTML(chartLabel(d.name, 24)) + '</text><rect class="nx-bar nx-chart-node' + active + '" data-cat-bar="' + escapeHTML(d.name) + '"' + tipAttrs(d.name, "$" + d.spend + "K positive TCV · " + d.count + " contract" + (d.count === 1 ? "" : "s") + (d.noTcv ? " · " + d.noTcv + " no TCV" : "")) + ' x="' + pad.left + '" y="' + (y + 5) + '" width="' + barW + '" height="22" rx="8" fill="' + color + '" opacity="' + dimmed + '"></rect><text class="nx-bar-label" x="' + Math.min(width - 8, pad.left + barW + 8) + '" y="' + (y + 20) + '">' + "$" + d.spend + "K" + '</text></g>';
          }).join("");
          return '<div class="nx-chart-scroll"><svg class="nx-svgchart" style="height:' + height + 'px;min-height:' + height + 'px" viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="Spend by category horizontal chart">' + grid + rows + '</svg></div>';
        }
        const width = 760;
        const height = 286;
        const pad = { top: 24, right: 22, bottom: 66, left: 60 };
        const innerW = width - pad.left - pad.right;
        const innerH = height - pad.top - pad.bottom;
        const step = innerW / catData.length;
        const barW = Math.min(68, step * .58);
        const grid = [0, .25, .5, .75, 1].map(p => {
          const y = pad.top + innerH - (innerH * p);
          const label = "$" + Math.round(max * p) + "K";
          return '<line class="nx-gridline" x1="' + pad.left + '" x2="' + (width - pad.right) + '" y1="' + y + '" y2="' + y + '"></line><text class="nx-axis" x="' + (pad.left - 10) + '" y="' + (y + 4) + '" text-anchor="end">' + label + '</text>';
        }).join("");
        const bars = catData.map((d, i) => {
          const h = (d.spend / max) * innerH;
          const bandX = pad.left + (i * step);
          const x = bandX + (step - barW) / 2;
          const y = pad.top + innerH - h;
          const color = CATEGORY_COLORS[d.name] || BRAND.blue600;
          const dimmed = state.selectedCat && state.selectedCat !== d.name ? .28 : 1;
          const active = state.selectedCat === d.name ? " active" : "";
          const hit = '<rect class="nx-cat-hit" data-cat-bar="' + escapeHTML(d.name) + '" role="button" tabindex="0" aria-label="Open ' + escapeHTML(d.name) + ' drill-down"' + tipAttrs(d.name, "$" + d.spend + "K positive TCV · " + d.count + " contract" + (d.count === 1 ? "" : "s") + (d.noTcv ? " · " + d.noTcv + " no TCV" : "")) + ' x="' + bandX + '" y="' + pad.top + '" width="' + step + '" height="' + (innerH + 40) + '" fill="transparent"></rect>';
          return '<g class="nx-cat-row">' + hit + '<rect class="nx-bar nx-chart-node' + active + '" data-cat-bar="' + escapeHTML(d.name) + '"' + tipAttrs(d.name, "$" + d.spend + "K positive TCV · " + d.count + " contract" + (d.count === 1 ? "" : "s") + (d.noTcv ? " · " + d.noTcv + " no TCV" : "")) + ' x="' + x + '" y="' + y + '" width="' + barW + '" height="' + h + '" rx="8" fill="' + color + '" opacity="' + dimmed + '"></rect><text class="nx-axis label" x="' + (x + barW / 2) + '" y="' + (height - 34) + '" text-anchor="middle">' + escapeHTML(chartLabel(d.name, 12)) + '</text><text class="nx-axis" x="' + (x + barW / 2) + '" y="' + (height - 16) + '" text-anchor="middle">$' + d.spend + 'K</text></g>';
        }).join("");
        return '<svg class="nx-svgchart" viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="Spend by category chart">' + grid + bars + '</svg>';
      }

      function linePath(points) {
        return points.map((p, i) => (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1)).join(" ");
      }

      function renderTrendChart() {
        const width = 820;
        const height = 286;
        const pad = { top: 26, right: 28, bottom: 52, left: 60 };
        const innerW = width - pad.left - pad.right;
        const innerH = height - pad.top - pad.bottom;
        const max = Math.max(...MONTHLY_TREND.flatMap(d => [d.total, d.tail]));
        const x = i => pad.left + (innerW * i / (MONTHLY_TREND.length - 1));
        const y = v => pad.top + innerH - (v / max) * innerH;
        const totalPts = MONTHLY_TREND.map((d, i) => ({ x: x(i), y: y(d.total) }));
        const tailPts = MONTHLY_TREND.map((d, i) => ({ x: x(i), y: y(d.tail) }));
        const baseline = pad.top + innerH;
        const totalArea = linePath(totalPts) + " L " + totalPts[totalPts.length - 1].x + " " + baseline + " L " + totalPts[0].x + " " + baseline + " Z";
        const tailArea = linePath(tailPts) + " L " + tailPts[tailPts.length - 1].x + " " + baseline + " L " + tailPts[0].x + " " + baseline + " Z";
        const grid = [0, .33, .66, 1].map(p => {
          const gy = pad.top + innerH - (innerH * p);
          return '<line class="nx-gridline" x1="' + pad.left + '" x2="' + (width - pad.right) + '" y1="' + gy + '" y2="' + gy + '"></line><text class="nx-axis" x="' + (pad.left - 10) + '" y="' + (gy + 4) + '" text-anchor="end">$' + Math.round(max * p) + 'K</text>';
        }).join("");
        const labels = MONTHLY_TREND.map((d, i) => '<text class="nx-axis label" x="' + x(i) + '" y="' + (height - 16) + '" text-anchor="middle">' + d.m + '</text>').join("");
        const totalNodes = MONTHLY_TREND.map((d, i) => trendPoint("total", d.m, d.total, totalPts[i], BRAND.teal)).join("");
        const tailNodes = MONTHLY_TREND.map((d, i) => trendPoint("tail", d.m, d.tail, tailPts[i], BRAND.green)).join("");
        const totalLineOpacity = state.selectedTrend && !state.selectedTrend.startsWith("total:") ? .22 : .95;
        const tailLineOpacity = state.selectedTrend && !state.selectedTrend.startsWith("tail:") ? .22 : .95;
        return '<svg class="nx-svgchart" viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="Tail-spend trend chart"><defs><linearGradient id="totalGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="' + BRAND.teal + '" stop-opacity=".42"></stop><stop offset="100%" stop-color="' + BRAND.teal + '" stop-opacity=".03"></stop></linearGradient><linearGradient id="tailGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="' + BRAND.green + '" stop-opacity=".52"></stop><stop offset="100%" stop-color="' + BRAND.green + '" stop-opacity=".04"></stop></linearGradient></defs>' + grid + '<path d="' + totalArea + '" fill="url(#totalGrad)" opacity="' + totalLineOpacity + '"></path><path d="' + tailArea + '" fill="url(#tailGrad)" opacity="' + tailLineOpacity + '"></path><path d="' + linePath(totalPts) + '" fill="none" stroke="' + BRAND.teal + '" stroke-width="3" opacity="' + totalLineOpacity + '"></path><path d="' + linePath(tailPts) + '" fill="none" stroke="' + BRAND.green + '" stroke-width="3" opacity="' + tailLineOpacity + '"></path>' + labels + totalNodes + tailNodes + '</svg>';
      }

      function trendPoint(series, month, value, point, color) {
        const key = series + ":" + month;
        const active = state.selectedTrend === key ? " active" : "";
        const opacity = state.selectedTrend && state.selectedTrend !== key ? .24 : 1;
        const label = series === "total" ? "Total spend" : "Tail spend";
        return '<g class="nx-trend-hit" data-trend-point="' + key + '"' + tipAttrs(month + " " + label, "$" + value + "K") + '><circle cx="' + point.x + '" cy="' + point.y + '" r="13" fill="transparent"></circle><circle class="nx-chart-node' + active + '" cx="' + point.x + '" cy="' + point.y + '" r="5.8" fill="' + color + '" stroke="var(--panel-solid)" stroke-width="2.4" opacity="' + opacity + '"></circle></g>';
      }

      function renderRiskDonut(riskDist) {
        const total = riskDist.reduce((sum, d) => sum + d.value, 0) || 1;
        const radius = 66;
        let angle = -90;
        let segments = "";
        let hits = "";
        riskDist.filter(d => d.value > 0).forEach(d => {
          const sweep = Math.max(.01, (d.value / total) * 359.99);
          const path = donutArc(88, 88, radius, angle, angle + sweep);
          angle += sweep;
          const opacity = state.selectedRisk && state.selectedRisk !== d.name ? .24 : 1;
          const active = state.selectedRisk === d.name ? " active" : "";
          const hover = state.hoverRisk === d.name ? " hover" : "";
          segments += '<path class="nx-donut-seg nx-chart-node' + active + hover + '" data-risk-name="' + escapeHTML(d.name) + '"' + tipAttrs(d.name + " risk", d.value + " contracts") + ' d="' + path + '" stroke="' + d.fill + '" opacity="' + opacity + '"></path>';
          hits += '<path class="nx-donut-hit" data-risk-segment="' + escapeHTML(d.name) + '" role="button" tabindex="0" aria-label="Open ' + escapeHTML(d.name) + ' risk drill-down"' + tipAttrs(d.name + " risk", d.value + " contracts") + ' d="' + path + '" stroke="transparent" stroke-width="46" fill="none" stroke-linecap="butt"></path>';
        });
        const legend = riskDist.map(d => {
          const active = state.selectedRisk === d.name ? " active" : "";
          return '<button type="button" class="nx-leg' + active + '" data-risk-segment="' + escapeHTML(d.name) + '" aria-label="Open ' + escapeHTML(d.name) + ' risk drill-down"><i style="background:' + d.fill + '"></i>' + escapeHTML(d.name) + ' ' + d.value + '</button>';
        }).join("");
        return '<div class="nx-donut-wrap"><svg class="nx-donut-svg" viewBox="0 0 176 176" role="img" aria-label="Risk distribution donut"><circle cx="88" cy="88" r="' + radius + '" fill="none" stroke="var(--chip)" stroke-width="28"></circle>' + segments + '<circle class="nx-donut-center" cx="88" cy="88" r="48"></circle><text class="nx-donut-total" x="88" y="78">' + state.data.length + '</text><text class="nx-donut-label" x="88" y="104">Contracts</text>' + hits + '</svg><div class="nx-legend">' + legend + '</div></div>';
      }

      function renderSourcingSplit() {
        const split = getSourcingSplit();
        if (!split.some(s => s.count)) return '<div class="nx-chart-empty">No owner workload data to chart.</div>';
        const stats = getSourcingWorkloadStats();
        const colors = [BRAND.teal, BRAND.green, BRAND.blue600, BRAND.amber, BRAND.violet, BRAND.cyan, BRAND.rose, BRAND.mint];
        const chip = (n, color, label) => n ? '<span class="nx-schip" style="color:' + color + ';background:' + color + '1f">' + n + ' ' + label + '</span>' : '';
        let assignedIdx = 0;
        const rows = split.map(s => {
          const color = s.assigned ? colors[(assignedIdx++) % colors.length] : "#94a3b8";
          const active = state.selectedSourcing === s.name ? " active" : "";
          const chips = chip(s.urgent, BRAND.amber, "&le;90d") + chip(s.highRisk, BRAND.rose, "high risk") + chip(s.missing, BRAND.violet, "data gaps");
          const meta = s.overflow ? ' · ' + s.ownerCount + ' owners' : '';
          return '<div class="nx-srow' + active + (s.assigned ? '' : ' unassigned') + '" data-sourcing="' + escapeHTML(s.name) + '" role="button" tabindex="0" aria-label="Open ' + escapeHTML(s.name) + ' workload drill-down"><div class="top"><span class="lab"><i style="background:' + color + '"></i>' + escapeHTML(s.name) + '</span><span class="val">' + s.pct + '% · ' + s.count + ' contract' + (s.count === 1 ? '' : 's') + meta + ' · ' + fmtMoney(s.spend) + '</span></div><div class="nx-strack"><i style="width:' + Math.max(2, s.pct) + '%;background:' + color + '"></i></div>' + (chips ? '<div class="nx-schips">' + chips + '</div>' : '') + '</div>';
        }).join("");
        const header = '<div class="nx-swork-stats"><span><b>' + stats.ownerCount + '</b> owner' + (stats.ownerCount === 1 ? '' : 's') + '</span>'
          + (stats.busiest ? '<span>busiest <b>' + escapeHTML(stats.busiest.name) + '</b> ' + stats.busiestPct + '%</span>' : '')
          + (stats.unassignedCount ? '<span class="warn"><b>' + stats.unassignedCount + '</b> unassigned (' + stats.unassignedPct + '%)</span>' : '<span class="ok">every contract has an owner</span>')
          + '</div>';
        return '<div class="nx-sourcing">' + header + rows + '</div>';
      }

      function matrixCellColor(level, count, max) {
        const base = level === "High" ? "225,29,72" : level === "Medium" ? "245,158,11" : "55,211,153";
        if (!count) return "var(--kpi-ghost)";
        const intensity = 0.12 + 0.5 * (count / Math.max(1, max));
        return "rgba(" + base + "," + intensity.toFixed(3) + ")";
      }

      function renderRiskMatrix() {
        const matrix = getRiskMatrix();
        if (!matrix.rows.length) return '<div class="nx-chart-empty">No risk timelines to map.</div>';
        const max = Math.max(1, ...matrix.rows.flatMap(r => r.cells));
        const head = '<tr><th class="dep">Department</th>' + matrix.levels.map(l => '<th>' + l + ' Risk</th>').join("") + '</tr>';
        const body = matrix.rows.map(r =>
          '<tr><td class="dep">' + escapeHTML(CATEGORY_SHORT[r.dep] || r.dep) + '</td>' + r.cells.map((count, i) => {
            const level = matrix.levels[i];
            const zero = count === 0 ? " zero" : "";
            const selected = state.selectedMatrix === r.dep + "|" + level ? " active" : "";
            const attrs = count ? ' data-matrix-cell="' + escapeHTML(r.dep) + '|' + level + '" role="button" tabindex="0"' : "";
            return '<td class="nx-mcell' + zero + selected + '"' + attrs + ' style="background:' + matrixCellColor(level, count, max) + '">' + count + '</td>';
          }).join("") + '</tr>'
        ).join("");
        return '<div class="nx-matrix"><table>' + head + body + '</table></div>';
      }

      function polarPoint(cx, cy, radius, angle) {
        const radians = angle * Math.PI / 180;
        return { x: cx + radius * Math.cos(radians), y: cy + radius * Math.sin(radians) };
      }

      function donutArc(cx, cy, radius, startAngle, endAngle) {
        const start = polarPoint(cx, cy, radius, startAngle);
        const end = polarPoint(cx, cy, radius, endAngle);
        const largeArc = endAngle - startAngle > 180 ? 1 : 0;
        return "M " + start.x.toFixed(3) + " " + start.y.toFixed(3) + " A " + radius + " " + radius + " 0 " + largeArc + " 1 " + end.x.toFixed(3) + " " + end.y.toFixed(3);
      }

      function renderKPI(id, label, value, help, color, iconName) {
        return '<div class="nx-card nx-kpi hoverable clickable" data-kpi="' + id + '" style="--g:' + color + '"><div class="glow"></div><div style="display:flex;justify-content:space-between;align-items:center"><span class="nx-label">' + escapeHTML(label) + '</span><span style="color:' + color + '">' + icon(iconName, 17) + '</span></div><div class="val">' + escapeHTML(value) + '</div><div class="help">' + escapeHTML(help) + '</div></div>';
      }

      function renderEmptyDashboard() {
        return '<section class="nx-empty"><div class="nx-empty-card"><div class="mark">' + icon("shield", 30) + '</div><h2>Welcome to Corewell Contract Intelligence</h2><p>No contract data is loaded yet. Add a CSV or XLSX workbook to start private, browser-only contract analysis, or load the demo portfolio to explore the dashboard.</p><div class="nx-empty-actions"><button type="button" class="nx-btn primary" data-action="show-welcome">' + icon("upload", 16) + ' Add file</button><button type="button" class="nx-btn ghost" data-action="load-demo">' + icon("spreadsheet", 16) + ' Load demo file</button></div></div></section>';
      }

      function renderSkeleton() {
        const sk = (h, w) => '<div class="shimmer sk-line" style="height:' + h + 'px;width:' + w + '"></div>';
        const kpiCard = '<div class="nx-card nx-kpi">' + sk(13, "52%") + sk(30, "70%") + sk(12, "84%") + '</div>';
        return '<div class="nx-skel" aria-busy="true" aria-label="Synthesizing data">' +
          '<div class="nx-card" style="padding:0;border:none;background:transparent;box-shadow:none">' + sk(150, "100%") + '</div>' +
          '<div class="nx-kpis">' + kpiCard + kpiCard + kpiCard + kpiCard + '</div>' +
          '<div class="nx-grid2"><div class="nx-card">' + sk(16, "40%") + '<div style="height:14px"></div>' + sk(210, "100%") + '</div><div class="nx-card">' + sk(16, "55%") + '<div style="height:14px"></div>' + sk(210, "100%") + '</div></div>' +
          '<div class="nx-card">' + sk(16, "30%") + '<div style="height:14px"></div>' + sk(260, "100%") + '</div>' +
        '</div>';
      }

      function withSkeleton(opts = {}) {
        state.skeleton = true;
        render();
        window.setTimeout(() => {
          state.skeleton = false;
          render({ viewTransition: true, ...opts });
        }, 500);
      }

      function renderDashboard() {
        if (!state.data.length) return renderEmptyDashboard();
        const kpis = getKpis();
        const catData = getCatData();
        const riskDist = getRiskDist();
        const filtered = getFiltered();
        const uploadText = state.uploadName ? " Now showing your uploaded set: " + state.uploadName + "." : "";
        return [
          '<section class="nx-hero"><div><div class="eyebrow">' + icon("activity", 14) + ' Resilient optimism - indirect sourcing</div><h2>One command center for every contract, anomaly, and renewal.</h2><p>Track Corewell TCV, dispositions, ownership gaps, and expiry urgency without fabricating missing workbook values.' + escapeHTML(uploadText) + '</p></div><div class="nx-herocard"><div class="row"><small>Positive TCV</small><b>' + fmtMoney(kpis.total) + '</b></div><div class="row"><small>No TCV on file</small><b style="color:' + BRAND.violet + '">' + kpis.noTcv + '</b></div><div class="row"><small>Auto-renew</small><b style="color:' + BRAND.amber + '">' + kpis.autoRenew + '</b></div><button type="button" class="nx-btn nx-smart" style="width:100%;margin-top:12px" data-run-reader>' + icon("sparkle", 15) + ' Run Smart Reader</button></div></section>',
          '<section class="nx-kpis">' +
            renderKPI("total", "Total Positive TCV", fmtMoney(kpis.total), "Official positive TCV only", BRAND.teal, "trend") +
            renderKPI("active", "Contract Count", String(kpis.active), "Deduped imported contracts", BRAND.green, "file") +
            renderKPI("tail", "Zero / Missing TCV", String(kpis.noTcv), "Flagged separately from tail spend", BRAND.violet, "warning") +
            renderKPI("risk", "Renewal <= 90d", String(kpis.expiring), kpis.expired + " expired · " + kpis.missingExpiry + " missing date", BRAND.rose, "shield") +
          '</section>',
          '<section class="nx-grid2"><div class="nx-card nx-chart-card hoverable"><div class="nx-cardhead"><div><h3>Spend by Category</h3><div class="sub">Click a bar to drill into category exposure and renewal pressure</div></div>' + (state.selectedCat ? '<button type="button" class="nx-btn ghost" data-action="clear-category">' + icon("filter", 14) + ' Clear</button>' : '') + '</div><div class="nx-chartbox">' + renderBarChart(catData) + '</div></div><div class="nx-card nx-chart-card hoverable"><div class="nx-cardhead"><div><h3>Risk Distribution</h3><div class="sub">Contracts by risk tier</div></div></div>' + renderRiskDonut(riskDist) + '</div></section>',
          '<section class="nx-card nx-chart-card hoverable"><div class="nx-cardhead"><div><h3>Tail-Spend Trend</h3><div class="sub">Monthly indirect spend vs. tail spend (&lt;$250K vendors)</div></div></div><div class="nx-chartbox">' + renderTrendChart() + '</div></section>',
          '<section class="nx-grid2b"><div class="nx-card nx-chart-card hoverable"><div class="nx-cardhead"><div><h3>Sourcing Responsibility Workload</h3><div class="sub">Owner workload from workbook sourcing responsibility - click a band to drill in</div></div></div>' + renderSourcingSplit() + '</div><div class="nx-card nx-chart-card hoverable"><div class="nx-cardhead"><div><h3>Risk Profile Contingency Matrix</h3><div class="sub">Contract volume by risk tier across categories - click a cell to drill in</div></div></div>' + renderRiskMatrix() + '</div></section>',
          renderContractTable(filtered)
        ].join("");
      }

      function renderContractTable(filtered) {
        const categories = [...new Set(state.data.map(c => c.category).filter(Boolean))].sort();
        const categoryFilter = state.selectedCat || state.tableCategoryFilter;
        const categoryOptions = categories.map(c => '<option value="' + escapeHTML(c) + '"' + (state.tableCategoryFilter === c ? " selected" : "") + '>' + escapeHTML(c) + '</option>').join("");
        const totalPages = Math.max(1, Math.ceil(filtered.length / state.rowsPerPage));
        const page = clamp(state.tablePage, 1, totalPages);
        state.tablePage = page;
        const start = (page - 1) * state.rowsPerPage;
        const pageRows = filtered.slice(start, start + state.rowsPerPage);
        const rows = pageRows.map(c => {
          const ss = statusStyle(c.status);
          const rc = riskColor(c.riskLevel);
          const hl = state.highlightId === c.id ? " nx-row-highlight" : "";
          return '<tr class="' + hl.trim() + '" data-contract-id="' + escapeHTML(c.id) + '"><td><div class="nx-vend">' + escapeHTML(c.vendor) + '</div><div class="nx-id">' + escapeHTML(c.contractNumber || c.id) + (c.contractName ? ' · ' + escapeHTML(c.contractName) : '') + '</div></td><td>' + badge(c.category, (CATEGORY_COLORS[c.category] || BRAND.blue600) + "1e", CATEGORY_COLORS[c.category] || BRAND.blue600) + '</td><td style="font-weight:750">' + (c.hasTcv ? fmtMoney(c.annualSpend) : escapeHTML(c.tcvStatus || "No TCV")) + '</td><td style="color:var(--ink-soft);font-weight:650">' + escapeHTML(c.sourcingOwner || "Unassigned") + '</td><td><div style="font-weight:700;color:var(--ink)">' + escapeHTML(c.renewalType || "No renewal type") + '</div><div class="nx-id">' + escapeHTML(c.disposition || "No disposition") + '</div></td><td style="color:var(--ink-soft);font-weight:600">' + fmtDate(contractDate(c)) + '</td><td>' + badge(c.status, ss.bg, ss.c) + ' ' + badge(c.riskLevel + " - " + c.riskScore, rc + "22", rc) + '</td></tr>';
        }).join("");
        const from = filtered.length ? start + 1 : 0;
        const to = Math.min(start + state.rowsPerPage, filtered.length);
        const jump = '<div class="nx-jump"><label for="jump-page">Go to page:</label><input id="jump-page" type="number" min="1" max="' + totalPages + '" inputmode="numeric" placeholder="' + page + '"></div>';
        const pager = '<div class="nx-pager"><div class="nx-page-meta">Showing ' + from + '-' + to + ' of ' + filtered.length + ' contracts · Page ' + page + ' of ' + totalPages + '</div><div class="nx-pager-controls">' + jump + '<button type="button" class="nx-btn ghost" data-page-step="-1"' + (page <= 1 ? ' disabled' : '') + '>Previous</button><button type="button" class="nx-btn ghost" data-page-step="1"' + (page >= totalPages ? ' disabled' : '') + '>Next</button></div></div>';
        const activeFilters = [];
        if (state.registerRiskFilter) activeFilters.push('<button type="button" class="nx-tl-chip active" data-action="clear-register-risk">' + escapeHTML(state.registerRiskFilter) + ' risk ' + icon("close", 12) + '</button>');
        if (state.registerStatusFilter) activeFilters.push('<button type="button" class="nx-tl-chip active" data-action="clear-register-status">' + escapeHTML((TIMELINE_FILTERS.find(f => f.key === state.registerStatusFilter) || { label: state.registerStatusFilter }).label) + ' ' + icon("close", 12) + '</button>');
        const filterRow = activeFilters.length ? '<div class="nx-tl-filters" style="margin-bottom:12px">' + activeFilters.join("") + '</div>' : '';
        const suggest = (state.searchSuggestOpen && state.query.trim())
          ? '<div class="nx-search-suggest" data-suggest-box>' + searchSuggestionsHTML(state.query) + '</div>' : '';
        return '<section class="nx-card"><div class="nx-cardhead"><div><h3>Contract Register' + (categoryFilter ? ' - ' + escapeHTML(categoryFilter) : '') + '</h3><div class="sub">' + filtered.length + ' contracts · 20 rows per page' + (state.selectedCat ? ' · chart drill-down active' : '') + '</div></div></div>' + filterRow + '<div class="nx-toolbar" style="margin-bottom:12px"><div class="nx-search nx-searchwrap">' + icon("search", 16) + '<input id="vendor-search" class="nx-input" type="search" autocomplete="off" aria-label="Search contracts" placeholder="Search supplier, contract, owner, disposition..." value="' + escapeHTML(state.query) + '" style="width:100%">' + suggest + '</div><select id="category-select" class="nx-select" aria-label="Filter by category"><option value="">All categories</option>' + categoryOptions + '</select></div><div class="nx-table-wrap nx-filter-fade" style="overflow-x:auto"><table class="nx-table"><thead><tr><th>Supplier / Contract</th><th>Category</th><th>TCV</th><th>Sourcing Owner</th><th>Renewal / Disposition</th><th>Expires</th><th>Status / Risk</th></tr></thead><tbody>' + (rows || '<tr><td colspan="7" style="color:var(--ink-soft);font-weight:650">No matching contracts.</td></tr>') + '</tbody></table></div>' + pager + '</section>';
      }

      const TIMELINE_FILTERS = [
        { key: "all", label: "All" },
        { key: "expired", label: "Expired" },
        { key: "critical", label: "Critical 0–30" },
        { key: "renewal", label: "Renewal 31–90" },
        { key: "noDate", label: "No Expiry Date" },
        { key: "highRisk", label: "High Risk" },
        { key: "autoRenew", label: "Auto Renew" },
        { key: "missingOwner", label: "Missing Owner" },
        { key: "missingTcv", label: "Missing TCV" },
        { key: "marketCheck", label: "Market Check" }
      ];

      function contractMatchesFilter(c, key) {
        switch (key) {
          case "expired": return Number.isFinite(c.daysOut) && c.daysOut < 0;
          case "critical": case "d30": return Number.isFinite(c.daysOut) && c.daysOut >= 0 && c.daysOut <= 30;
          case "renewal": case "d90": return Number.isFinite(c.daysOut) && c.daysOut > 30 && c.daysOut <= 90;
          case "noDate": return !Number.isFinite(c.daysOut);
          case "highRisk": return c.riskLevel === "High";
          case "autoRenew": return isAutoRenewContract(c);
          case "missingOwner": return !hasText(c.sourcingOwner);
          case "missingTcv": return !c.hasTcv;
          case "marketCheck": return isMarketCheckContract(c);
          case "all": default: return true;
        }
      }

      function timelineCard(c) {
        const rc = riskColor(c.riskLevel);
        const accent = c.status === "Expired" ? "#64748b" : c.status === "Critical" ? BRAND.rose : c.status === "Renewal" ? BRAND.amber : BRAND.violet;
        const dayText = Number.isFinite(c.daysOut) ? (c.daysOut < 0 ? Math.abs(c.daysOut) + "d overdue" : c.daysOut + "d left") : "No date";
        const highlight = state.highlightId === c.id ? " nx-contract-highlight" : "";
        return '<div class="nx-tl-card' + highlight + '" style="--accent:' + accent + '">' +
          '<div class="tl-main"><div class="tl-vend">' + escapeHTML(c.vendor || "Unknown supplier") + '</div><div class="tl-sub">' + escapeHTML(c.contractNumber || c.id) + (c.contractName ? ' · ' + escapeHTML(c.contractName) : '') + '</div><div style="margin-top:7px">' + badge(c.category, (CATEGORY_COLORS[c.category] || BRAND.blue600) + "1e", CATEGORY_COLORS[c.category] || BRAND.blue600) + ' ' + badge(c.riskLevel + " · " + c.riskScore, rc + "22", rc) + '</div></div>' +
          '<div class="tl-cell"><span class="tl-k">TCV</span><span class="tl-v">' + contractValueText(c) + '</span></div>' +
          '<div class="tl-cell"><span class="tl-k">Expiry</span><span class="tl-v">' + escapeHTML(fmtDate(contractDate(c))) + '</span><span class="tl-v" style="color:' + rc + ';font-weight:850">' + dayText + '</span></div>' +
          '<div class="tl-cell"><span class="tl-k">Owner / Action</span><span class="tl-v">' + escapeHTML(c.sourcingOwner || "Unassigned") + '</span><span class="tl-v" style="color:var(--ink-soft);font-weight:650">' + escapeHTML(c.disposition || c.renewalType || "No disposition") + '</span></div>' +
          '<div class="tl-actions"><button type="button" class="nx-act-btn solid" data-open-contract="' + escapeHTML(c.id) + '">Open contract</button><button type="button" class="nx-act-btn" data-action="show-in-register" data-id="' + escapeHTML(c.id) + '">Show in Register</button><button type="button" class="nx-act-btn" data-action="ask-genius-contract" data-id="' + escapeHTML(c.id) + '">Ask Genius</button></div>' +
        '</div>';
      }

      function renderTimelineFilterBar(activeKey) {
        const counts = {};
        TIMELINE_FILTERS.forEach(f => { counts[f.key] = f.key === "all" ? state.data.length : state.data.filter(c => contractMatchesFilter(c, f.key)).length; });
        const chips = TIMELINE_FILTERS.map(f =>
          '<button type="button" class="nx-tl-chip' + (activeKey === f.key && !state.timelineCategoryFilter && !state.timelineRiskFilter ? ' active' : '') + '" data-timeline-filter="' + f.key + '">' + escapeHTML(f.label) + '<span class="ct">' + counts[f.key] + '</span></button>'
        ).join("");
        const contextCount = (state.timelineContextIds || []).length;
        const crossActive = state.timelineCategoryFilter || state.timelineRiskFilter || contextCount;
        const clear = (activeKey !== "all" || crossActive) ? '<button type="button" class="nx-tl-chip nx-tl-clear" data-action="clear-timeline-filter">' + icon("close", 13) + ' Clear filter</button>' : '';
        const crossChip = crossActive
          ? '<div class="nx-tl-filters"><span class="nx-tl-chip active">' + escapeHTML(contextCount ? contextCount + " selected contracts" : (state.timelineCategoryFilter || (state.timelineRiskFilter + " risk"))) + '</span></div>'
          : '';
        const suggest = (state.timelineSuggestOpen && state.timelineQuery.trim())
          ? '<div class="nx-search-suggest" data-suggest-box>' + searchSuggestionsHTML(state.timelineQuery) + '</div>' : '';
        const searchBar = '<div class="nx-toolbar"><div class="nx-search nx-searchwrap">' + icon("search", 16) + '<input id="timeline-search" class="nx-input" type="search" autocomplete="off" aria-label="Search renewals" placeholder="Search supplier, contract number, owner..." value="' + escapeHTML(state.timelineQuery) + '" style="width:100%">' + suggest + '</div></div>';
        return '<div class="nx-tl-bar">' + searchBar + '<div class="nx-tl-filters">' + chips + clear + '</div>' + crossChip + '</div>';
      }

      function renderExpirations() {
        if (!state.data.length) return renderEmptyDashboard();
        const activeKey = state.timelineFilter || "all";
        const bar = renderTimelineFilterBar(activeKey);
        const contextIds = new Set(state.timelineContextIds || []);
        const crossActive = state.timelineCategoryFilter || state.timelineRiskFilter || contextIds.size;
        const q = state.timelineQuery.trim().toLowerCase();
        const qFilter = c => q ? [c.vendor, c.supplierName, c.contractNumber, c.contractName, c.category, c.sourcingOwner, c.disposition].some(v => String(v || "").toLowerCase().includes(q)) : true;

        if (activeKey === "all" && !crossActive && !q) {
          const buckets = getBuckets();
          const cols = [
            { key: "expired", title: "Expired", accent: "#64748b", rows: buckets.expired },
            { key: "d30", title: "Critical - 30 Days", accent: BRAND.rose, rows: buckets.d30 },
            { key: "d90", title: "Renewal - 31 to 90 Days", accent: BRAND.amber, rows: buckets.d90 },
            { key: "noDate", title: "No Expiry Date", accent: BRAND.violet, rows: buckets.noDate }
          ];
          const kanban = '<section class="nx-kanban nx-filter-fade">' + cols.map(col => {
            const cards = col.rows.length ? col.rows.map(c => {
              const rc = riskColor(c.riskLevel);
              const dayText = Number.isFinite(c.daysOut) ? c.daysOut + 'd' : 'No date';
              const highlight = state.highlightId === c.id ? " nx-contract-highlight" : "";
              return '<div class="nx-kcard' + highlight + '" style="--accent:' + col.accent + '" data-renew="' + escapeHTML(c.id) + '"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="v">' + escapeHTML(c.vendor) + '</span>' + icon("chevron", 15) + '</div><div style="margin-top:5px">' + badge(c.category, (CATEGORY_COLORS[c.category] || BRAND.blue600) + "1e", CATEGORY_COLORS[c.category] || BRAND.blue600) + '</div><div class="meta"><span>' + (c.hasTcv ? fmtMoney(c.annualSpend) : escapeHTML(c.tcvStatus || "No TCV")) + ' · ' + escapeHTML(c.disposition || c.renewalType || "No disposition") + '</span><span style="color:' + rc + ';font-weight:800">' + dayText + ' · ' + c.riskLevel + '</span></div></div>';
            }).join("") : '<div style="padding:22px 8px;text-align:center;color:var(--ink-soft);font-size:12.5px">' + icon("check", 20) + '<br>Nothing in this window.</div>';
            return '<div class="nx-kcol" style="--accent:' + col.accent + '"><div class="nx-kcol-head"><div style="display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;color:var(--ink)"><span style="color:' + col.accent + '">' + icon("clock", 15) + '</span>' + escapeHTML(col.title) + '</div><span class="ct">' + col.rows.length + '</span></div>' + cards + '</div>';
          }).join("") + '</section>';
          return bar + kanban;
        }

        let rows = state.data.slice();
        if (contextIds.size) rows = rows.filter(c => contextIds.has(c.id));
        if (state.timelineCategoryFilter) rows = rows.filter(c => c.category === state.timelineCategoryFilter);
        if (state.timelineRiskFilter) rows = rows.filter(c => c.riskLevel === state.timelineRiskFilter);
        rows = rows.filter(c => contractMatchesFilter(c, activeKey)).filter(qFilter)
          .sort((a, b) => priorityScore(b) - priorityScore(a) || ((a.daysOut ?? 99999) - (b.daysOut ?? 99999)));
        const label = contextIds.size ? "Selected contracts" : ((TIMELINE_FILTERS.find(f => f.key === activeKey) || {}).label || "All");
        const board = rows.length
          ? '<div class="nx-tl-board nx-filter-fade">' + rows.map(timelineCard).join("") + '</div>'
          : '<div class="nx-tl-empty">' + icon("check", 24) + '<div style="margin-top:8px">No contracts match this filter.</div></div>';
        return bar + '<section class="nx-card"><div class="nx-cardhead"><div><h3>Renewal Priority Board · ' + escapeHTML(label) + '</h3><div class="sub">' + rows.length + ' contracts · sorted by priority score</div></div></div>' + board + '</section>';
      }

      function renderImportAudit() {
        const a = state.readerAudit;
        if (!a) return "";
        const confidence = a.importConfidence || state.importConfidence || { score: 0, label: "Not scored", risks: [] };
        const stat = (label, value) => '<div class="import-quality-metric"><span class="nx-label">' + escapeHTML(label) + '</span><b>' + escapeHTML(value) + '</b></div>';
        const detected = (a.detectedSheets || []).length ? '<div style="margin-top:12px;font-size:12px;color:var(--ink-soft);line-height:1.55"><b>Detected sheets:</b> ' + a.detectedSheets.map(s => escapeHTML(s.name) + ' (' + s.rows + ' rows)').join(", ") + '</div>' : "";
        const notes = (a.warnings || []).length ? '<div class="import-quality-notes"><span class="nx-label">Reader notes</span><ul>' + a.warnings.map(note => '<li>' + escapeHTML(note) + '</li>').join("") + '</ul></div>' : "";
        const risks = (confidence.risks || []).map(risk => '<div class="import-quality-risk">' + icon("warning", 15) + '<span>' + escapeHTML(risk) + '</span></div>').join("");
        const mappedCritical = Math.max(0, 7 - (confidence.missingCriticalFields || []).length);
        const unmappedCount = (a.unmappedFields || []).length;
        return '<section class="nx-card" style="margin-top:14px"><div class="nx-cardhead"><div><h3>Import Quality Report</h3><div class="sub">Selected sheet: ' + escapeHTML(a.selectedSheet || "CSV upload") + ' · Header row ' + escapeHTML(a.headerRow ? String(a.headerRow) : "auto-detected") + '</div></div><span class="nx-pill"><span class="dot"></span> Local validation</span></div><div class="import-quality-grid"><div><div class="import-quality-metrics">' +
          stat("Rows imported", String(a.contractsImported || 0)) +
          stat("Rows skipped", String(a.rowsSkipped || 0)) +
          stat("Mapped critical fields", String(mappedCritical)) +
          stat("Unmapped fields", String(unmappedCount)) +
          stat("Missing expiration", String(a.missingExpiryCount || 0)) +
          stat("Missing owners", String(a.missingOwnerCount || 0)) +
          stat("Missing / zero TCV", String(a.zeroMissingTcvCount || 0)) +

          ...finalConfidence,
          score,
          label: confidenceLabel(score),
          risks: finalConfidence.risks?.length && state.importStep > 0 ? finalConfidence.risks : pendingRisks
        };
      }

      function smartSearch(query, limit = 8) {
        const raw = String(query || "").trim();
        if (!raw) return [];
        const norm = normalizeText(raw);
        const compact = compactText(raw);
        const tokens = norm.split(" ").filter(Boolean);
        if (!tokens.length) return [];
        return state.data.map(c => {
          const supplier = normalizeText(c.vendor || c.supplierName);
          const supplierC = compactText(c.vendor || c.supplierName);
          const num = normalizeText(c.contractNumber);
          const numC = compactText(c.contractNumber);
          const fields = [
            { v: c.vendor, w: 6 }, { v: c.supplierName, w: 6 }, { v: c.contractName, w: 4 },
            { v: c.contractNumber, w: 5 }, { v: c.category, w: 3 }, { v: c.sourcingOwner, w: 3 },
            { v: c.contractSponsor, w: 2 }, { v: c.disposition, w: 2 }, { v: c.renewalType, w: 2 }
          ];
          let score = 0;
          // exact / strong supplier + contract number matches rank highest
          if (supplier && supplier === norm) score += 60;
          if (num && num === norm) score += 70;
          if (supplier && supplier.startsWith(norm)) score += 22;
          if (supplierC && compact && supplierC.startsWith(compact)) score += 18;
          if (numC && compact && (numC.includes(compact) || compact.includes(numC))) score += 30;
          fields.forEach(f => {
            const fn = normalizeText(f.v);
            const fc = compactText(f.v);
            if (!fn) return;
            if (fn.includes(norm)) score += f.w * 3;
            tokens.forEach(t => {
              if (t.length < 2) return;
              if (fn.includes(t)) score += f.w;
              else if (fc.includes(t)) score += f.w * 0.6;
              else if (fn.split(" ").some(word => word.length > 3 && levenshtein(word, t) <= 1)) score += f.w * 0.5;
            });
          });
          return { c, score };
        }).filter(h => h.score > 0)
          .sort((a, b) => b.score - a.score || priorityScore(b.c) - priorityScore(a.c))
          .slice(0, limit)
          .map(h => h.c);
      }

      function searchSuggestionsHTML(query) {
        const matches = smartSearch(query, 8);
        if (!matches.length) return '<div class="nx-suggest-empty">No supplier or contract matches “' + escapeHTML(String(query)) + '”.</div>';
        return matches.map(c => {
          const days = Number.isFinite(c.daysOut) ? (c.daysOut < 0 ? Math.abs(c.daysOut) + "d overdue" : c.daysOut + "d left") : "No date";
          const quality = qualityFlags(c).length ? qualityFlags(c).length + " quality flag" + (qualityFlags(c).length === 1 ? "" : "s") : "Quality checked";
          return '<button type="button" class="nx-suggest-row" data-suggest-id="' + escapeHTML(c.id) + '"><span class="sr-top">' + escapeHTML(c.vendor || "Unknown supplier") + '</span><span class="sr-sub">' + escapeHTML(c.contractNumber || c.id) + (c.contractName ? ' · ' + escapeHTML(c.contractName) : '') + '</span><span class="sr-meta"><span class="sr-chip">' + escapeHTML(c.category || "Unmapped") + '</span><span class="sr-chip">' + escapeHTML(days) + '</span><span class="sr-chip">' + escapeHTML(c.sourcingOwner || "Unassigned") + '</span><span class="sr-chip">' + escapeHTML(c.status || "No status") + '</span><span class="sr-chip">' + escapeHTML(c.hasTcv ? contractValueText(c) : c.tcvStatus || "No TCV") + '</span><span class="sr-chip">' + escapeHTML(quality) + '</span></span></button>';

      function clearHighlightSoon(id) {
        window.setTimeout(() => { if (state.highlightId === id) state.highlightId = null; }, 3000);

      function scrollHighlightIntoView() {

        return String(value == null ? "" : value).replace(/["\\]/g, "\\$&");

      function navigateToContract(contractId, options = {}) {
        const c = state.data.find(r => r.id === contractId);

        const target = options.targetView || "register";
        state.notifOpen = false;
        state.registerSearchOpen = false;
        state.timelineSearchOpen = false;
        state.searchSuggestOpen = false;
        state.timelineSuggestOpen = false;
        state.activeSearchBox = null;
        if (target === "modal") {
          state.activeModal = null;
          openContractModal(contractId);
          return;
        }
        if (target === "timeline") {

          state.page = "expirations";
          state.timelineFilter = "all";
          state.timelineCategoryFilter = null;
          state.timelineRiskFilter = null;
          state.timelineContextIds = [];
          state.timelineQuery = "";
          state.highlightId = options.highlight === false ? null : contractId;

        state.selectedCatSource = null;

        state.highlightId = options.highlight === false ? null : contractId;

      function askGeniusAboutContract(contractId) {
        const c = state.data.find(r => r.id === contractId);
        if (!c) return;
        const prompt = "Analyze this contract: " + (c.vendor || "supplier") + " " + (c.contractNumber || c.id) + ". Give me urgency, renewal risk, negotiation leverage, data gaps, and next steps.";
        state.activeModal = null;
        askContractGenius(prompt);
      }

      async function runContractImport(loaderFn) {
        if (state.importing) return;
        state.importing = true;
        state.importStep = 0;
        state.importConfidence = {
          score: 0,
          label: "Building confidence",
          mappedFields: [],
          missingCriticalFields: [],
          warnings: [],
          risks: ["Scanning workbook structure and critical contract fields"],
          needsReviewCount: 0
        };
        state.drag = false;
        render({ skipLayerFocus: true });
        let result = null;
        try {
          for (let i = 0; i < CONTRACT_IMPORT_STEPS.length; i += 1) {
            state.importStep = i;
            updateContractLoader();
            if (i === 0) result = await loaderFn();
            await sleep(i === 0 ? 180 : 115);
          }
          state.importStep = CONTRACT_IMPORT_STEPS.length;
          updateContractLoader();
          await sleep(180);
          state.importing = false;
          state.importStep = 0;
          state.welcomeOpen = false;
          state.drawerOpen = false;
          state.notifOpen = false;
          state.page = "dashboard";
          render({ viewTransition: true, skipLayerFocus: true });
          const count = result && Number.isFinite(result.imported) ? result.imported : state.data.length;
          pushToast("Contract data imported", count + " contracts ready for local analysis.");
        } catch (err) {
          state.importing = false;
          state.importStep = 0;
          render({ skipLayerFocus: true });
          pushToast("Import failed", String((err && err.message) || err || "The workbook could not be processed locally."));
        }
      }

      function relatedContractsSection(rows, title = "Related Contracts", limit = 50) {
        const top = rows.slice().sort((a, b) => priorityScore(b) - priorityScore(a) || contractTcv(b) - contractTcv(a)).slice(0, limit);
        if (!top.length) return modalSection(title, "No related contracts match this drill-down.");
        return modalSectionHTML(title, '<div class="nx-modal-scanbar"><input class="nx-input" type="search" data-modal-search placeholder="Search this view..." aria-label="Search contracts in modal"><button type="button" class="nx-modal-filter active" data-modal-filter="all">All</button><button type="button" class="nx-modal-filter" data-modal-filter="high">High risk</button><button type="button" class="nx-modal-filter" data-modal-filter="urgent">Inside 90d</button><button type="button" class="nx-modal-filter" data-modal-filter="quality">Needs review</button></div><div class="nx-modal-table-wrap"><table class="nx-modal-table" style="min-width:0;table-layout:fixed"><thead><tr><th style="width:28%">Supplier / Contract</th><th style="width:18%">Category / Status</th><th style="width:17%">TCV / Expiry</th><th style="width:20%">Owner / Risk</th><th style="width:17%">Actions</th></tr></thead><tbody>' + top.map(c => {
          const days = Number.isFinite(c.daysOut) ? (c.daysOut < 0 ? Math.abs(c.daysOut) + "d overdue" : c.daysOut + "d left") : "No date";
          const searchText = [c.vendor, c.contractNumber, c.contractName, c.category, c.sourcingOwner, c.status, c.riskLevel, c.disposition].join(" ");
          const flags = qualityFlags(c);
          return '<tr data-modal-row data-risk="' + escapeHTML(normalizeText(c.riskLevel)) + '" data-urgent="' + (Number.isFinite(c.daysOut) && c.daysOut <= 90 ? "true" : "false") + '" data-quality="' + (flags.length ? "true" : "false") + '" data-modal-search-text="' + escapeHTML(normalizeText(searchText)) + '"><td><strong>' + escapeHTML(c.vendor || "Unknown supplier") + '</strong><br><span style="color:var(--ink-soft)">' + escapeHTML(c.contractNumber || c.id) + (c.contractName ? ' - ' + escapeHTML(c.contractName) : '') + '</span><div class="nx-contract-chips"><span class="nx-contract-chip">' + escapeHTML(c.sourceSheetName || c.originalSheetName || "Source") + ' row ' + escapeHTML(String(c.sourceRowNumber || c.originalRowNumber || "—")) + '</span>' + (flags.length ? '<span class="nx-contract-chip">' + flags.length + ' review flag' + (flags.length === 1 ? "" : "s") + '</span>' : '') + '</div></td><td>' + escapeHTML(c.category || "Unmapped") + '<div class="nx-contract-chips"><span class="nx-contract-chip">' + escapeHTML(c.status || "No status") + '</span><span class="nx-contract-chip">' + escapeHTML(c.renewalType || "No renewal type") + '</span></div></td><td><strong>' + contractValueText(c) + '</strong><br><span style="color:var(--ink-soft)">' + escapeHTML(fmtDate(contractDate(c))) + ' · ' + escapeHTML(days) + '</span></td><td>' + escapeHTML(c.sourcingOwner || "Unassigned") + '<div class="nx-contract-chips"><span class="nx-contract-chip">' + escapeHTML(c.riskLevel || "Risk") + ' · ' + escapeHTML(String(c.riskScore || 0)) + '</span><span class="nx-contract-chip">' + escapeHTML(c.disposition || "No disposition") + '</span></div></td><td><div class="rowact"><button type="button" class="nx-contract-ref" data-open-contract="' + escapeHTML(c.id) + '">Open</button><button type="button" class="nx-contract-ref" data-action="ask-genius-contract" data-id="' + escapeHTML(c.id) + '">Ask Genius</button></div></td></tr>';

      function qualitySummary(rows) {
        const counts = [
          ["Missing expiry date", rows.filter(c => !contractDate(c) || !Number.isFinite(c.daysOut)).length],
          ["Zero / missing TCV", rows.filter(c => !c.hasTcv).length],
          ["Category needs review", rows.filter(c => c.categorySource === "needs-review" || c.categoryReviewFlag).length],
          ["Auto-renew notice deadline not mapped", rows.filter(c => isAutoRenewContract(c) && !c.noticeDeadlineDate).length],
          ["Unassigned sourcing owner", rows.filter(c => !hasText(c.sourcingOwner)).length],
          ["Missing sponsor", rows.filter(c => !hasText(c.contractSponsor)).length],
          ["Missing administrator", rows.filter(c => !hasText(c.contractAdministrator)).length],
          ["Missing signatory", rows.filter(c => !hasText(c.authorizedSignatory)).length]
        ].filter(([, count]) => count > 0);
        return counts;
      }

      function qualitySection(rows) {
        const counts = qualitySummary(rows);
        if (!counts.length) return "";
        return modalSectionHTML("Data quality / missing fields", '<p class="nx-modal-copy">These fields should be cleaned before the drill-down is used for final reporting or execution.</p><div class="nx-modal-table-wrap" style="margin-top:10px"><table class="nx-modal-table" style="min-width:520px"><thead><tr><th>Issue</th><th>Rows</th></tr></thead><tbody>' + counts.map(([label, count]) => '<tr><td><strong>' + escapeHTML(label) + '</strong></td><td>' + count + '</td></tr>').join("") + '</tbody></table></div>');
      }

      function recommendedActionsForRows(rows) {
        const actions = [];
        if (rows.some(c => Number.isFinite(c.daysOut) && c.daysOut < 0)) actions.push("Confirm whether expired services are still active and document renewal, termination, or exception path.");
        if (rows.some(c => Number.isFinite(c.daysOut) && c.daysOut >= 0 && c.daysOut <= 30)) actions.push("Assign same-week owners for contracts inside 30 days and verify notice deadlines from source documents.");
        if (rows.some(isAutoRenewContract)) actions.push("Review auto-renew notice windows before passive renewal can occur.");
        if (rows.some(c => !c.hasTcv)) actions.push("Clean TCV values or explicitly mark contracts as no-cost before using spend totals.");
        if (rows.some(c => !contractDate(c))) actions.push("Recover missing expiry dates before placing the row in a renewal calendar.");
        if (rows.some(isMarketCheckContract)) actions.push("Package market-check candidates with scope, incumbent terms, owner, and sourcing timeline.");
        if (rows.some(c => !hasText(c.sourcingOwner))) actions.push("Assign sourcing responsibility so follow-up does not sit unowned.");
        if (!actions.length) actions.push("Keep the segment on the normal governance cadence and refresh terms before the next renewal cycle.");
        return actions.slice(0, 5);
      }

      function drilldownModalBody(rows, options = {}) {
        const spend = sumSpend(rows);
        const totalSpend = sumSpend(state.data) || 1;
        const urgent = rows.filter(c => Number.isFinite(c.daysOut) && c.daysOut >= 0 && c.daysOut <= 90).length;
        const expired = rows.filter(c => Number.isFinite(c.daysOut) && c.daysOut < 0).length;
        const high = rows.filter(c => c.riskLevel === "High").length;
        const noTcv = rows.filter(c => !c.hasTcv).length;
        const baseStats = [
          modalStat("Contracts", String(rows.length)),
          modalStat("Positive TCV", fmtMoney(spend)),
          modalStat("Share of Spend", Math.round((spend / totalSpend) * 100) + "%"),
          modalStat("Avg Risk", String(avgValue(rows, "riskScore"))),
          modalStat("Renewals <= 90d", String(urgent)),
          modalStat("Expired", String(expired)),
          modalStat("High Risk", String(high)),
          modalStat("No TCV", String(noTcv))
        ];
        const stats = options.stats || baseStats;
        const summary = options.summary || (rows.length + " contracts carry " + fmtMoney(spend) + " in positive TCV. " + urgent + " are inside 90 days and " + noTcv + " have zero or missing TCV.");
        const why = options.why || "This view combines renewal timing, workbook TCV, owner accountability, source profile, and risk scoring so leaders can convert a dashboard slice into an execution queue.";
        const actions = options.actions || recommendedActionsForRows(rows);
        const ids = rows.map(c => c.id).filter(Boolean).join("|");
        const actionBar = crossNavBar([
          '<button type="button" class="nx-act-btn solid" data-action="open-modal-genius" data-context-ids="' + escapeHTML(ids) + '">' + icon("sparkle", 14) + ' Open in Contract Genius</button>',
          '<button type="button" class="nx-act-btn" data-action="show-modal-timeline" data-context-ids="' + escapeHTML(ids) + '">' + icon("clock", 14) + ' Show in Renewal Timeline</button>',
          '<button type="button" class="nx-act-btn" data-action="copy-modal-view" data-context-ids="' + escapeHTML(ids) + '">' + icon("file", 14) + ' Copy summary</button>'
        ], true);
        return actionBar + '<div class="nx-modal-grid">' + stats.join("") + '</div>' +
          modalSection("Executive Summary", summary) +
          modalSection("Why this matters", why) +
          modalSectionHTML("Recommended next actions", modalList(actions)) +
          qualitySection(rows) +
          relatedContractsSection(rows, options.relatedTitle || "Related contracts");
      }

      function renderModal() {

      function renderWelcome() {

        return '<div class="nx-welcome-scrim" data-action="close-welcome" role="presentation"><section class="nx-welcome" data-welcome-card role="dialog" aria-modal="true" aria-label="Welcome to Corewell Contract Intelligence"><div class="nx-welcome-head"><div><div class="nx-welcome-kicker">' + icon("shield", 15) + ' Local browser workspace</div><h2>Welcome to Corewell Contract Intelligence</h2><p>Start with a contract CSV or XLSX file, or load a demo portfolio. The Smart Reader, schema matching, charts, and summaries all run inside this browser session.</p></div><button type="button" class="nx-icbtn" style="background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.14);color:#fff" data-action="close-welcome" aria-label="Close welcome">' + icon("close", 18) + '</button></div><div class="nx-welcome-body"><section id="welcome-drop-zone" class="nx-welcome-drop ' + (state.drag ? 'drag' : '') + '" role="button" tabindex="0"><div><div class="ic">' + icon("upload", 32) + '</div><strong>Drop your contract file here</strong><span>CSV, TXT, or XLSX files are parsed locally. Date fields are converted on-device and irregular headers are mapped automatically.</span><input id="welcome-file-input" type="file" accept=".csv,.txt,.xlsx" style="display:none"></div></section><aside class="nx-welcome-side"><div class="nx-welcome-panel"><h3>Private by design</h3><p>No network request is needed for file parsing or analysis. Your metrics stay in local browser memory.</p></div><div class="nx-welcome-panel"><h3>Smart Reader ready</h3><p>Supplier, amount, category, sourcing profile, and renewal timing fields are normalized with deterministic local heuristics.</p></div><div class="nx-welcome-actions"><button type="button" class="nx-btn primary" data-action="welcome-file">' + icon("spreadsheet", 16) + ' Add file</button><button type="button" class="nx-btn ghost" style="border-color:rgba(255,255,255,.18);color:#fff" data-action="load-demo">' + icon("file", 16) + ' Load demo file</button></div></aside></div></section></div>';

      function clearChartSelections() {
        if (state.selectedCatSource === "chart") state.selectedCat = null;
        if (state.selectedCatSource === "chart") state.selectedCatSource = null;
        state.selectedRisk = null;
        state.selectedTrend = null;
        state.selectedSourcing = null;
        state.selectedMatrix = null;

      function closeModal({ resetChartSelection = true } = {}) {
        state.activeModal = null;

        render();

      function setActiveModal(modal, source = "other") {
        state.activeModal = modal;
        state.activeModalSource = source;

      function sumSpend(rows) {
        return rows.reduce((sum, row) => sum + Number(row.annualSpend || 0), 0);
      }

      function avgValue(rows, key) {
        return rows.length ? Math.round(rows.reduce((sum, row) => sum + Number(row[key] || 0), 0) / rows.length) : 0;
      }

      function topVendorList(rows) {
        return relatedContractsSection(rows, "Related contracts", 5);
      }

      function stdDev(values) {
        const nums = values.map(Number).filter(Number.isFinite);
        if (nums.length < 2) return 0;
        const mean = nums.reduce((a, b) => a + b, 0) / nums.length;
        const variance = nums.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / nums.length;
        return Math.sqrt(variance);
      }

      function nearestExpiry(rows) {
        const upcoming = rows.filter(c => Number.isFinite(c.daysOut)).sort((a, b) => a.daysOut - b.daysOut)[0];
        return upcoming ? fmtDate(contractDate(upcoming)) : "the upcoming";
      }

      function pricingAnomalyNote(rows) {
        const spends = rows.map(c => Number(c.annualSpend || 0));
        const sd = stdDev(spends);
        const mean = spends.length ? spends.reduce((a, b) => a + b, 0) / spends.length : 0;
        if (!mean || !sd) return "Spend is evenly distributed with no statistical pricing outliers.";
        const outliers = rows.filter(c => Math.abs(Number(c.annualSpend || 0) - mean) > sd * 1.5);
        if (!outliers.length) return "Spend dispersion is tight (σ " + fmtMoney(sd) + "); no pricing outliers flagged.";
        return outliers.length + " vendor" + (outliers.length === 1 ? "" : "s") + " sit beyond 1.5σ (" + fmtMoney(sd) + ") of the " + fmtMoney(mean) + " mean, signalling pricing anomalies worth benchmarking.";
      }

      function strategicDirective(rows) {
        const urgent = rows.filter(c => Number.isFinite(c.daysOut) && c.daysOut >= 0 && c.daysOut <= 90).length;
        const high = rows.filter(c => c.riskLevel === "High").length;
        const market = rows.filter(isMarketCheckContract).length;
        const auto = rows.filter(isAutoRenewContract).length;
        if (high && urgent) return "Prioritize renewal triage for high-risk contracts before negotiating broader consolidation.";
        if (market) return "Start sourcing or market-check workstream and confirm owner accountability.";
        if (auto) return "Review auto-renew notice windows before the next contract action date.";
        if (rows.filter(c => c.tail).length > rows.length * .5) return "Bundle tail-spend vendors into a focused consolidation event to improve leverage.";
        return "Maintain benchmark discipline and refresh terms where spend concentration is rising.";
      }

      function crossNavBar(buttons, sticky) {
        if (!buttons.length) return "";
        return '<div class="nx-modal-actionbar' + (sticky ? " sticky" : "") + '">' + buttons.join("") + '</div>';
      }

      function categoryCrossNav(category) {
        const enc = escapeHTML(category);
        return crossNavBar([
          '<button type="button" class="nx-act-btn solid" data-action="filter-register-category" data-cat="' + enc + '">' + icon("filter", 14) + ' Filter Register to this Category</button>',
          '<button type="button" class="nx-act-btn" data-action="filter-timeline-category" data-cat="' + enc + '">' + icon("clock", 14) + ' Filter Renewal Timeline</button>',
          '<button type="button" class="nx-act-btn" data-action="ask-genius-category" data-cat="' + enc + '">' + icon("sparkle", 14) + ' Ask Contract Genius about this Category</button>'
        ]);
      }

      function riskCrossNav(level) {
        const enc = escapeHTML(level);
        return crossNavBar([
          '<button type="button" class="nx-act-btn solid" data-action="filter-register-risk" data-risk="' + enc + '">' + icon("filter", 14) + ' Filter Register to this Risk Level</button>',
          '<button type="button" class="nx-act-btn" data-action="filter-timeline-risk" data-risk="' + enc + '">' + icon("clock", 14) + ' Filter Renewal Timeline</button>',
          '<button type="button" class="nx-act-btn" data-action="ask-genius-risk" data-risk="' + enc + '">' + icon("sparkle", 14) + ' Ask Contract Genius about this Risk Tier</button>'
        ]);
      }

      function riskTierMeaning(level) {
        if (level === "High") return "High-risk contracts combine deadline pressure, high TCV, auto-renew or termination signals, and/or missing ownership data. They should move into a renewal-control queue with named owners before any other work.";
        if (level === "Medium") return "Medium-risk contracts have one or two pressure points — usually renewal timing or a data gap. They need monitoring and a confirmed owner so they do not slip into the high-risk tier.";
        return "Low-risk contracts are on the normal governance cadence. Validate terms before the next renewal cycle and watch for emerging timing or metadata issues.";
      }

      function openCategoryModal(category) {
        const rows = state.data.filter(c => c.category === category);
        const spend = sumSpend(rows);
        const totalSpend = sumSpend(state.data) || 1;
        const categoryPercentage = Math.round((spend / totalSpend) * 100);
        const calculatedRisk = avgValue(rows, "riskScore");
        const tail = rows.filter(c => c.tail);
        const tailShare = rows.length ? Math.round((tail.length / rows.length) * 100) : 0;
        const abstract = `This category represents ${categoryPercentage}% of total managed spend across ${rows.length} contracts. With ${tailShare}% of its vendors in the tail-spend band and an average risk index of ${calculatedRisk}, the deterministic heuristic flags it as a ${calculatedRisk >= 60 ? "priority consolidation target" : "monitored segment"} ahead of the ${nearestExpiry(rows)} renewal deadline. ${strategicDirective(rows)}`;
        setActiveModal({
          title: category,
          subtitle: "Category drill-down · Secure local summary",
          body: categoryCrossNav(category) + drilldownModalBody(rows, {
            stats: [
              modalStat("Contracts", String(rows.length)),
              modalStat("Positive TCV", fmtMoney(spend)),
              modalStat("Share of Spend", categoryPercentage + "%"),
              modalStat("Avg Risk", String(calculatedRisk)),
              modalStat("No TCV", String(rows.filter(c => c.hasTcv === false).length)),
              modalStat("Next Renewal", nearestExpiry(rows))
            ],
            summary: abstract,
            why: "Category views reveal where spend leverage, supplier dependency, renewal timing, and missing metadata intersect.",
            actions: recommendedActionsForRows(rows).concat(["Use the category owner to validate scope and whether the segment deserves a benchmark, market check, or renewal-control lane."]).slice(0, 5)
          }) + modalSection("Pricing Anomaly Scan", pricingAnomalyNote(rows))
        }, "chart");
      }

      function openRiskModal(level) {
        const rows = state.data.filter(c => c.riskLevel === level);
        const spend = sumSpend(rows);
        const totalSpend = sumSpend(state.data) || 1;
        const sharePct = Math.round((spend / totalSpend) * 100);
        const urgent = rows.filter(c => Number.isFinite(c.daysOut) && c.daysOut >= 0 && c.daysOut <= 90).length;
        const abstract = `The ${level.toLowerCase()}-risk tier holds ${rows.length} contracts (${sharePct}% of spend, ${fmtMoney(spend)}), of which ${urgent} renew inside 90 days. The deterministic engine weights source profile, renewal urgency and spend exposure, with the nearest deadline landing ${nearestExpiry(rows)}. ${strategicDirective(rows)}`;

      function openSourcingModal(name) {
        const band = getSourcingSplit().find(b => b.name === name);
        const rows = band ? band.rows : state.data.filter(c => (c.sourcingOwner || "Unassigned") === name);
        if (!rows.length) return;
        const spend = sumSpend(rows);
        const totalSpend = sumSpend(state.data) || 1;
        const pct = Math.round((spend / totalSpend) * 100);
        const urgent = rows.filter(c => Number.isFinite(c.daysOut) && c.daysOut >= 0 && c.daysOut <= 90).length;
        const highRisk = rows.filter(c => c.riskLevel === "High").length;
        const gaps = rows.filter(c => qualityFlags(c).length).length;
        const isUnassigned = band && band.assigned === false;
        const isOverflow = band && band.overflow;
        const noun = isUnassigned ? "are unowned and" : isOverflow ? "across " + band.ownerCount + " owners" : "owned by " + name;
        const cw = rows.length === 1 ? "contract has" : "contracts have";
        const abstract = isUnassigned
          ? `${rows.length} ${cw} no sourcing owner and carry ${fmtMoney(spend)} in positive TCV (${pct}% of spend), with ${urgent} renewing inside 90 days and ${highRisk} high-risk. Assign accountability before these slip. ${strategicDirective(rows)}`
          : `${rows.length} contract${rows.length === 1 ? "" : "s"} ${noun} represent ${fmtMoney(spend)} in positive TCV (${pct}% of spend), with ${urgent} renewing inside 90 days, ${highRisk} high-risk, and ${gaps} carrying data gaps. ${strategicDirective(rows)}`;
        setActiveModal({
          title: (isUnassigned ? "Unassigned" : name) + " Workload",
          subtitle: (isOverflow ? "Combined workload of " + band.ownerCount + " owners" : "Sourcing responsibility owner drill-down") + " · Local Intelligence Engine",
          body: drilldownModalBody(rows, {
            stats: [
              modalStat("Contracts", String(rows.length)),
              modalStat("Positive TCV", fmtMoney(spend)),
              modalStat("Share of Spend", pct + "%"),
              modalStat("Avg Risk", String(avgValue(rows, "riskScore"))),
              modalStat("Renewals <= 90d", String(urgent)),
              modalStat("High risk", String(highRisk)),
              modalStat("Data gaps", String(gaps)),
              modalStat("Next Renewal", nearestExpiry(rows))
            ],
            summary: abstract,
            why: isUnassigned
              ? "Unassigned contracts have no accountable owner for renewal, cleanup, or sourcing decisions. They are the highest-leverage place to assign ownership before deadlines force reactive work."
              : "This view is owner workload, not source type. It should drive accountability, capacity planning, and escalation when renewal timing or metadata gaps exceed the owner's bandwidth.",
            actions: (isUnassigned
              ? ["Assign a named sourcing owner (and backup) to every near-term or high-TCV row first."]
              : []).concat(recommendedActionsForRows(rows), ["Confirm whether this owner has capacity for all near-term renewals and assign backups for critical rows."]).slice(0, 5)
          })
        }, "chart");
        render();
      }

          subtitle: "Contingency matrix cell · Local drill-down",

              modalStat("Positive TCV", fmtMoney(spend)),
              modalStat("Avg Days Left", avgValue(rows.filter(c => Number.isFinite(c.daysOut)), "daysOut") + "d"),
