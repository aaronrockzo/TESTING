            });
          }
        }, 220);
      }

      function sourceSheetUsesDayBuckets(rows, headerMap) {
        const key = headerMap.fields.expiryDate || headerMap.fields.timeline;
        if (!key) return false;
        let smallNumbers = 0;
        let serialDates = 0;
        rows.slice(0, 120).forEach(row => {
          const value = cleanCell(row[key]);
          if (!value) return;
          const n = Number(value.replace(/,/g, ""));
          if (!Number.isFinite(n)) return;
          if (n > 10000) serialDates += 1;
          else if (n >= 0 && n <= 3650) smallNumbers += 1;
        });
        return smallNumbers > 10 && smallNumbers > serialDates * 2;
      }

      function dedupeImportedRows(rows) {
        const out = [];
        const seen = new Map();
        let duplicateRowsFound = 0;
        let duplicateContractsDeduped = 0;
        rows.forEach(row => {
          const key = row.duplicateGroupKey;
          if (!key || !row.contractNumber) {
            out.push(row);
            return;
          }
          const existing = seen.get(key);
          if (!existing) {
            seen.set(key, row);
            out.push(row);
            return;
          }
          duplicateRowsFound += 1;
          const existingDate = contractDate(existing) ? contractDate(existing).toISOString().slice(0, 10) : "";
          const rowDate = contractDate(row) ? contractDate(row).toISOString().slice(0, 10) : "";
          if (existing.totalContractValue === row.totalContractValue && existingDate === rowDate) {
            duplicateContractsDeduped += 1;
            existing.categories = [...new Set([...(existing.categories || [existing.category]), row.category].filter(Boolean))];
            existing.dataQualityFlags = [...new Set([...(existing.dataQualityFlags || []), "Duplicate row deduped; categories preserved"])];
            return;
          }
          const conflicts = [];
          if (existing.totalContractValue !== row.totalContractValue) conflicts.push("different TCV");
          if (existingDate !== rowDate) conflicts.push("different expiry date");
          row.dataQualityFlags = [...(row.dataQualityFlags || []), "Duplicate contract number with " + conflicts.join(" and ")];
          row.id = row.id + "-" + (out.length + 1);
          out.push(row);
        });
        return { rows: out, duplicateRowsFound, duplicateContractsDeduped };
      }

      function flagDuplicateContractNumbers(rows) {
        const groups = new Map();
        rows.forEach(row => {
          const key = compactText(row.contractNumber || "");
          if (!key) return;
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(row);
        });
        groups.forEach(group => {
          if (group.length < 2) return;
          const values = new Set(group.map(c => String(c.totalContractValue)));
          const dates = new Set(group.map(c => contractDate(c) ? contractDate(c).toISOString().slice(0, 10) : ""));
          if (values.size < 2 && dates.size < 2) return;
          group.forEach(c => {
            c.dataQualityFlags = [...new Set([...(c.dataQualityFlags || []), "Duplicate contract number has conflicting TCV or expiry date"])];
          });
        });
      }

      function isSummarySourceRow(row, headerMap) {
        const values = Object.entries(row || {}).filter(([key, value]) => !key.startsWith("__") && !isBlankish(value)).map(([, value]) => cleanCell(value));
        if (!values.length) return true;
        const first = normalizeText(values[0]);
        const identity = cleanTextField(mappedValue(row, headerMap, "contractNumber"), true) || cleanTextField(mappedValue(row, headerMap, "contractName"), true) || cleanTextField(mappedValue(row, headerMap, "supplierName") ?? mappedValue(row, headerMap, "vendor"), true);
        if (/^(grand total|subtotal|total|summary|report total|contract count|record count)$/.test(first) && !identity) return true;
        if (values.length <= 2 && /^(grand total|subtotal|total|summary|report total)/.test(first)) return true;
        return false;
      }

      function ingestRows(rows, name, { quiet = false } = {}) {
        const workbookAudit = rows.__workbookAudit || null;
        const allRows = rows.filter(r => r && Object.keys(r).some(k => !k.startsWith("__") && cleanCell(r[k])));
        const headerMap = buildHeaderMap(allRows);
        const summaryRowsIgnored = allRows.filter(row => isSummarySourceRow(row, headerMap)).length;
        const rawRows = allRows.filter(row => !isSummarySourceRow(row, headerMap));
        const sourceHeaders = [...new Set(allRows.flatMap(row => Object.keys(row || {}).filter(key => !key.startsWith("__"))))];
        const mappedSourceHeaders = new Set(Object.values(headerMap.fields));
        const unmappedFields = sourceHeaders.filter(header => !mappedSourceHeaders.has(header));
        const allowDayBucket = sourceSheetUsesDayBuckets(rawRows, headerMap);
        const dateOrder = detectDateOrder(rawRows, headerMap);
        const mapped = rawRows.map((row, i) => {
          const contractNumber = cleanTextField(mappedValue(row, headerMap, "contractNumber"), true);
          const supplierName = parseVendor(mappedValue(row, headerMap, "supplierName") ?? mappedValue(row, headerMap, "vendor"), i);
          const contractDescription = cleanTextField(mappedValue(row, headerMap, "contractDescription"), true);
          const contractName = cleanTextField(mappedValue(row, headerMap, "contractName"), true) || contractDescription;
          const tcvRaw = mappedValue(row, headerMap, "totalContractValue") ?? mappedValue(row, headerMap, "spend") ?? mappedValue(row, headerMap, "annualValue");
          const parsedTcv = parseMoney(tcvRaw);
          const hasTcv = Number.isFinite(parsedTcv) && parsedTcv > 0;
          const annualSpend = Number.isFinite(parsedTcv) ? parsedTcv : 0;
          const expiryRaw = mappedValue(row, headerMap, "expiryDate") ?? mappedValue(row, headerMap, "timeline");
          const expiry = parseDateValue(expiryRaw, { allowDayBucket, dateOrder });
          const noticeDeadline = parseDateValue(mappedValue(row, headerMap, "noticeDeadline"), { dateOrder });
          const execution = parseDateValue(mappedValue(row, headerMap, "executionDate"), { dateOrder });
          const categoryInfo = mapCategory(mappedValue(row, headerMap, "categoryLevel1") ?? mappedValue(row, headerMap, "categoryLevel2") ?? mappedValue(row, headerMap, "category"), row, i, {});
          const canonicalCategory = canonicalCategoryName(categoryInfo.category) || categoryInfo.category;
          const sourceType = parseSourcing(mappedValue(row, headerMap, "sourceType") ?? mappedValue(row, headerMap, "sourcing"), row, i);
          const sourcingOwnerRaw = cleanTextField(mappedValue(row, headerMap, "sourcingOwner") ?? mappedValue(row, headerMap, "sourcingResponsibility"), true);
          const sourcingOwner = canonicalPersonName(sourcingOwnerRaw) || sourcingOwnerRaw;
          const personField = key => { const v = cleanTextField(mappedValue(row, headerMap, key), true); return canonicalPersonName(v) || v; };
          const base = {
            id: contractNumber || ("UP-" + (1000 + i)),
            contractNumber,
            contractId: contractNumber,
            supplierName,
            vendor: supplierName,
            contractName,
            contractDescription,
            contractSubType: cleanTextField(mappedValue(row, headerMap, "contractSubType"), true),
            expiryDate: expiry.date,
            expiryDateRaw: expiry.raw,
            noticeDeadlineDate: noticeDeadline.date,
            noticeDeadlineRaw: noticeDeadline.raw,
            noticeDaysOut: Number.isFinite(noticeDeadline.days) ? noticeDeadline.days : null,
            daysOut: Number.isFinite(expiry.days) ? expiry.days : null,
            expires: expiry.date,
            status: statusFromDays(expiry.days),
            requestArea: cleanTextField(mappedValue(row, headerMap, "requestArea"), true),
            responsibleDirector: personField("responsibleDirector"),
            contractSponsor: personField("contractSponsor"),
            entityDescription: cleanTextField(mappedValue(row, headerMap, "entityDescription"), true),
            contractType: cleanTextField(mappedValue(row, headerMap, "contractType"), true),
            categoryLevel1: cleanTextField(mappedValue(row, headerMap, "categoryLevel1"), true),
            categoryLevel2: cleanTextField(mappedValue(row, headerMap, "categoryLevel2"), true),
            rawCategory: categoryInfo.rawCategory,
            category: canonicalCategory,
            normalizedCategory: canonicalCategory,
            categoryConfidence: categoryInfo.categoryConfidence,
            categorySource: categoryInfo.categorySource,
            categoryReviewFlag: categoryInfo.categoryReviewFlag,
            categories: [...new Set([canonicalCategory, categoryInfo.rawCategory].filter(Boolean))],
            contractAdministrator: personField("contractAdministrator"),
            executionDate: execution.date,
            executionDateRaw: execution.raw,
            executionQuarter: cleanTextField(mappedValue(row, headerMap, "executionQuarter"), true),
            executionBusinessDays: cleanTextField(mappedValue(row, headerMap, "executionBusinessDays"), true),
            renewalType: cleanTextField(mappedValue(row, headerMap, "renewalType"), true),
            totalContractValue: annualSpend,
            totalContractValueRaw: cleanCell(tcvRaw),
            annualSpend,
            hasTcv,
            tcvStatus: hasTcv ? "TCV on file" : (Number.isFinite(parsedTcv) && parsedTcv < 0 ? "Negative TCV recorded" : Number.isFinite(parsedTcv) && parsedTcv === 0 ? "$0 recorded" : "No TCV on file"),
            disposition: cleanTextField(mappedValue(row, headerMap, "disposition"), true),
            dispositionNotes: cleanTextField(mappedValue(row, headerMap, "dispositionNotes"), true),
            sourcingResponsibility: sourcingOwner,
            sourcingResponsibilityRaw: sourcingOwnerRaw,
            sourcingOwner,
            sourceType,
            sourcingProfile: sourceType === "Unknown" ? "Not Provided" : sourceType,
            sourcing: sourceType,
            responsibleVP: personField("responsibleVP"),
            authorizedSignatory: cleanTextField(mappedValue(row, headerMap, "authorizedSignatory"), true),
            sourceRiskRaw: cleanTextField(mappedValue(row, headerMap, "risk"), true),
            duplicateGroupKey: compactText([contractNumber, supplierName, contractName].join("|")),
            originalSheetName: row.__sheetName || workbookAudit?.selectedSheet || "CSV",
            originalRowNumber: row.__rowNumber || (i + 2),
            sourceSheetName: row.__sheetName || workbookAudit?.selectedSheet || "CSV",
            sourceRowNumber: row.__rowNumber || (i + 2),
            tail: hasTcv && annualSpend < 250000
          };
          const ownerPresent = [base.sourcingOwner, base.contractSponsor, base.responsibleDirector, base.contractAdministrator, base.authorizedSignatory].some(hasText);
          base.fieldConfidence = {
            supplierName: supplierName ? fieldMapScore(headerMap, ["supplierName", "vendor"]) : 0,
            contractName: contractName ? fieldMapScore(headerMap, ["contractName", "contractDescription"]) : 0,
            contractNumber: contractNumber ? fieldMapScore(headerMap, ["contractNumber"]) : 0,
            expiryDate: expiry.date ? fieldMapScore(headerMap, ["expiryDate", "timeline"]) : 0,
            totalContractValue: Number.isFinite(parsedTcv) ? fieldMapScore(headerMap, ["totalContractValue", "spend", "annualValue"]) : 0,
            category: Number(categoryInfo.categoryConfidence) || 0,
            owner: ownerPresent ? fieldMapScore(headerMap, ["sourcingOwner", "sourcingResponsibility", "contractSponsor", "responsibleDirector", "contractAdministrator", "authorizedSignatory"]) : 0,
            risk: base.sourceRiskRaw ? fieldMapScore(headerMap, ["risk"]) : .62
          };
          base.dataQualityFlags = dataQualityFlagsFor(base);
          base.riskScore = base.sourceRiskRaw ? parseRisk(base.sourceRiskRaw, annualSpend, base.daysOut, base.sourceType) : priorityScore(base);
          base.riskScoreSource = base.sourceRiskRaw ? "Workbook risk field" : "Local priority classification";
          base.riskLevel = base.riskScore >= 70 ? "High" : base.riskScore >= 45 ? "Medium" : "Low";
          return base;
        });
        const deduped = dedupeImportedRows(mapped);
        const finalRows = deduped.rows;
        flagDuplicateContractNumbers(finalRows);

        if (finalRows.length) {
          state.data = finalRows;
          state.uploadName = name;
          state.selectedCat = null;
          state.selectedCatSource = null;
          state.tableCategoryFilter = null;
          state.selectedRisk = null;
          state.selectedTrend = null;
          state.selectedSourcing = null;
          state.selectedMatrix = null;
          state.tablePage = 1;
          state.query = "";
          resetLocalIntelligenceSession();
          state.drawerOpen = false;
          state.menuOpen = false;
          state.welcomeOpen = false;
          state.drag = false;
          const importantFields = ["contractNumber", "vendor", "contractName", "expiryDate", "totalContractValue", "disposition", "sourcingResponsibility", "responsibleVP", "authorizedSignatory"];
          const assignedOwnerRows = finalRows.filter(c => hasText(c.sourcingOwner));
          const rawOwnerVariants = new Set(assignedOwnerRows.map(c => normalizeText(c.sourcingResponsibilityRaw || c.sourcingOwner)).filter(Boolean)).size;
          const canonOwnerCount = new Set(assignedOwnerRows.map(c => ownerKey(c.sourcingOwner)).filter(Boolean)).size;
          const ownerVariantsMerged = Math.max(0, rawOwnerVariants - canonOwnerCount);
          const categoryReviewRows = finalRows.filter(c => c.categorySource === "needs-review" || c.categoryReviewFlag).length;
          const warnings = [
            headerMap.fields.sourcingResponsibility ? "Sourcing Responsibility detected as owner field, not source type" : null,
            ownerVariantsMerged ? "Normalized owner names (case, “Last, First” order, titles) and merged " + ownerVariantsMerged + " duplicate owner variant" + (ownerVariantsMerged === 1 ? "" : "s") + " for accurate workload" : (canonOwnerCount ? "Owner names normalized for consistent workload grouping" : null),
            headerMap.fields.totalContractValue || headerMap.fields.spend ? "TCV mapped as spend/value; currency symbols, K/M/B and accounting negatives parsed" : null,
            allowDayBucket ? "Detected numeric day-countdown values in the date column and converted them to calendar dates" : null,
            dateOrder === "DMY" ? "Detected international day/month/year date order and parsed dates accordingly" : null,
            categoryReviewRows ? categoryReviewRows + " categor" + (categoryReviewRows === 1 ? "y was" : "ies were") + " auto-classified with low confidence and flagged for review" : "Categories mapped to canonical healthcare taxonomy",
            "Blank expiry dates were not replaced with fake dates"
          ].filter(Boolean);
          state.readerAudit = {
            selectedSheet: workbookAudit?.selectedSheet || finalRows[0].originalSheetName || "CSV upload",
            headerRow: workbookAudit?.headerRow || null,
            confidence: workbookAudit?.confidence || Object.keys(headerMap.fields).length,
            detectedSheets: workbookAudit?.detectedSheets || [],
            ignoredSheets: workbookAudit?.ignoredSheets || [],
            rowsRead: allRows.length,
            rows: allRows.length,
            contractsImported: finalRows.length,
            rowsSkipped: Math.max(0, allRows.length - finalRows.length),
            summaryRowsIgnored,
            duplicateRowsFound: deduped.duplicateRowsFound,
            duplicateContractsDeduped: deduped.duplicateContractsDeduped,
            missingExpiryCount: finalRows.filter(c => !contractDate(c)).length,
            zeroMissingTcvCount: finalRows.filter(c => !c.hasTcv).length,
            autoRenewCount: finalRows.filter(isAutoRenewContract).length,
            terminateCount: finalRows.filter(isTerminateContract).length,
            marketCheckCount: finalRows.filter(isMarketCheckContract).length,
            categoryReviewCount: finalRows.filter(c => c.categorySource === "needs-review" || c.categoryReviewFlag).length,
            missingOwnerCount: finalRows.filter(c => !hasText(c.sourcingOwner) && !hasText(c.contractSponsor) && !hasText(c.responsibleDirector) && !hasText(c.contractAdministrator)).length,
            mappedFields: Object.entries(headerMap.fields).map(([field, key]) => field + " <- " + key + " (" + (headerMap.scores[field] || 0) + ")"),
            unmappedImportantFields: importantFields.filter(field => !headerMap.fields[field]),
            unmappedFields,
            warnings
          };
          state.importConfidence = buildImportConfidence(finalRows, headerMap, state.readerAudit, {
            duplicateRowsFound: deduped.duplicateRowsFound,
            unmappedFields
          });
          state.readerAudit.importConfidence = state.importConfidence;
          state.page = "dashboard";
          if (!quiet) {
            pushToast("Dataset loaded", finalRows.length + " contracts imported from " + state.readerAudit.selectedSheet + ".");
            withSkeleton();
          }
          return { imported: finalRows.length, sheet: state.readerAudit.selectedSheet };
        } else {
          if (quiet) throw new Error("No contract rows could be read from that file.");
          pushToast("No rows found", "No contract rows could be read from that file.");
        }
      }

      function readUInt16(view, offset) {
        return view.getUint16(offset, true);
      }

      function readUInt32(view, offset) {
        return view.getUint32(offset, true);
      }

      async function inflateRaw(data) {
        if (!("DecompressionStream" in window)) throw new Error("This browser cannot decompress XLSX files locally.");
        try {
          const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
          return await new Response(stream).arrayBuffer();
        } catch {
          const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate"));
          return await new Response(stream).arrayBuffer();
        }
      }

      async function unzipXLSX(buffer) {
        const view = new DataView(buffer);
        const decoder = new TextDecoder();
        let eocd = -1;
        for (let i = view.byteLength - 22; i >= Math.max(0, view.byteLength - 66000); i -= 1) {
          if (readUInt32(view, i) === 0x06054b50) {
            eocd = i;
            break;
          }
        }
        if (eocd < 0) throw new Error("Workbook archive footer was not found.");
        const entries = readUInt16(view, eocd + 10);
        let ptr = readUInt32(view, eocd + 16);
        const files = {};
        for (let i = 0; i < entries; i += 1) {
          if (readUInt32(view, ptr) !== 0x02014b50) break;
          const method = readUInt16(view, ptr + 10);
          const compressedSize = readUInt32(view, ptr + 20);
          const nameLength = readUInt16(view, ptr + 28);
          const extraLength = readUInt16(view, ptr + 30);
          const commentLength = readUInt16(view, ptr + 32);
          const localOffset = readUInt32(view, ptr + 42);
          const name = decoder.decode(buffer.slice(ptr + 46, ptr + 46 + nameLength));
          const localNameLength = readUInt16(view, localOffset + 26);
          const localExtraLength = readUInt16(view, localOffset + 28);
          const dataStart = localOffset + 30 + localNameLength + localExtraLength;
          const compressed = buffer.slice(dataStart, dataStart + compressedSize);
          let data;
          if (method === 0) data = compressed;
          else if (method === 8) data = await inflateRaw(compressed);
          else data = null;
          if (data) files[name] = decoder.decode(data);
          ptr += 46 + nameLength + extraLength + commentLength;
        }
        return files;
      }

      function xmlDoc(text) {
        return new DOMParser().parseFromString(text || "", "application/xml");
      }

      function nodesByName(root, name) {
        return [...root.getElementsByTagName("*")].filter(node => node.localName === name);
      }

      function cellColumnIndex(ref) {
        const letters = String(ref || "").replace(/[^A-Z]/gi, "").toUpperCase();
        return [...letters].reduce((sum, ch) => sum * 26 + ch.charCodeAt(0) - 64, 0) - 1;
      }

      function headerRowStrength(cells) {
        const headers = cells.map(c => cleanCell(c)).filter(Boolean);
        if (!headers.length) return 0;
        const important = ["Contract Number", "Contract ID", "Agreement ID", "Supplier Name", "Vendor Legal Name", "Counterparty", "Contract Name", "Agreement Title", "Expiry Date", "Expiration", "Term End", "Renewal Date", "TCV", "Total Contract Value", "Annual Spend", "Committed Spend", "Category", "Commodity", "UNSPSC", "Disposition", "Recommended Action", "Sourcing Responsibility", "Contract Owner", "Source Type"];
        return important.reduce((sum, alias) => sum + (headers.some(h => headerScore(h, [alias]) >= .84) ? 1 : 0), 0);
      }

      function duplicateHeaderLike(cells, headers, headerStrength) {
        if (headerStrength < 4) return false;
        const matches = cells.reduce((sum, cell, i) => sum + (cleanCell(cell) && cleanCell(cell) === cleanCell(headers[i]) ? 1 : 0), 0);
        return matches >= Math.max(4, Math.floor(headers.filter(Boolean).length * .45));
      }

      function parseSheetXML(sheetXML, sharedStrings, sheetName = "Sheet") {
        const doc = xmlDoc(sheetXML);
        const rowRecords = nodesByName(doc, "row").map(rowNode => {
          const cells = [];
          nodesByName(rowNode, "c").forEach(cell => {
            const col = Math.max(0, cellColumnIndex(cell.getAttribute("r")));
            const type = cell.getAttribute("t");
            let value = "";
            if (type === "s") {
              value = sharedStrings[Number(nodesByName(cell, "v")[0]?.textContent || 0)] || "";
            } else if (type === "inlineStr") {
              value = nodesByName(cell, "t").map(t => t.textContent || "").join("");
            } else {
              value = nodesByName(cell, "v")[0]?.textContent || "";
            }
            cells[col] = value;
          });
          return { rowNumber: Number(rowNode.getAttribute("r")) || 0, cells };
        }).filter(record => record.cells.some(v => cleanCell(v)));
        if (!rowRecords.length) return [];
        let headerIndex = 0;
        let bestStrength = -1;
        rowRecords.slice(0, 30).forEach((record, i) => {
          const strength = headerRowStrength(record.cells);
          if (strength > bestStrength) {
            bestStrength = strength;
            headerIndex = i;
          }
        });
        if (bestStrength < 2) return [];
        const headers = rowRecords[headerIndex].cells.map((h, i) => cleanCell(h) || ("Column " + (i + 1)));
        const rows = rowRecords.slice(headerIndex + 1).map(record => {
          if (duplicateHeaderLike(record.cells, headers, bestStrength)) return null;
          const obj = {};
          record.cells.forEach((value, i) => { obj[headers[i] || ("Column " + (i + 1))] = value ?? ""; });
          obj.__sheetName = sheetName;
          obj.__rowNumber = record.rowNumber;
          return obj;
        }).filter(Boolean);
        rows.__headerRow = rowRecords[headerIndex].rowNumber;
        rows.__headerStrength = bestStrength;
        return rows;
      }

      function workbookSheetList(files) {
        const workbookDoc = xmlDoc(files["xl/workbook.xml"] || "");
        const relDoc = xmlDoc(files["xl/_rels/workbook.xml.rels"] || "");
        const rels = {};
        nodesByName(relDoc, "Relationship").forEach(rel => {
          rels[rel.getAttribute("Id")] = rel.getAttribute("Target");
        });
        return nodesByName(workbookDoc, "sheet").map((sheet, index) => {
          const relId = sheet.getAttribute("r:id") || sheet.getAttribute("id");
          let target = rels[relId] || ("worksheets/sheet" + (index + 1) + ".xml");
          target = target.replace(/^\/+/, "");
          if (!target.startsWith("xl/")) target = "xl/" + target;
          return { name: sheet.getAttribute("name") || ("Sheet" + (index + 1)), path: target };
        });
      }

      function contractSheetScore(rows, name) {
        if (!rows.length) return 0;
        const headerMap = buildHeaderMap(rows);
        const validRows = rows.filter(row => cleanTextField(mappedValue(row, headerMap, "contractNumber"), true) || cleanTextField(mappedValue(row, headerMap, "vendor"), true) || cleanTextField(mappedValue(row, headerMap, "contractName"), true)).length;
        const fieldHits = ["contractNumber", "vendor", "contractName", "expiryDate", "totalContractValue", "disposition", "sourcingResponsibility"].filter(field => headerMap.fields[field]).length;
        const preferred = normalizeText(name) === "expiring contract list" ? 10000 : 0;
        const sheetText = normalizeText(name);
        const crosswalkPenalty = rows.length < 50 && fieldHits < 6 ? 200 : 0;
        const namePenalty = /(crosswalk|lookup|instruction|read me|readme|mapping|values|definitions|pivot|summary)/.test(sheetText) ? 500 : 0;
        return preferred + fieldHits * 250 + validRows - crosswalkPenalty - namePenalty;
      }

      async function parseXLSX(buffer) {
        const files = await unzipXLSX(buffer);
        const sharedDoc = xmlDoc(files["xl/sharedStrings.xml"] || "");
        const sharedStrings = nodesByName(sharedDoc, "si").map(si => nodesByName(si, "t").map(t => t.textContent || "").join(""));
        const sheets = workbookSheetList(files);
        const candidates = sheets.map(sheet => {
          const rows = files[sheet.path] ? parseSheetXML(files[sheet.path], sharedStrings, sheet.name) : [];
          const headerMap = rows.length ? buildHeaderMap(rows) : { fields: {}, scores: {} };
          return {
            name: sheet.name,
            path: sheet.path,
            rows,
            score: contractSheetScore(rows, sheet.name),
            rowCount: rows.length,
            headerRow: rows.__headerRow || null,
            headerStrength: rows.__headerStrength || 0,
            mappedFields: Object.keys(headerMap.fields)
          };
        });
        const selected = candidates.find(c => normalizeText(c.name) === "expiring contract list" && c.rows.length) || candidates.slice().sort((a, b) => b.score - a.score)[0];
        if (!selected || !selected.rows.length) throw new Error("No worksheet XML found.");
        selected.rows.__workbookAudit = {
          selectedSheet: selected.name,
          headerRow: selected.headerRow,
          confidence: selected.headerStrength,
          detectedSheets: candidates.map(c => ({ name: c.name, rows: c.rowCount, score: c.score, headerRow: c.headerRow, mappedFields: c.mappedFields })),
          ignoredSheets: candidates.filter(c => c.name !== selected.name).map(c => c.name)
        };
        return selected.rows;
      }

      function readFileAsText(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = e => resolve(String(e.target.result || ""));
          reader.onerror = () => reject(new Error("The browser could not read that file."));
          reader.readAsText(file);
        });
      }

      function readFileAsArrayBuffer(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = e => resolve(e.target.result);
          reader.onerror = () => reject(new Error("The browser could not read that workbook."));
          reader.readAsArrayBuffer(file);
        });
      }

      function handleFile(file) {
        if (!file) return;
        const ext = file.name.split(".").pop().toLowerCase();
        if (ext === "csv" || ext === "txt") return runContractImport(async () => ingestRows(parseCSV(await readFileAsText(file)), file.name, { quiet: true }));
        if (ext === "xlsx") return runContractImport(async () => {
          try {
            return ingestRows(await parseXLSX(await readFileAsArrayBuffer(file)), file.name, { quiet: true });
          } catch (err) {
            throw new Error("This browser could not parse the workbook locally. Save it as CSV and try again.");
          }
        });
        pushToast("Unsupported file", "Use CSV, TXT, or XLSX so the local reader can process it in-browser.");
        state.drag = false;
        render();
      }

      document.addEventListener("click", e => {
        const target = e.target;
        let changed = false;
        if (state.suggestOpen && !(target && (target.closest(".nx-suggest") || target.closest(".nx-suggest-pop") || target.closest(".nx-chat-toolbar")))) {
          state.suggestOpen = false;
          changed = true;
        }
        if ((state.searchSuggestOpen || state.timelineSuggestOpen) && !(target && target.closest(".nx-searchwrap"))) {
          state.searchSuggestOpen = false;
          state.timelineSuggestOpen = false;
          state.registerSearchOpen = false;
          state.timelineSearchOpen = false;
          state.activeSearchBox = null;
          changed = true;
        }
        if (changed) preserveWindowScroll(() => render({ skipLayerFocus: true }));
      });

      document.addEventListener("keydown", e => {
        if (e.key === "Escape") {
          if (state.suggestOpen) { state.suggestOpen = false; preserveWindowScroll(() => render({ skipLayerFocus: true })); }
          else if (state.searchSuggestOpen || state.timelineSuggestOpen) {
            state.searchSuggestOpen = false;
            state.timelineSuggestOpen = false;
            state.registerSearchOpen = false;
            state.timelineSearchOpen = false;
            state.activeSearchBox = null;
            preserveWindowScroll(() => render({ skipLayerFocus: true }));
          }
          else if (state.activeModal) { closeModal(); }
          else if (state.notifOpen) { state.notifOpen = false; render(); }
          else if (app.querySelector("[data-welcome-card]")) { state.welcomeOpen = false; render(); }
          else if (state.drawerOpen) { state.drawerOpen = false; render(); }
          return;
        }
        if (e.key === "Tab") {
          const layer = topLayer();
          if (!layer) return;
          const focusable = [...layer.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
            .filter(el => !el.disabled && el.offsetParent !== null);
          if (!focusable.length) return;
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (!layer.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
          else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      });

      render();
    })();
  </script>
</body>
</html>
