<head>

  <title>Corewell Tail Spend Intelligence - Supplier Spend Command</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Cdefs%3E%3Cmask%20id%3D%27c%27%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2748%27%20fill%3D%27%23fff%27%2F%3E%3Ccircle%20cx%3D%2757.07%27%20cy%3D%2742.93%27%20r%3D%2740%27%2F%3E%3C%2Fmask%3E%3Cmask%20id%3D%27g%27%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2750%27%20r%3D%2748%27%20fill%3D%27%23fff%27%2F%3E%3Ccircle%20cx%3D%2742.93%27%20cy%3D%2757.07%27%20r%3D%2740%27%2F%3E%3C%2Fmask%3E%3C%2Fdefs%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20rx%3D%2722%27%20fill%3D%27%23002855%27%2F%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20fill%3D%27%2357d869%27%20mask%3D%27url%28%23g%29%27%2F%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20fill%3D%27%231ab4e8%27%20mask%3D%27url%28%23c%29%27%2F%3E%3C%2Fsvg%3E">
  <script>(function(){try{var t=localStorage.getItem("corewell_ts_theme")||((window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);document.documentElement.style.colorScheme=t;}catch(e){}})();</script>
  <style>
    :root {
      color-scheme: light;
      --bg-grad:
        radial-gradient(circle at top left, rgba(0, 167, 200, .18), transparent 32rem),
        linear-gradient(140deg, #eef4f9, #f8fbff 58%, #eaf4f8);
      --panel: linear-gradient(180deg, rgba(255, 255, 255, .96), rgba(255, 255, 255, .9));
      --panel-solid: #ffffff;
      --ink: #0b1b2e;
      --ink-soft: #516175;
      --line: rgba(148, 163, 184, .28);
      --shadow: 0 10px 28px rgba(15, 23, 42, .08);
      --shadow-lg: 0 28px 80px rgba(0, 41, 85, .14);
      --topbar: rgba(248, 251, 255, .82);
      --chip: #eef4f9;
      --kpi-ghost: rgba(0, 41, 85, .05);
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: var(--bg-grad);
      background-attachment: fixed;
    }

    button, input, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .nx.dark {
      color-scheme: dark;
      --bg-grad:
        radial-gradient(circle at top left, rgba(0, 167, 200, .12), transparent 32rem),
        linear-gradient(140deg, #071120, #0c1728 62%, #071120);
      --panel: linear-gradient(180deg, #111c2d, #0b1524);
      --panel-solid: #101b2c;
      --ink: #e8f0fa;
      --ink-soft: #90a2ba;
      --line: rgba(124, 148, 180, .22);
      --shadow: 0 10px 28px rgba(0, 0, 0, .4);
      --shadow-lg: 0 28px 80px rgba(0, 0, 0, .55);
      --topbar: rgba(10, 20, 36, .78);
      --chip: #16263c;
      --kpi-ghost: rgba(255, 255, 255, .04);
    }

    .nx {
      min-height: 100vh;
      background: var(--bg-grad);
      background-attachment: fixed;
      color: var(--ink);
    }

    .nx ::-webkit-scrollbar { width: 10px; height: 10px; }
    .nx ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 9px; }
    .nx-shell { min-height: 100vh; }

    .nx-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 0 0 auto;
      margin-left: 4px;
      padding-right: 8px;
      border-right: 1px solid var(--line);
    }

    .nx-logo {
      width: 42px;
      height: 42px;
      background: transparent;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .nx-logo svg { width: 100%; height: 100%; display: block; }

    .nx-brand h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
      margin: 0;
      line-height: 1.1;
    }

    .nx-brand span {
      font-size: 10.5px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--ink-soft);
      font-weight: 700;
    }

    .nx-nav {
      align-items: center;
      display: flex;
      gap: 10px;
      min-width: 0;
      margin-right: auto;
    }

    .nx-tabbar {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 46px;
      padding: 4px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .88), rgba(255, 255, 255, .72)),
        var(--panel-solid);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .nx.dark .nx-tabbar {
      background:
        linear-gradient(180deg, rgba(16, 27, 44, .9), rgba(16, 27, 44, .72)),
        var(--panel-solid);
    }

    .nx-tab {
      position: relative;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      overflow: hidden;
      white-space: nowrap;
      isolation: isolate;
      transition:
        color .22s cubic-bezier(.4, 0, .2, 1),
        background .22s cubic-bezier(.4, 0, .2, 1),
        transform .22s cubic-bezier(.4, 0, .2, 1),
        box-shadow .22s cubic-bezier(.4, 0, .2, 1);
    }

    .nx-tab::before {
      content: "";
      position: absolute;
      inset: auto 16px 4px;
      height: 2px;
      border-radius: 999px;
      background: #67F48C;
      transform: scaleX(0);
      transform-origin: center;
      transition: transform .24s cubic-bezier(.4, 0, .2, 1);
      z-index: -1;
    }

    .nx-tab::after {
      content: "";
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(103, 244, 140, .24);
      opacity: 0;
      transform: scale(.2);
      transition: opacity .24s cubic-bezier(.4, 0, .2, 1), transform .24s cubic-bezier(.4, 0, .2, 1);
      z-index: -1;
    }

    .nx-tab:hover {
      color: var(--ink);
      background: rgba(0, 167, 200, .08);
      transform: translateY(-1px);
    }

    .nx-tab:hover::after {
      opacity: 1;
      transform: scale(2.7);
    }

    .nx-tab.active {
      color: #002955;
      background: linear-gradient(135deg, rgba(103, 244, 140, .34), rgba(0, 167, 200, .16));
      box-shadow: inset 0 0 0 1px rgba(103, 244, 140, .35), 0 10px 22px rgba(0, 41, 85, .08);
    }

    .nx.dark .nx-tab.active {
      color: #e8f0fa;
      background: linear-gradient(135deg, rgba(103, 244, 140, .2), rgba(0, 167, 200, .18));
    }

    .nx-tab.active::before {
      transform: scaleX(1);
    }

    .nx-tab:active {
      transform: scale(.98);
    }

    .nx-main { min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }

    .nx-top {
      position: sticky;
      top: 0;
      z-index: 50;
      min-height: 78px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 26px;
      background: var(--topbar);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }

    .nx-top-left {
      display: flex;
      align-items: center;
      gap: 18px;
      flex: 1;
      min-width: 0;
    }

    .nx-page-copy {
      min-width: 210px;
    }

    .nx-top h2 { font-size: 19px; font-weight: 800; letter-spacing: 0; margin: 0; line-height: 1.1; }
    .nx-top p { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-soft); }

    .nx-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 0 13px;
      border-radius: 999px;
      background: var(--panel-solid);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
    }

    .nx-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #37d399; box-shadow: 0 0 8px #37d399; }

    .nx-icbtn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel-solid);
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--ink);
      position: relative;
      transition: all .18s;
      flex: 0 0 auto;
    }

    .nx-icbtn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }

    .nx-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      border-radius: 9px;
      background: #e11d48;
      color: #fff;
      font-size: 10.5px;
      font-weight: 800;
      display: grid;
      place-items: center;
      box-shadow: 0 2px 6px rgba(225, 29, 72, .5);
    }

    .nx-body { padding: 24px 26px 60px; display: flex; flex-direction: column; gap: 22px; }

    .nx-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 18px;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .nx-card.hoverable:hover { transform: translateY(-2px); box-shadow: 0 18px 40px rgba(15, 23, 42, .13); }
    .nx-cardhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
    .nx-cardhead h3 { margin: 0; font-size: 14.5px; font-weight: 800; letter-spacing: 0; }
    .nx-cardhead .sub { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; }

    .nx-label {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .13em;
      font-weight: 800;
      color: var(--ink-soft);
    }

    .nx-hero {
      position: relative;
      overflow: hidden;
      border-radius: 36px;
      padding: 30px 32px;
      color: #fff;
      background:
        radial-gradient(circle at 12% 8%, rgba(103, 244, 140, .28), transparent 40%),
        radial-gradient(circle at 88% 0%, rgba(0, 167, 200, .34), transparent 44%),
        radial-gradient(circle at 80% 120%, rgba(11, 87, 151, .5), transparent 55%),
        linear-gradient(135deg, #002955, #063b73 60%, #031c39);
      box-shadow: var(--shadow-lg);
      display: flex;
      gap: 24px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .nx-hero h2 {
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 850;
      letter-spacing: 0;
      margin: 0 0 8px;
      line-height: 1.08;
      max-width: 560px;
    }

    .nx-hero p { margin: 0; color: rgba(255, 255, 255, .72); font-size: 14px; max-width: 560px; line-height: 1.55; }

    .nx-hero .eyebrow {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .18em;
      font-weight: 800;
      color: #67F48C;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nx-herocard {
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 22px;
      padding: 18px;
      min-width: 230px;
      backdrop-filter: blur(8px);
    }

    .nx-herocard .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 7px 0; }
    .nx-herocard .row + .row { border-top: 1px solid rgba(255, 255, 255, .1); }
    .nx-herocard b { font-weight: 800; font-size: 15px; }
    .nx-herocard small { color: rgba(255, 255, 255, .6); font-size: 11.5px; font-weight: 600; }
    .nx-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .nx-kpi { position: relative; overflow: hidden; min-height: 128px; }

    .nx-kpi .glow {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      right: -30px;
      top: -40px;
      background: radial-gradient(circle, var(--g, #67F48C) 0%, transparent 70%);
      opacity: .16;
    }

    .nx-kpi .val { font-size: 30px; font-weight: 850; letter-spacing: 0; margin: 6px 0 2px; line-height: 1; }
    .nx-kpi .help { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; display: flex; align-items: center; gap: 5px; }
    .nx-grid2 { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(280px, 1fr); gap: 18px; }
    .nx-grid2b { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(0, 1.4fr); gap: 18px; }

    .nx-pillbadge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .nx-table-wrap { border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
    .nx-table { width: 100%; border-collapse: collapse; font-size: 13px; }

    .nx-table thead th {
      position: sticky;
      top: 0;
      background: var(--chip);
      text-align: left;
      padding: 11px 14px;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .1em;
      font-weight: 800;
      color: var(--ink-soft);
      white-space: nowrap;
    }

    .nx-table tbody td { padding: 12px 14px; border-top: 1px solid var(--line); white-space: nowrap; }
    .nx-table tbody tr { transition: background .15s, transform .15s; }
    .nx-table tbody tr:hover { background: var(--kpi-ghost); }
    .nx-table tbody tr[data-contract-id] { cursor: pointer; }
    .nx-table tbody tr[data-contract-id]:hover { transform: translateX(2px); }
    .nx-vend { font-weight: 750; }
    .nx-id { font-size: 11px; color: var(--ink-soft); font-weight: 600; }
    .nx-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    .nx-pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 14px;
      flex-wrap: wrap;
    }

    .nx-page-meta {
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 700;
    }

    .nx-pager-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nx-pager .nx-btn[disabled] {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    .nx-input, .nx-select {
      height: 42px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--panel-solid);
      color: var(--ink);
      padding: 0 14px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      transition: box-shadow .18s, border-color .18s;
    }

    .nx-input:focus, .nx-select:focus { border-color: #00a7c8; box-shadow: 0 0 0 4px rgba(0, 167, 200, .24); }
    .nx-input { padding-left: 38px; }
    .nx-search { position: relative; flex: 1; min-width: 200px; }
    .nx-search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); }

    .nx-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 14px;
      min-height: 42px;
      padding: 0 18px;
      font-weight: 800;
      font-size: 13.5px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all .18s;
      white-space: nowrap;
      text-decoration: none;
    }

    .nx-btn:hover { transform: translateY(-1px); }
    .nx-btn.primary { background: linear-gradient(135deg, #002955, #0b5797); color: #fff; box-shadow: 0 14px 28px rgba(0, 41, 85, .22); }
    .nx-btn.ghost { background: transparent; border-color: var(--line); color: var(--ink-soft); }
    .nx-btn.ghost:hover { color: var(--ink); }

    .nx-smart {
      position: relative;
      overflow: hidden;
      border-radius: 999px;
      background: linear-gradient(135deg, #002955, #00a7c8 90%);
      color: #fff;
      box-shadow: 0 14px 30px rgba(0, 167, 200, .32);
    }

    .nx-smart:hover {
      transform: scale(1.02);
      background: linear-gradient(135deg, #063b73, #008aaa 92%);
      box-shadow: 0 16px 34px rgba(0, 167, 200, .38);
    }

    .nx-chartbox { min-height: 248px; margin-top: 8px; }
    .nx-svgchart { width: 100%; height: 248px; display: block; overflow: visible; }
    .nx-axis { fill: var(--ink-soft); font-size: 11px; font-weight: 650; pointer-events: none; }
    .nx-gridline { stroke: var(--line); stroke-dasharray: 3 3; }
    .nx-chart-node { transition: opacity .18s ease, filter .18s ease, stroke-width .18s ease, transform .18s ease; transform-box: fill-box; transform-origin: center; }
    .nx-chart-node:hover { filter: drop-shadow(0 8px 12px rgba(0, 41, 85, .24)); transform: scale(1.015); }
    .nx-chart-node.active { filter: drop-shadow(0 10px 16px rgba(0, 41, 85, .34)); stroke: #fff; stroke-width: 3; opacity: 1 !important; }
    /* Bar chart: whole column is the click/hover target via a transparent hit rect */
    .nx-barslot { cursor: pointer; }
    .nx-bar-hit { cursor: pointer; }
    .nx-bar-fill { transform-box: fill-box; transform-origin: center bottom; transition: filter .18s ease; }
    .nx-barslot:hover .nx-bar-fill { filter: brightness(1.09) drop-shadow(0 8px 14px rgba(0, 41, 85, .30)); }
    .nx-barval { fill: var(--ink); font-size: 11.5px; font-weight: 850; opacity: 0; transition: opacity .16s ease; pointer-events: none; }
    .nx-barslot:hover .nx-barval { opacity: 1; }
    @keyframes barGrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    .nx-chart-empty { min-height: 248px; display: grid; place-items: center; color: var(--ink-soft); font-size: 13px; font-weight: 650; }
    .nx-chart-tip {
      position: fixed;
      z-index: 120;
      max-width: min(280px, calc(100vw - 28px));
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, .38);
      background: rgba(255, 255, 255, .74);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 16px 38px rgba(15, 23, 42, .2);
      color: #0b1b2e;
      pointer-events: none;
      opacity: 0;
      transform: translate3d(0, 8px, 0);
      transition: opacity .14s ease, transform .14s ease;
    }

    .nx.dark .nx-chart-tip {
      background: rgba(16, 27, 44, .76);
      border-color: rgba(124, 148, 180, .34);
      color: #e8f0fa;
      box-shadow: 0 18px 44px rgba(0, 0, 0, .46);
    }

    .nx-chart-tip.open { opacity: 1; transform: translate3d(0, 0, 0); }
    .nx-chart-tip .k { font-size: 10px; text-transform: uppercase; letter-spacing: .13em; color: var(--ink-soft); font-weight: 850; margin-bottom: 5px; }
    .nx-chart-tip .v { font-size: 13px; line-height: 1.45; font-weight: 750; overflow-wrap: anywhere; }

    .nx-view {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .nx-view.enter {
      animation: viewIn .26s cubic-bezier(.2, .8, .2, 1);
    }

    .nx-skel {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .nx-skel .sk-line { border-radius: 10px; }
    .nx-skel .nx-kpi { min-height: 128px; display: flex; flex-direction: column; gap: 12px; }

    @keyframes viewIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Staggered dashboard entrance animations — only when a view is freshly entered.
       Uses fill-mode backwards so post-animation transforms clear and :hover lifts still work.
       The global prefers-reduced-motion rule already disables all of these. */
    .nx-view.enter .nx-bar-fill { animation: barGrow .6s cubic-bezier(.2, .85, .25, 1) backwards; }
    .nx-view.enter .nx-donut-segs { transform-box: fill-box; transform-origin: center; animation: donutSpin .7s cubic-bezier(.2, .8, .2, 1) backwards; }
    .nx-view.enter .nx-kpi { animation: kpiIn .5s cubic-bezier(.2, .8, .2, 1) backwards; }
    .nx-view.enter .nx-kpis .nx-kpi:nth-child(1) { animation-delay: .02s; }
    .nx-view.enter .nx-kpis .nx-kpi:nth-child(2) { animation-delay: .07s; }
    .nx-view.enter .nx-kpis .nx-kpi:nth-child(3) { animation-delay: .12s; }
    .nx-view.enter .nx-kpis .nx-kpi:nth-child(4) { animation-delay: .17s; }
    .nx-view.enter .nx-kpis .nx-kpi:nth-child(5) { animation-delay: .22s; }
    .nx-view.enter .nx-kanban .nx-kcol { animation: kpiIn .5s cubic-bezier(.2, .8, .2, 1) backwards; }
    .nx-view.enter .nx-kanban .nx-kcol:nth-child(1) { animation-delay: .04s; }

      border: 1px solid rgba(0, 167, 200, .4);
      background: linear-gradient(135deg, rgba(103, 244, 140, .22), rgba(0, 167, 200, .14));

    }
    .nx-suggest-tab svg { color: #00a7c8; }
    .nx-suggest-tab:hover { transform: scale(1.03); border-color: #00a7c8; }
    .nx-suggest-pop {
      flex: 0 1 auto;
      z-index: 2;
      width: auto;
      max-width: none;
      margin: 0 14px 10px;
      max-height: 320px;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 11px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--panel-solid);
      box-shadow: var(--shadow-lg);

      opacity: 0;
      transform: translateY(-6px);
      animation: suggestFadeIn .18s cubic-bezier(.2, .8, .2, 1) forwards;

    @keyframes suggestFadeIn {

      to { opacity: 1; transform: translateY(0); }
    }
    .nx-suggest-pop .nx-label { padding: 0 2px 2px; }
    .nx-suggest-pop .nx-chip { width: 100%; border-radius: 10px; }

    .nx-notif-scrim { position: fixed; inset: 0; z-index: 109; background: transparent; }

    .nx-notif {
      position: fixed;
      top: 70px;
      right: 18px;
      z-index: 110;
      width: min(380px, calc(100vw - 24px));
      max-height: min(460px, 70vh);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel-solid);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      transform-origin: top right;
      animation: notifIn .18s cubic-bezier(.2, .8, .2, 1) both;
    }

    @keyframes notifIn {
      from { opacity: 0; transform: translateY(-8px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .nx-notif-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(0, 41, 85, .06), rgba(0, 167, 200, .06));
    }

    .nx-notif-head b { font-size: 13.5px; font-weight: 850; }
    .nx-notif-head .ct { font-size: 11px; font-weight: 800; background: var(--chip); padding: 3px 9px; border-radius: 999px; color: var(--ink-soft); }
    .nx-notif-list { overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }

    .nx-notif-item {
      display: flex;
      gap: 11px;
      align-items: flex-start;
      width: 100%;
      text-align: left;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      cursor: pointer;
      border-left: 4px solid var(--tone, #f59e0b);
      transition: transform .16s cubic-bezier(.4, 0, .2, 1), box-shadow .16s, background .16s;
    }

    .nx-notif-item:hover { transform: translateX(2px) scale(1.01); box-shadow: var(--shadow); background: var(--kpi-ghost); }
    .nx-notif-item .ni-ic { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--chip); color: var(--tone, #f59e0b); margin-top: 1px; }
    .nx-notif-item .ni-body { min-width: 0; flex: 1; }
    .nx-notif-item .ni-t { font-size: 12.5px; font-weight: 750; line-height: 1.35; overflow-wrap: anywhere; }
    .nx-notif-item .ni-d { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; margin-top: 3px; overflow-wrap: anywhere; }
    .nx-notif-empty { padding: 28px 16px; text-align: center; color: var(--ink-soft); font-size: 12.5px; font-weight: 650; line-height: 1.5; }

    .nx-sourcing { display: flex; flex-direction: column; gap: 14px; margin-top: 10px; }
    .nx-srow { cursor: pointer; border-radius: 14px; padding: 8px 10px; border: 1px solid transparent; transition: background .16s, border-color .16s, transform .16s; }
    .nx-srow:hover { background: var(--kpi-ghost); border-color: var(--line); transform: translateX(2px); }
    .nx-srow .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 7px; }
    .nx-srow .top .lab { font-size: 12.5px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .nx-srow .top .lab i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .nx-srow .top .val { font-size: 12.5px; font-weight: 750; color: var(--ink-soft); white-space: nowrap; }
    .nx-strack { height: 12px; border-radius: 7px; background: var(--chip); overflow: hidden; }
    .nx-strack i { display: block; height: 100%; border-radius: 7px; transition: width .4s cubic-bezier(.2, .8, .2, 1); }

    .nx-matrix { margin-top: 10px; overflow-x: auto; }
    .nx-matrix table { width: 100%; border-collapse: separate; border-spacing: 6px; min-width: 360px; }
    .nx-matrix th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; color: var(--ink-soft); padding: 4px 6px; text-align: center; }
    .nx-matrix th.dep { text-align: left; }
    .nx-matrix td.dep { font-size: 12px; font-weight: 750; white-space: nowrap; padding-right: 6px; }
    .nx-mcell {
      cursor: pointer;
      text-align: center;
      border-radius: 12px;
      padding: 12px 8px;
      font-size: 15px;
      font-weight: 850;
      color: var(--ink);
      border: 1px solid var(--line);
      transition: transform .16s cubic-bezier(.4, 0, .2, 1), box-shadow .16s, filter .16s;
    }
    .nx-mcell:hover { transform: scale(1.04); box-shadow: var(--shadow); filter: saturate(1.2); }
    .nx-mcell.zero { color: var(--ink-soft); opacity: .6; cursor: default; }
    .nx-mcell.zero:hover { transform: none; box-shadow: none; }

    .nx-jump { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--ink-soft); }
    .nx-jump input {
      width: 64px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel-solid);
      color: var(--ink);
      padding: 0 10px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      outline: none;
      transition: box-shadow .18s, border-color .18s;
    }
    .nx-jump input:focus { border-color: #00a7c8; box-shadow: 0 0 0 4px rgba(0, 167, 200, .24); }

    .nx-toasts { position: fixed; right: 22px; bottom: 22px; z-index: 100; display: flex; flex-direction: column; gap: 10px; max-width: min(340px, calc(100vw - 32px)); }
    .nx-toast { background: var(--panel-solid); border: 1px solid var(--line); border-left: 4px solid #f59e0b; border-radius: 14px; padding: 13px 15px; box-shadow: var(--shadow-lg); display: flex; gap: 11px; align-items: flex-start; animation: slidein .3s ease; }
    .nx-toast .t { font-weight: 800; font-size: 13px; margin-bottom: 2px; }
    .nx-toast .d { font-size: 12px; color: var(--ink-soft); line-height: 1.4; }

    @keyframes slidein {
      from { transform: translateX(40px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .nx-foot {
      padding: 18px 26px;
      border-top: 1px solid var(--line);
      color: var(--ink-soft);
      font-size: 11.5px;
      line-height: 1.55;
      text-align: center;
      display: flex;
      justify-content: center;
    }

    .nx-foot span {
      max-width: 1080px;
      overflow-wrap: anywhere;
    }

    .shimmer { background: linear-gradient(90deg, var(--chip) 25%, rgba(255, 255, 255, .5) 37%, var(--chip) 63%); background-size: 400% 100%; animation: sh 1.3s ease infinite; border-radius: 10px; }

    @keyframes sh {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    .nx-statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px; }
    .nx-stat { padding: 14px; border-radius: 14px; background: var(--kpi-ghost); border: 1px solid var(--line); }
    .nx-stat .value { font-size: 22px; font-weight: 850; margin-top: 4px; letter-spacing: 0; }

    .nx-modal-scrim {
      position: fixed;
      inset: 0;
      z-index: 140;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(3, 12, 25, .54);
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
      animation: modalFade .18s ease both;
    }

    .nx-modal {
      width: min(820px, 96vw);
      max-height: min(760px, 88vh);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-radius: 24px;
      border: 1px solid var(--line);
      background: var(--panel-solid);
      color: var(--ink);
      box-shadow: 0 34px 90px rgba(0, 0, 0, .38);
      transform: scale(.95);
      animation: modalScale .2s cubic-bezier(.2, .8, .2, 1) both;
    }

    .nx-modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 24px;
      background: linear-gradient(135deg, rgba(0, 41, 85, .98), rgba(0, 167, 200, .84));
      color: #fff;
    }

    .nx-modal-head h3 { margin: 0; font-size: 19px; font-weight: 850; line-height: 1.16; overflow-wrap: anywhere; }
    .nx-modal-head p { margin: 6px 0 0; color: rgba(255, 255, 255, .72); font-size: 12.5px; line-height: 1.45; overflow-wrap: anywhere; }
    .nx-modal-body { padding: 22px 24px 24px; overflow: auto; }
    .nx-modal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(164px, 1fr));
      gap: 12px;
      margin: 0 0 16px;
      align-items: stretch;
    }
    .nx-modal-stat {
      min-width: 0;
      border: 1px solid var(--line);
      background: var(--kpi-ghost);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 7px;
    }
    .nx-modal-stat b { display: block; font-size: clamp(17px, 2vw, 22px); line-height: 1.15; overflow-wrap: anywhere; }
    .nx-modal-section {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      padding: 15px;
      margin-top: 13px;
    }
    .nx-modal-section h4 {
      margin: 0 0 8px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--ink);
      font-weight: 850;
    }
    .nx-modal-copy { color: var(--ink-soft); font-size: 13px; line-height: 1.65; margin: 0; overflow-wrap: anywhere; }

    @keyframes modalFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes modalScale {
      from { opacity: 0; transform: scale(.95) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @media (max-width: 1024px) {
      .nx-grid2, .nx-grid2b { grid-template-columns: 1fr; }
      .nx-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 860px) {
      .nx-top { min-height: 70px; align-items: center; gap: 10px; padding: 8px 16px; flex-wrap: wrap; }
      .nx-brand { border-right: 0; padding-right: 0; margin-right: auto; }
      .nx-nav { order: 3; width: 100%; margin-right: 0; }
      .nx-tabbar {
        width: 100%;
        overflow-x: auto;
        justify-content: flex-start;
        scrollbar-width: none;
      }
      .nx-tabbar::-webkit-scrollbar { display: none; }
      .nx-tab { flex: 0 0 auto; }
      .nx-kanban { grid-template-columns: 1fr; }
      .nx-hide-sm { display: none; }
      .nx-welcome-body { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      .nx-kpis { grid-template-columns: 1fr; }
      .nx-body { padding: 18px 16px 48px; }
      .nx-top { padding: 0 12px; gap: 8px; }
      .nx-brand h1 { font-size: 15.5px; }
      .nx-brand span { display: none; }
      .nx-logo { width: 38px; height: 38px; border-radius: 12px; }
      .nx-hero { padding: 24px 22px; border-radius: 26px; }
      .nx-cardhead { align-items: flex-start; flex-direction: column; }
      .nx-statgrid { grid-template-columns: 1fr; }
      .nx-modal-grid { grid-template-columns: 1fr; }
      .nx-modal-scrim { padding: 12px; }
      .nx-drawer-body { padding: 14px; }
      .nx-genius-status { grid-template-columns: 1fr; }
      .nx-chat-toolbar { align-items: flex-start; flex-direction: column; }
      .nx-chat-actions { justify-content: flex-start; }
      .nx-chat-history { min-height: 0; padding: 12px 12px 24px; }
      .nx-chipbar { padding: 10px 12px 0; }
      .nx-msg { max-width: 100%; }
      .nx-chat-form { grid-template-columns: 1fr; }
      .nx-chat-form .nx-btn { width: 100%; }
      .nx-welcome-scrim { padding: 10px; }
      .nx-welcome-head { padding: 22px 18px 14px; }
      .nx-welcome-body { padding: 0 18px 22px; }
      .nx-welcome-drop { padding: 18px 16px; min-height: 150px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .nx * { animation: none !important; transition: none !important; }
    }

    .nx :focus-visible { outline: 3px solid rgba(0, 167, 200, .55); outline-offset: 2px; border-radius: 8px; }
  
    /* ===== Tail Spend Intelligence additions (built on the nx design system) ===== */
    .nx-grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .nx-kpis.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    @media (max-width: 1200px) { .nx-kpis.five { grid-template-columns: repeat(3, minmax(0,1fr)); } }
    @media (max-width: 1024px) { .nx-grid3 { grid-template-columns: 1fr; } .nx-kpis.five { grid-template-columns: repeat(2,minmax(0,1fr)); } }
    @media (max-width: 560px) { .nx-kpis.five { grid-template-columns: 1fr; } }

    .ts-fourechip { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:800; white-space:nowrap; }
    .ts-conf { font-size:10.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; }

    .ts-actionbar {
      position: sticky; bottom: 0; z-index: 5;
      display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
      padding:14px 16px; margin-top:14px;
      border:1px solid var(--line); border-radius:18px;
      background: linear-gradient(180deg, rgba(255,255,255,.9), var(--panel-solid));
      backdrop-filter: blur(10px); box-shadow: var(--shadow);
    }
    .nx.dark .ts-actionbar { background: linear-gradient(180deg, rgba(16,27,44,.92), var(--panel-solid)); }
    .ts-actionbar .grp { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .ts-metric { display:flex; flex-direction:column; gap:2px; }
    .ts-metric b { font-size:18px; font-weight:850; line-height:1; }
    .ts-metric span { font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); }

    /* Consolidation + Category: constrain width so nothing stretches edge-to-edge on wide monitors */
    [data-view="consolidation"], [data-view="category"] { max-width:1180px; margin-inline:auto; }
    .ts-consol-summary { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; margin:12px 0 4px; padding:12px 16px; border:1px solid var(--line); border-radius:14px; background:var(--kpi-ghost); }
    .ts-result-meta { display:flex; justify-content:space-between; align-items:center; margin:6px 0 10px; font-size:11.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); }
    .ts-expand-all { background:none; border:none; color:#00a7c8; font:inherit; font-weight:800; letter-spacing:.04em; text-transform:uppercase; cursor:pointer; padding:2px 4px; }
    .ts-expand-all:hover { text-decoration:underline; }

    /* Accordion rows — compact by default, drill down on click */
    .ts-consol-list { display:flex; flex-direction:column; gap:9px; }
    .ts-consol-row { border:1px solid var(--line); border-left:4px solid var(--accent,#37d399); border-radius:14px; background:var(--panel); overflow:hidden; transition:box-shadow .15s, border-color .15s; }
    .ts-consol-row:hover { border-color:var(--line-strong,var(--line)); box-shadow:0 6px 18px rgba(8,18,33,.06); }
    .ts-consol-row.open { box-shadow:0 10px 28px rgba(8,18,33,.08); }
    .ts-consol-row.applied { opacity:.72; }
    .ts-row-head { width:100%; display:flex; align-items:center; gap:14px; padding:12px 16px; background:none; border:none; cursor:pointer; text-align:left; color:inherit; font:inherit; }
    .ts-row-head:hover { background:var(--kpi-ghost); }
    .ts-row-chev { flex:0 0 auto; display:grid; place-items:center; color:var(--ink-soft); transition:transform .2s ease; }
    .ts-consol-row.open .ts-row-chev { transform:rotate(90deg); color:#00a7c8; }
    .ts-row-main { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:5px; }
    .ts-row-title { font-weight:850; font-size:14.5px; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .ts-row-tags { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
    .ts-row-lanes { display:inline-flex; gap:4px; flex-wrap:wrap; }
    .ts-row-kpis { flex:0 0 auto; display:flex; align-items:center; gap:20px; }
    .ts-row-kpis .kpi { display:flex; flex-direction:column; align-items:flex-end; line-height:1.12; min-width:44px; }
    .ts-row-kpis .kpi b { font-size:14px; font-weight:850; white-space:nowrap; }
    .ts-row-kpis .kpi small { font-size:9px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-soft); margin-top:2px; }
    .ts-row-kpis .kpi.conf .cbar { width:48px; height:3px; border-radius:999px; background:var(--chip); margin-top:4px; overflow:hidden; }
    .ts-row-kpis .kpi.conf .cbar i { display:block; height:100%; border-radius:999px; }
    .ts-row-status { flex:0 0 auto; font-size:10.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); padding:4px 9px; border-radius:999px; background:var(--chip); border:1px solid var(--line); white-space:nowrap; }
    .ts-row-status.done { color:#11845b; background:rgba(55,211,153,.16); border-color:rgba(55,211,153,.4); }

    .ts-fam-detail { display:none; flex-direction:column; gap:11px; padding:2px 16px 15px 34px; border-top:1px solid var(--line); margin-top:2px; }
    .ts-consol-row.open .ts-fam-detail { display:flex; }
    .ts-detail-label { font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); margin-top:11px; }
    .ts-consol-members { display:flex; flex-wrap:wrap; gap:6px; }
    .ts-member { font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:999px; background:var(--chip); border:1px solid var(--line); cursor:pointer; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    .ts-member.primary { border-color:#37d399; font-weight:850; background:rgba(55,211,153,.12); }

    .ts-consol-insight { display:flex; gap:8px; align-items:flex-start; font-size:12.5px; line-height:1.55; color:var(--ink-soft); background:var(--kpi-ghost); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }

    .ts-consol-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .ts-consol-empty { display:flex; flex-direction:column; align-items:center; gap:10px; padding:38px 20px; text-align:center; color:var(--ink-soft); border:1px dashed var(--line); border-radius:16px; }
    .ts-consol-empty svg { color:#00a7c8; opacity:.8; }
    .ts-consol-empty p { margin:0; font-weight:700; color:var(--ink); }
    @media (max-width: 920px){ .ts-consol-summary { grid-template-columns:repeat(2,1fr); } }
    @media (max-width: 760px){

      .ts-cat-stats { grid-template-columns:repeat(2,1fr) !important; }

        ? "Supplier name and comments agree on this category."
        : fromName
          ? "Supplier-name keyword signal" + (nameHit.hits > 1 ? "s (" + nameHit.hits + " matches)." : ". Verify against the actual goods/services.")
          : "Inferred from the invoice comments / description.";
      return { category: bestCat, confidence, reason, source: agree ? "name+comments" : fromName ? "name" : "comments", clinicalService: false };
    }
    return { category: "General Indirect / Uncategorized", confidence: "Needs Review", reason: "No category, dictionary, name, or comment signal could classify this supplier. Manual review needed.", source: "none", clinicalService: false };
  }

  /* ============================ State ============================ */
  function loadTheme() { try { return localStorage.getItem("corewell_ts_theme") || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); } catch { return "light"; } }
  function saveTheme(t) { try { localStorage.setItem("corewell_ts_theme", t); } catch {} document.documentElement.setAttribute("data-theme", t); document.documentElement.style.colorScheme = t; }

  const state = {
    theme: loadTheme(),
    page: "hub",
    suppliers: [],
    families: [],
    yearCols: [],
    quality: null,
    review: null,
    uploadName: "",
    loaded: false,
    drag: false,
    drawerOpen: false,
    notifOpen: false,
    welcomeOpen: true,
    activeModal: null,
    importing: false,
    importStep: 0,
    // ledger controls
    query: "", fCat: "", fE: "", fRisk: "", fConf: "", fFamily: "", sortBy: "spend", tablePage: 1, perPage: 25,
    // consolidation controls
    cQuery: "", cE: "", cCat: "", cRisk: "", cConf: "", cStatus: "", cSort: "savings", cOpen: {},
    // category intelligence controls
    catQuery: "", catSort: "spend", catOpen: {},
    // chat
    chatMessages: [], chatInput: "", chatLoading: false,
    latestUserMessageId: null,
    suggestOpen: false,
    savedInsights: [],
    // secure smart reader (local priority pass)
    smartLoading: false, smartResult: null, smartError: null,
    insights: {},
    toasts: []
  };

  const app = document.getElementById("app");

  /* ============================ Ingest ============================ */
  const SUMMARY_LABELS = new Set(["total", "totals", "grand total", "grand totals", "subtotal", "sub total", "total spend", "report total", "sum", "summary", "n a", "na", "blank", "unknown", "supplier"]);
  function isSummaryRow(supplierName) {
    const t = normalizeText(supplierName);
    if (!t) return true;
    // Only treat as a summary row when the whole supplier cell is a summary label —
    // never flag real suppliers that merely start with "Total" (e.g. "Total Plastics International").
    if (SUMMARY_LABELS.has(t)) return true;
    return false;
  }

  function ingestRows(rows, fileName) {
    const headers = rows.__headers || [...new Set(rows.flatMap(r => Object.keys(r || {}).filter(k => !k.startsWith("__"))))];
    const hm = buildHeaderMap(headers);
    const yearCols = hm.years.map(y => ({ key: y.key, year: y.year }));
    const supKey = hm.fields.supplier || headers[0];
    const totalKey = hm.fields.totalSpend;
    const catKey = hm.fields.category;
    const statusKey = hm.fields.status;
    const commentKey = hm.fields.comments;

    const quality = {
      rowsRead: rows.length, imported: 0, skipped: 0, missingSupplier: 0, missingSpend: 0,
      duplicateCandidates: 0, inferredCategories: 0, summaryRows: 0, zeroSpend: 0,
      unmappedFields: [], mappedFields: [], yearCols: yearCols.map(y => y.year),
      selectedSheet: rows.__selectedSheet || "CSV upload", detectedSheets: rows.__detectedSheets || []
    };
    ["supplier", "totalSpend", "category", "status", "comments"].forEach(f => { if (hm.fields[f]) quality.mappedFields.push(f); else if (f !== "status" && f !== "comments") quality.unmappedFields.push(f); });

    const out = [];
    rows.forEach(r => {
      const supplierRaw = cleanCell(r[supKey]);
      if (!supplierRaw) { quality.skipped++; quality.missingSupplier++; return; }
      if (isSummaryRow(supplierRaw)) { quality.skipped++; quality.summaryRows++; return; }
      const years = {}; let yearSum = 0; let hasYear = false;
      yearCols.forEach(y => { const v = parseMoney(r[y.key]); if (v != null) { years[y.year] = v; yearSum += v; hasYear = true; } else years[y.year] = 0; });
      let total = totalKey != null ? parseMoney(r[totalKey]) : null;
      let totalInferred = false;
      if (total == null || (total === 0 && yearSum !== 0)) { if (hasYear) { total = yearSum; totalInferred = true; } }
      if (total == null) total = 0;
      if (total === 0) quality.zeroSpend++;
      const existingCat = catKey ? cleanCell(r[catKey]) : "";
      const statusRaw = statusKey ? cleanCell(r[statusKey]) : "";
      const comments = commentKey ? cleanCell(r[commentKey]) : "";
      const dict = dictionaryMatch(supplierRaw);
      const cat = categorize(supplierRaw, existingCat, comments, statusRaw, dict);
      if (cat.source !== "file") quality.inferredCategories++;

      // YOY: use first and last year columns when >=2
      let yoy = null;
      if (yearCols.length >= 2) {
        const ys = yearCols.map(y => y.year);
        const a = years[ys[0]] || 0, b = years[ys[ys.length - 1]] || 0;
        const absChange = b - a;
        const pct = a !== 0 ? (absChange / Math.abs(a)) * 100 : (b !== 0 ? 100 : 0);
        yoy = { from: ys[0], to: ys[ys.length - 1], a, b, abs: absChange, pct };
      }

      out.push({
        id: "S-" + String(out.length + 1).padStart(5, "0"),
        raw: supplierRaw,
        supplier: titleCase(supplierRaw),
        normalizedName: normalizeSupplier(supplierRaw),
        dictCanonical: dict ? dict.canonical : null,
        years, yearSum, totalSpend: total, totalInferred,
        yoy,
        category: cat.category, categoryConfidence: cat.confidence, categoryReason: cat.reason, categorySource: cat.source,
        clinicalService: !!cat.clinicalService,
        statusRaw, comments,
        sheet: r.__sheetName || quality.selectedSheet, rowNumber: r.__rowNumber || 0,
        applied: false
      });
    });

    quality.imported = out.length;
    quality.missingSpend = out.filter(s => s.totalSpend === 0).length;

    // families / duplicates
    buildFamilies(out, quality);
    // four-E + risk + savings (needs family info)
    out.forEach(s => enrichActions(s, out));

    state.suppliers = out;
    state.yearCols = yearCols.map(y => y.year);
    state.quality = quality;
    state.uploadName = fileName;
    state.loaded = true;
    state.tablePage = 1;
    state.review = buildReview(out, quality);
  }

  function buildFamilies(list, quality) {
    // bucket by dictionary canonical, else first significant token
    const buckets = new Map();
    list.forEach(s => {
      let key = s.dictCanonical ? "D::" + s.dictCanonical : null;
      if (!key) { const tok = (s.normalizedName.split(" ")[0] || s.normalizedName || s.id); key = "T::" + tok; }
      if (!buckets.has(key)) buckets.set(key, []);
      buckets.get(key).push(s);
    });
    const families = [];
    let fid = 0;
    buckets.forEach((members, key) => {
      // sub-cluster within bucket
      const used = new Array(members.length).fill(false);
      for (let i = 0; i < members.length; i++) {
        if (used[i]) continue;
        const group = [members[i]]; used[i] = true;
        for (let j = i + 1; j < members.length; j++) {
          if (used[j]) continue;
          const sim = similarity(members[i], members[j], key.startsWith("D::"));
          if (sim >= 0.6) { group.push(members[j]); used[j] = true; }
        }
        // build family record
        fid++;
        const sorted = group.slice().sort((a, b) => b.totalSpend - a.totalSpend);
        const primary = sorted[0];
        const famName = key.startsWith("D::") ? key.slice(3) : primary.supplier;
        const familyId = "F-" + String(fid).padStart(4, "0");
        const totalSpend = group.reduce((s, m) => s + m.totalSpend, 0);
        group.forEach(m => {
          m.supplierFamily = famName;
          m.duplicateGroup = familyId;
          m.isPrimaryInFamily = m === primary;
          m.familySize = group.length;
        });
        const fam = {
          id: familyId, name: famName, members: group, primary, totalSpend,
          size: group.length, category: primary.category,
          isDuplicate: group.length > 1,
          confidence: group.length > 1 ? Math.round(avgSimilarity(group, key.startsWith("D::")) * 100) : 0
        };
        group.forEach(m => { m.duplicateConfidence = fam.confidence; });
        families.push(fam);
      }
    });
    const dupFamilies = families.filter(f => f.size > 1);
    quality.duplicateCandidates = dupFamilies.reduce((s, f) => s + (f.size - 1), 0);
    state.families = families;
  }
  function similarity(a, b, sameDict) {
    if (sameDict) return 0.95;
    const an = a.normalizedName, bn = b.normalizedName;
    if (!an || !bn) return 0;
    if (an === bn) return 1;
    const ts = tokenScore(an, bn);
    // compact (space-stripped) Levenshtein ratio catches spacing/typo variants of the same vendor
    const ac = an.replace(/\s+/g, ""), bc = bn.replace(/\s+/g, "");
    const lev = 1 - levenshtein(ac, bc) / Math.max(ac.length, bc.length, 1);
    const contains = an.includes(bn) || bn.includes(an);
    let s = Math.max(ts, lev * 0.9);
    if (contains && Math.min(an.length, bn.length) >= 5) s = Math.max(s, 0.85);
    return s;
  }
  function avgSimilarity(group, sameDict) {
    if (group.length < 2) return 0; if (sameDict) return 0.95;
    let sum = 0, n = 0;
    for (let i = 0; i < group.length; i++) for (let j = i + 1; j < group.length; j++) { sum += similarity(group[i], group[j], false); n++; }
    return n ? sum / n : 0.7;
  }

  /* ============================ Four-E + risk + savings ============================ */
  function spendPercentiles(list) {
    const vals = list.map(s => s.totalSpend).filter(v => v > 0).sort((a, b) => a - b);
    const pct = p => vals.length ? vals[Math.min(vals.length - 1, Math.floor(p * vals.length))] : 0;
    return { p50: pct(0.5), p80: pct(0.8), p90: pct(0.9), p95: pct(0.95), max: vals[vals.length - 1] || 0 };
  }
  let SPEND_PCT = null;
  function enrichActions(s, list) {
    if (!SPEND_PCT || SPEND_PCT.__for !== list) { SPEND_PCT = spendPercentiles(list); SPEND_PCT.__for = list; }
    const p = SPEND_PCT;
    const clinical = CLINICAL_SENSITIVE.has(s.category) || s.clinicalService;
    const regulated = REGULATED.has(s.category);
    const strategic = STRATEGIC_CATS.has(s.category);
    const status = normalizeText(s.statusRaw);
    const isDup = s.familySize > 1 && !s.isPrimaryInFamily;
    const tiny = s.totalSpend > 0 && s.totalSpend < p.p50 * 0.15;
    const meaningfulTail = s.totalSpend > 0 && s.totalSpend < p.p80;
    const big = s.totalSpend >= p.p90;
    const growth = s.yoy && s.yoy.pct >= 25 && s.yoy.b > p.p50;

    let lane, reason, nextStep, owner, risk, savingsLever, conf, autoApply;

    if (status === "duplicate" || isDup) {
      lane = "Eliminate"; conf = "High"; autoApply = !clinical;
      reason = "Part of supplier family “" + s.supplierFamily + "” (" + s.familySize + " records). " + (s.isPrimaryInFamily ? "Primary record." : "Non-primary duplicate of the family.");
      nextStep = "Merge invoices into the primary family vendor record and block new POs against this entry.";
      owner = "Procurement Operations / Master Data";
      savingsLever = "Vendor master cleanup + consolidated pricing leverage";
    } else if (status === "remove") {
      lane = "Eliminate"; conf = "High"; autoApply = !clinical;
      reason = "Flagged Remove in the source file.";
      nextStep = "Confirm no active commitments, then deactivate the vendor and redirect demand to a preferred supplier.";
      owner = "Category Manager"; savingsLever = "Demand elimination / off-contract removal";
    } else if (s.totalSpend <= 0) {
      lane = "Eliminate"; conf = "High"; autoApply = !clinical;
      reason = "Zero or no spend on file — likely inactive or one-time vendor.";
      nextStep = "Archive the vendor record; require sponsorship to reactivate.";
      owner = "Procurement Operations"; savingsLever = "Vendor count reduction (admin burden)";
    } else if (clinical) {
      if (big || strategic) { lane = "Evolve"; conf = "Medium"; autoApply = false;
        reason = "Clinical-sensitive, material spend in " + s.category + ". Move toward governed sourcing rather than cutting.";
        nextStep = "Route to GPO/contracted channel and validate clinical equivalency with stakeholders before any change.";
        owner = "Clinical Value Analysis + Strategic Sourcing"; savingsLever = "GPO/contract price alignment with clinical sign-off";
      } else { lane = "Evaluate"; conf = "Medium"; autoApply = false;
        reason = "Clinical/patient-care category (" + s.category + "). Continuity and equivalency risk means this is not a simple cut.";
        nextStep = "Clinical review for equivalency and continuity before consolidation or elimination.";
        owner = "Clinical Value Analysis"; savingsLever = "Risk-gated standardization";
      }
    } else if (regulated) {
      lane = "Evaluate"; conf = "Medium"; autoApply = false;
      reason = s.category + " carries regulatory / PHI / financial control sensitivity.";
      nextStep = "Compliance + Legal review of data, privacy, and continuity obligations before changing the supplier.";
      owner = "Compliance / Legal / Sourcing"; savingsLever = "Controlled renegotiation";
    } else if (big || growth) {
      lane = "Evolve"; conf = growth ? "High" : "Medium"; autoApply = false;
      reason = big ? "High-value supplier (top decile of spend)." : "Material YOY growth (" + fmtPct(s.yoy.pct, 0) + ") signals rising importance.";
      nextStep = "Bring under contract/catalog governance and add to the strategic supplier review cadence.";
      owner = "Strategic Sourcing"; savingsLever = "Contract leverage + price benchmarking";
    } else if (tiny) {
      lane = "Eliminate"; conf = "Medium"; autoApply = false;
      reason = "Very small one-off spend (" + fmtMoney(s.totalSpend) + ") — high invoice-handling cost relative to value.";
      nextStep = "Redirect to a catalog/preferred supplier or P-card; retire the standalone vendor.";
      owner = "Category Manager"; savingsLever = "Process cost + tail rationalization";
    } else if (meaningfulTail) {
      lane = "Engage"; conf = "Medium"; autoApply = false;
      reason = "Unmanaged tail supplier with meaningful spend (" + fmtMoney(s.totalSpend) + ") and no strategic owner.";
      nextStep = "Assign a category owner, confirm requirements, and test consolidation into a preferred supplier.";
      owner = "Category Manager"; savingsLever = "Consolidation + maverick spend recovery";
    } else {
      lane = "Engage"; conf = "Low"; autoApply = false;
      reason = "Mid-tier supplier that warrants owner outreach to confirm strategy.";
      nextStep = "Engage the business owner to decide consolidate / contract / monitor.";
      owner = "Category Manager"; savingsLever = "Category management";
    }

    // risk level
    let riskLevel = "Low";
    if (clinical) riskLevel = big ? "Critical" : "High";
    else if (regulated) riskLevel = "High";
    else if (big) riskLevel = "Medium";
    else riskLevel = "Low";

    // savings opportunity (conservative, labeled as estimate)
    let savings = 0;
    if (lane === "Eliminate") savings = isDup ? Math.round(s.totalSpend * 0.08) : Math.round(s.totalSpend * 0.6 + 350);
    else if (lane === "Engage") savings = Math.round(s.totalSpend * 0.06);
    else if (lane === "Evolve") savings = Math.round(s.totalSpend * 0.04);
    else savings = Math.round(s.totalSpend * 0.02);
    if (s.totalSpend <= 0) savings = 0;

    s.fourE = lane; s.nextStep = nextStep; s.owner = owner;
    s.riskControl = clinical ? "Require clinical equivalency + continuity sign-off." : regulated ? "Require compliance/legal review." : "Confirm no active commitments before change.";
    s.savingsLever = savingsLever; s.fourEConfidence = conf; s.autoApply = autoApply;
    s.riskLevel = riskLevel; s.savingsOpportunity = savings;
    s.actionRationale = reason;
    s.tailSpendReason = s.totalSpend < p.p80
      ? "Sits in the long tail (below the 80th percentile of supplier spend), where leverage is low and invoice/admin burden is high."
      : "Above the tail threshold — manage as a core supplier, not pure tail.";
  }

  /* ============================ Review report ============================ */
  function buildReview(list, quality) {
    const total = list.reduce((s, x) => s + x.totalSpend, 0);
    const tailThreshold = SPEND_PCT ? SPEND_PCT.p80 : 0;
    const tail = list.filter(s => s.totalSpend > 0 && s.totalSpend < tailThreshold);
    const families = state.families.filter(f => f.size > 1);
    // confidence score: blend of field mapping + category confidence + dedupe coverage
    const mapScore = (quality.mappedFields.length / 5) * 100;
    const catScore = list.length ? (list.filter(s => s.categoryConfidence === "High" || s.categoryConfidence === "Medium").length / list.length) * 100 : 0;
    const dupScore = list.length ? (1 - quality.duplicateCandidates / list.length) * 100 : 100;
    const confidence = Math.round(clamp(mapScore * 0.45 + catScore * 0.35 + dupScore * 0.2, 5, 99));
    const needsReview = list.filter(s => s.categoryConfidence === "Needs Review").length;
    const risks = [];
    if (families.length) risks.push({ tone: BRAND.violet, t: families.length + " duplicate / similar supplier families", d: "≈ " + quality.duplicateCandidates + " redundant vendor records can be consolidated into a single family." });
    if (quality.zeroSpend) risks.push({ tone: BRAND.amber, t: quality.zeroSpend + " zero / no-spend vendors", d: "Inactive or one-off vendors inflating the supplier count and admin burden." });
    if (needsReview) risks.push({ tone: BRAND.rose, t: needsReview + " suppliers need category review", d: "No reliable category signal — assign a commodity before sourcing actions." });
    const clinicalBig = list.filter(s => CLINICAL_SENSITIVE.has(s.category) && s.totalSpend >= (SPEND_PCT ? SPEND_PCT.p90 : 0));
    if (clinicalBig.length) risks.push({ tone: BRAND.teal, t: clinicalBig.length + " clinical-sensitive high-spend suppliers", d: "Protect patient-care continuity — Evaluate/Evolve, never blunt elimination." });
    return {
      total, tailCount: tail.length, tailSpend: tail.reduce((s, x) => s + x.totalSpend, 0),
      families: families.length, confidence, needsReview, risks
    };
  }

  /* ============================ Aggregations ============================ */
  function getKpis() {
    const list = state.suppliers;
    const total = list.reduce((s, x) => s + x.totalSpend, 0);
    const tailThreshold = SPEND_PCT ? SPEND_PCT.p80 : 0;
    const tail = list.filter(s => s.totalSpend > 0 && s.totalSpend < tailThreshold);
    const dupFamilies = state.families.filter(f => f.size > 1);
    const savings = list.reduce((s, x) => s + (x.applied ? 0 : x.savingsOpportunity), 0);
    return {
      suppliers: list.length, total, tailCount: tail.length, tailSpend: tail.reduce((s, x) => s + x.totalSpend, 0),
      dupGroups: dupFamilies.length, dupCount: dupFamilies.reduce((s, f) => s + (f.size - 1), 0),
      savings, eliminate: list.filter(s => s.fourE === "Eliminate").length
    };
  }
  function categoryRollup() {
    const m = new Map();
    state.suppliers.forEach(s => {
      if (!m.has(s.category)) m.set(s.category, { name: s.category, spend: 0, count: 0, suppliers: [] });
      const e = m.get(s.category); e.spend += s.totalSpend; e.count++; e.suppliers.push(s);
    });
    return [...m.values()].sort((a, b) => b.spend - a.spend);
  }
  function categoryHHI(cat) {
    const sup = cat.suppliers.filter(s => s.totalSpend > 0);
    const tot = sup.reduce((s, x) => s + x.totalSpend, 0) || 1;
    const hhi = sup.reduce((s, x) => s + Math.pow((x.totalSpend / tot) * 100, 2), 0);
    return Math.round(hhi);
  }

  /* ============================ Loader overlay ============================ */
  const IMPORT_STEPS = [
    "Reading workbook", "Finding supplier ledger", "Mapping columns", "Cleaning spend values",
    "Categorizing suppliers", "Finding duplicates and consolidation groups", "Building dashboard", "Preparing Tail Spend Genius context"
  ];
  function renderLoader() {
    if (!state.importing) return "";
    const steps = IMPORT_STEPS.map((label, i) => {
      const cls = i < state.importStep ? "done" : i === state.importStep ? "active" : "";
      const dot = i < state.importStep ? icon("check", 12) : '';
      return '<div class="ts-step ' + cls + '"><span class="dot">' + dot + '</span><span>' + escapeHTML(label) + '</span></div>';
    }).join("");
    const pct = Math.round((state.importStep / IMPORT_STEPS.length) * 100);
    return '<div class="ts-loader-scrim" role="presentation"><div class="ts-loader" role="dialog" aria-modal="true" aria-label="Importing supplier spend"><h3>' + icon("sparkle", 19) + ' Ingesting supplier spend</h3><p class="sub">Expert AI data ingestion — everything runs locally in this browser tab.</p><div class="ts-steps">' + steps + '</div><div class="track"><i style="width:' + pct + '%"></i></div></div></div>';
  }
  // Update only the loader's step states in place so the overlay does not
  // re-mount (and re-flash its entrance animation) on every step.
  function updateLoader() {
    const scrim = document.querySelector(".ts-loader-scrim");
    if (!scrim) return;
    scrim.querySelectorAll(".ts-step").forEach((el, i) => {
      const dot = el.querySelector(".dot");
      el.classList.remove("active", "done");
      if (i < state.importStep) { el.classList.add("done"); if (dot) dot.innerHTML = icon("check", 12); }
      else { if (i === state.importStep) el.classList.add("active"); if (dot) dot.innerHTML = ""; }
    });
    const bar = scrim.querySelector(".track i");
    if (bar) bar.style.width = Math.round((state.importStep / IMPORT_STEPS.length) * 100) + "%";
  }
  async function runImport(loaderFn) {
    state.importing = true; state.importStep = 0;
    render(); // mount the overlay once; subsequent steps update it in place
    for (let i = 0; i < IMPORT_STEPS.length; i++) {
      state.importStep = i; updateLoader();
      if (i === 1) { try { await loaderFn(); } catch (err) { state.importing = false; pushToast("Import failed", String(err && err.message || err)); render(); throw err; } }
      await sleep(i === 1 ? 60 : 230);
    }
    state.importStep = IMPORT_STEPS.length; updateLoader();
    await sleep(320);
    state.importing = false;
    state.page = "review"; state.welcomeOpen = false;
    render({ viewTransition: true });
    pushToast("Data imported", state.suppliers.length.toLocaleString() + " suppliers ready · confidence " + (state.review ? state.review.confidence : 0) + "%");
  }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  function handleFile(file) {
    if (!file) return;
    const ext = (file.name.split(".").pop() || "").toLowerCase();
    if (ext === "csv" || ext === "txt") {
      const reader = new FileReader();
      reader.onload = e => { runImport(async () => { const rows = parseCSV(String(e.target.result || "")); ingestRows(rows, file.name); }).catch(() => {}); };
      reader.onerror = () => pushToast("File read failed", "The browser could not read that file.");
      reader.readAsText(file); return;
    }
    if (ext === "xlsx") {
      const reader = new FileReader();
      reader.onload = e => { runImport(async () => { const rows = await parseXLSX(e.target.result); ingestRows(rows, file.name); }).catch(() => {}); };
      reader.onerror = () => pushToast("File read failed", "The browser could not read that workbook.");
      reader.readAsArrayBuffer(file); return;
    }
    pushToast("Unsupported file", "Use CSV, TXT, or XLSX so the local reader can process it in-browser.");
    state.drag = false; render();
  }

  function pushToast(title, detail) {
    const id = Date.now() + Math.random();
    state.toasts.push({ id, title, detail });
    render();
    setTimeout(() => { state.toasts = state.toasts.filter(t => t.id !== id); render(); }, 4200);
  }

  /* ============================ Demo data ============================ */
  function loadDemoData() {
    const demo = [
      ["Express Scripts Insurance Company", 1554455120, 686047540, "", "Keep", "PBM rebates"],

  function chartTipAttrs(title, body) { return ' data-chart-title="' + escapeHTML(title) + '" data-chart-body="' + escapeHTML(body) + '"'; }
  // Safe label truncation with ellipsis — keeps full name for the tooltip.
  function truncLabel(s, max) { s = cleanCell(s); return s.length > max ? s.slice(0, max - 1).trimEnd() + "…" : s; }
  // Smart short label for an axis: prefer the first word, fall back to a truncated name.
  function shortLabel(name, max = 12) {
    const t = cleanCell(name); if (t.length <= max) return t;

  // Readable short category label for legends (drop the part after & or /).

  function renderBarChart(data, idAttr, colorFn) {
    if (!data.length) return '<div class="nx-chart-empty">No data yet.</div>';
    const width = 640, height = 248, padL = 10, padR = 10, padB = 30, padT = 24;
    const max = Math.max.apply(null, data.map(d => d.value)) || 1;
    const slot = (width - padL - padR) / data.length;
    const barW = Math.min(74, slot * 0.62);
    const plotH = height - padB - padT;
    const bars = data.map((d, i) => {
      const h = Math.max(3, (d.value / max) * plotH);
      const x = padL + i * slot + (slot - barW) / 2;
      const y = height - padB - h;
      const slotX = padL + i * slot;
      const cx = (x + barW / 2).toFixed(1);
      const color = colorFn ? colorFn(d, i) : BRAND.teal;
      // Visible bar (animated), a value label revealed on hover, then a TRANSPARENT full-column
      // hit rect on top so a click/hover anywhere in the column selects — not just the bar base.
      return '<g class="nx-barslot">' +
        '<rect class="nx-bar-fill" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="7" fill="' + color + '" style="animation-delay:' + (i * 0.045).toFixed(3) + 's"></rect>' +
        '<text class="nx-barval" x="' + cx + '" y="' + Math.max(12, y - 6).toFixed(1) + '" text-anchor="middle">' + escapeHTML(fmtMoney(d.value)) + '</text>' +
        '<rect class="nx-bar-hit nx-chart-node" ' + idAttr + '="' + escapeHTML(d.key) + '"' + chartTipAttrs(d.label, d.tip) + ' x="' + slotX.toFixed(1) + '" y="' + padT + '" width="' + slot.toFixed(1) + '" height="' + (plotH + padB).toFixed(1) + '" fill="transparent"></rect>' +
        '<text class="nx-axis" x="' + cx + '" y="' + (height - 12) + '" text-anchor="middle">' + escapeHTML(d.short) + '</text>' +
        '</g>';
    }).join("");
    return '<svg class="nx-svgchart" viewBox="0 0 ' + width + ' ' + height + '" preserveAspectRatio="xMidYMid meet">' + bars + '</svg>';
  }

  // Path-based donut arc: angles measured from 12 o'clock, clockwise.
  function donutArc(cx, cy, rOut, rIn, a0, a1) {
    const pt = (r, a) => [(cx + r * Math.sin(a)).toFixed(2), (cy - r * Math.cos(a)).toFixed(2)];
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    const [x0, y0] = pt(rOut, a0), [x1, y1] = pt(rOut, a1), [x2, y2] = pt(rIn, a1), [x3, y3] = pt(rIn, a0);
    return 'M ' + x0 + ' ' + y0 + ' A ' + rOut + ' ' + rOut + ' 0 ' + large + ' 1 ' + x1 + ' ' + y1 +
      ' L ' + x2 + ' ' + y2 + ' A ' + rIn + ' ' + rIn + ' 0 ' + large + ' 0 ' + x3 + ' ' + y3 + ' Z';
  }
  // Top categories + grouped "Other" so the donut never crowds into tiny slivers.
  function buildCategoryDonutData(cats) {
    const sorted = cats.slice().filter(c => c.spend > 0).sort((a, b) => b.spend - a.spend);
    const TOP = 7, head = sorted.slice(0, TOP), tail = sorted.slice(TOP);
    const data = head.map(c => ({ key: c.name, label: c.name, short: catShort(c.name), value: c.spend, count: c.count, color: catColor(c.name) }));
    if (tail.length) {
      data.push({
        key: "__other__", label: "Other (" + tail.length + " categories)", short: "Other",
        value: tail.reduce((s, c) => s + c.spend, 0), count: tail.reduce((s, c) => s + c.count, 0),
        color: BRAND.slate, drill: false
      });
    }
    return data;
  }
  function renderDonut(data, idAttr) {
    if (!data.length) return '<div class="nx-chart-empty">No data yet.</div>';
    const total = data.reduce((s, d) => s + d.value, 0) || 1;
    const cx = 100, cy = 100, rOut = 92, rIn = 58, single = data.length === 1;
    let acc = 0;
    const segs = data.map(d => {
      const frac = d.value / total;
      const pct = fmtPct(frac * 100, frac < 0.095 ? 1 : 0);
      const idA = d.drill === false ? "" : ' ' + idAttr + '="' + escapeHTML(d.key) + '"';
      const tip = fmtFull(d.value) + (d.count != null ? " · " + d.count.toLocaleString() + " supplier" + (d.count === 1 ? "" : "s") : "") + " · " + pct + " of total";
      if (single) return '<circle class="nx-donut-seg nx-chart-node"' + idA + chartTipAttrs(d.label, tip) + ' cx="' + cx + '" cy="' + cy + '" r="' + ((rOut + rIn) / 2) + '" fill="none" stroke="' + d.color + '" stroke-width="' + (rOut - rIn) + '"></circle>';
      const a0 = acc * 2 * Math.PI; acc += frac; const a1 = acc * 2 * Math.PI;
      return '<path class="nx-donut-seg nx-chart-node"' + idA + chartTipAttrs(d.label, tip) + ' d="' + donutArc(cx, cy, rOut, rIn, a0, a1) + '" fill="' + d.color + '"></path>';
    }).join("");
    const legend = data.map(d => '<span><i style="background:' + d.color + '"></i>' + escapeHTML(d.short) + '<b>' + Math.round(d.value / total * 100) + '%</b></span>').join("");
    return '<div class="nx-donut-wrap"><div class="nx-donut-figure"><svg class="nx-donut-svg" viewBox="0 0 200 200" role="img" aria-label="Spend by category"><g class="nx-donut-segs">' + segs + '</g><text class="nx-donut-total" x="100" y="95">' + fmtMoney(total) + '</text><text class="nx-donut-label" x="100" y="117">Category spend</text></svg></div><div class="nx-legend">' + legend + '</div></div>';
  }

  /* ===== Consolidation Command ===== */
  const RISK_ORDER = ["Low", "Medium", "High", "Critical"];
  // Build a view-model for every duplicate/similar family: representative risk, member action

  function consolidationFamilies() {
    return state.families.filter(f => f.size > 1).map(f => {
      const nonPrimary = f.members.filter(m => !m.isPrimaryInFamily);
      const lanes = [...new Set(f.members.map(m => m.fourE))];
      const riskLevel = f.members.reduce((r, m) => RISK_ORDER.indexOf(m.riskLevel) > RISK_ORDER.indexOf(r) ? m.riskLevel : r, "Low");
      const savings = nonPrimary.reduce((s, m) => s + (m.applied ? 0 : m.savingsOpportunity), 0);
      const clinical = CLINICAL_SENSITIVE.has(f.category) || f.members.some(m => m.clinicalService);
      const allApplied = nonPrimary.every(m => m.applied);
      const pending = nonPrimary.some(m => !m.applied);

    });

  function filteredConsolidation() {

    if (state.cE) rows = rows.filter(r => r.lanes.includes(state.cE));
    if (state.cCat) rows = rows.filter(r => r.f.category === state.cCat);
    if (state.cRisk) rows = rows.filter(r => r.riskLevel === state.cRisk);
    if (state.cConf) rows = rows.filter(r => r.f.confidence >= Number(state.cConf));
    if (state.cStatus === "applied") rows = rows.filter(r => r.allApplied);
    else if (state.cStatus === "pending") rows = rows.filter(r => r.pending);
    const sb = state.cSort;
    rows.sort((a, b) => sb === "spend" ? b.f.totalSpend - a.f.totalSpend : sb === "size" ? b.f.size - a.f.size : sb === "confidence" ? b.f.confidence - a.f.confidence : sb === "risk" ? RISK_ORDER.indexOf(b.riskLevel) - RISK_ORDER.indexOf(a.riskLevel) : b.savings - a.savings);
    return rows;
  }
  // Specific, family-aware insight line (not a generic "merge the rest" sentence).
  function familyInsight(r) {

    const bits = [];
    bits.push('<b>' + n + '</b> redundant record' + (n === 1 ? '' : 's') + ' → 1, ' + fmtMoney(r.savings) + ' est. savings at <b>' + f.confidence + '%</b> name-match.');
    if (r.clinical) bits.push('Clinical-sensitive — consolidate the contract but require clinical equivalency &amp; continuity sign-off before deactivating the duplicates.');
    else if (f.totalSpend >= (SPEND_PCT ? SPEND_PCT.p90 : 0)) bits.push('High-value family — a single master record unlocks pricing leverage; route to Strategic Sourcing.');
    else if (f.totalSpend < (SPEND_PCT ? SPEND_PCT.p50 : 0)) bits.push('Low-dollar duplicates — merging mainly cuts vendor-master and invoice-handling overhead.');
    else bits.push('Merge invoices into <b>' + escapeHTML(f.primary.supplier) + '</b> and block new POs on the rest.');
    if (conc < 60) bits.push('Spend is split across the family (' + conc + '% on the primary) — confirm the right surviving record before merging.');
    return bits.join(' ');
  }
  function renderConsolidation() {
    const rows = filteredConsolidation();

    const toolbar = '<div class="nx-toolbar" style="margin:12px 0"><div class="nx-search">' + icon("search", 16) + '<input id="consol-search" class="nx-input" type="search" aria-label="Search families" placeholder="Search vendor, member, or category..." value="' + escapeHTML(state.cQuery) + '" style="width:100%"></div>' + eSel + cSel + rSel + confSel + stSel + sortSel + (activeFilters ? '<button type="button" class="nx-btn ghost" data-action="consol-clear">' + icon("close", 14) + ' Clear (' + activeFilters + ')</button>' : '') + '</div>';

      }).join("");
      const laneChips = r.lanes.map(l => fourEBadge(l)).join("");
      const statusChip = r.allApplied ? '<span class="ts-row-status done">Applied ✓</span>' : '<span class="ts-row-status">' + r.nonPrimary + ' to merge</span>';
      const head = '<button type="button" class="ts-row-head" data-fam-toggle="' + f.id + '" aria-expanded="' + open + '" aria-controls="famdet-' + f.id + '">' +
        '<span class="ts-row-chev">' + icon("chevron", 16) + '</span>' +
        '<span class="ts-row-main"><span class="ts-row-title">' + escapeHTML(f.name) + '</span><span class="ts-row-tags">' + badge(catShort(f.category), c + "1e", c) + badge(r.riskLevel + " risk", RISK_COLORS[r.riskLevel] + "22", RISK_COLORS[r.riskLevel]) + (r.clinical ? badge("clinical", BRAND.teal + "22", BRAND.teal) : '') + '<span class="ts-row-lanes">' + laneChips + '</span></span></span>' +

  /* ===== Category Intelligence ===== */
  function fragMeta(hhi) {

  }
  function renderCategory() {
    let cats = categoryRollup();

    const q = normalizeText(state.catQuery);
    if (q) cats = cats.filter(c => normalizeText(c.name).includes(q) || c.suppliers.some(s => normalizeText(s.supplier).includes(q)));
    const sb = state.catSort || "spend";
    cats.sort((a, b) => sb === "count" ? b.count - a.count
      : sb === "frag" ? categoryHHI(a) - categoryHHI(b)            // lowest HHI (most fragmented) first
      : sb === "needs" ? b.suppliers.filter(s => s.categoryConfidence === "Needs Review").length - a.suppliers.filter(s => s.categoryConfidence === "Needs Review").length
      : sb === "name" ? a.name.localeCompare(b.name)
      : b.spend - a.spend);
    const allCats = categoryRollup();

    const toolbar = '<div class="nx-toolbar" style="margin:12px 0"><div class="nx-search">' + icon("search", 16) + '<input id="cat-search" class="nx-input" type="search" aria-label="Search categories" placeholder="Search category or supplier..." value="' + escapeHTML(state.catQuery) + '" style="width:100%"></div>' + sortSel + (state.catQuery ? '<button type="button" class="nx-btn ghost" data-action="cat-clear">' + icon("close", 14) + ' Clear</button>' : '') + '</div>';

    const fragCount = allCats.filter(c => categoryHHI(c) < 1500).length;

    const summary = '<div class="ts-consol-summary">' +

    const rows = cats.length ? cats.map((c, i) => {

      const w = clamp((c.spend / maxSpend) * 100, 3, 100);
      const members = st.sup.slice(0, 10).map(s => '<button type="button" class="ts-member' + (s.isPrimaryInFamily && s.familySize > 1 ? ' primary' : '') + '" data-open-supplier="' + s.id + '" title="' + escapeHTML(s.supplier) + ' · ' + fmtFull(s.totalSpend) + '">' + escapeHTML(truncLabel(s.supplier, 30)) + ' · ' + fmtMoney(s.totalSpend) + '</button>').join("");
      const moreCount = st.sup.length - Math.min(10, st.sup.length);
      const statGrid = '<div class="ts-cat-stats">' +
        '<div class="s"><b>' + fmtMoney(c.spend) + '</b><span>Category spend</span></div>' +
        '<div class="s"><b>' + c.count.toLocaleString() + '</b><span>Suppliers</span></div>' +
        '<div class="s"><b>' + fmtMoney(st.avg) + '</b><span>Avg / supplier</span></div>' +
        '<div class="s"><b>' + fmtPct(st.topShare, 0) + '</b><span>Top-vendor share</span></div>' +

        '</div>';
      const head = '<button type="button" class="ts-row-head" data-cat-toggle="' + escapeHTML(c.name) + '" aria-expanded="' + open + '" aria-controls="catdet-' + i + '">' +
        '<span class="ts-row-chev">' + icon("chevron", 16) + '</span>' +
        '<span class="ts-row-main"><span class="ts-row-title"><i class="ts-cat-dot" style="background:' + col + '"></i>' + escapeHTML(c.name) + '</span><span class="ts-cat-bar"><i style="width:' + w + '%;background:' + col + '"></i></span></span>' +
        '<span class="ts-row-kpis"><span class="kpi"><b>' + fmtMoney(c.spend) + '</b><small>spend</small></span><span class="kpi"><b>' + c.count.toLocaleString() + '</b><small>suppliers</small></span><span class="kpi"><b style="color:' + f.tone + '">' + st.hhi + '</b><small>HHI</small></span>' + badge(f.label, f.tone + "22", f.tone) + (st.needs ? '<span class="ts-row-status" style="color:' + BRAND.rose + '">' + st.needs + ' review</span>' : '') + '</span>' +
