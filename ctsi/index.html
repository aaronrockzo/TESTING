      return '<div class="ts-cat-row' + (open ? ' open' : '') + '" style="--accent:' + col + '">' + head + detail + '</div>';
    }).join("") : '<div class="ts-consol-empty">' + icon("search", 26) + '<p>No categories match your search.</p><button type="button" class="nx-btn ghost" data-action="cat-clear">Clear search</button></div>';

    return '<section class="nx-card"><div class="nx-cardhead"><div><h3>Category Intelligence</h3><div class="sub">Spend, fragmentation, and risk by commodity — click any category to drill in</div></div></div>' + summary + toolbar + resultMeta + '<div class="ts-cat-list">' + rows + '</div>' + insightCard("category", "Category") + '</section>';
  }

  /* ===== Export Center ===== */
  function renderExport() {
    const k = getKpis();
    const sheets = [["Executive Summary", "Headline KPIs, opportunity, and assumptions"], ["Cleaned Supplier Ledger", "All suppliers with categories, Four-E, risk, savings"], ["Four-E Action Plan", "Action, owner, next step, rationale per supplier"], ["Duplicate / Similar Groups", "Supplier families and match confidence"], ["Category Rollup", "Spend, supplier count, HHI by category"], ["Import Quality Report", "Mapping, skipped rows, confidence"], ["Scenario Assumptions", "Savings levers and thresholds used"], ["Validation Notes", "Decision-support disclaimers"]];
    const list = sheets.map((s, i) => '<div class="nx-srow" style="cursor:default"><div class="top"><span class="lab"><i style="background:' + [BRAND.navy800, BRAND.teal, BRAND.rose, BRAND.violet, BRAND.amber, BRAND.blue600, BRAND.mint, BRAND.slate][i] + '"></i>' + escapeHTML(s[0]) + '</span></div><div style="font-size:12px;color:var(--ink-soft);padding-left:18px">' + escapeHTML(s[1]) + '</div></div>').join("");
    return '<section class="nx-grid2b"><div class="nx-card"><div class="nx-cardhead"><div><h3>Export cleaned Excel file</h3><div class="sub">Corewell-branded, multi-tab workbook</div></div></div><div style="font-size:13px;color:var(--ink-soft);line-height:1.6;margin:8px 0 14px">Exports current categories, edited statuses, applied Four-E actions, rationale, next steps, supplier family, duplicate confidence, category confidence, risk level, and savings opportunity. Built entirely in-browser.</div><button type="button" class="nx-btn primary" style="width:100%;min-height:48px" data-action="export-xlsx">' + icon("download", 17) + ' Export cleaned Excel file</button><div style="margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.28);font-size:12px;color:var(--ink-soft);line-height:1.5"><b style="color:#b45309">Decision support only:</b> recommendations and savings are estimates to guide sourcing, not final decisions.</div></div><div class="nx-card"><div class="nx-cardhead"><div><h3>Workbook contents</h3><div class="sub">8 tabs · ' + state.suppliers.length.toLocaleString() + ' suppliers</div></div></div><div class="nx-sourcing">' + list + '</div></div></section>';
  }
  function mstat(l, v) { return '<div class="nx-modal-stat"><span class="nx-label">' + escapeHTML(l) + '</span><b>' + escapeHTML(v) + '</b></div>'; }
  function section(t, c) { return '<section class="nx-modal-section"><h4>' + escapeHTML(t) + '</h4><p class="nx-modal-copy">' + escapeHTML(c) + '</p></section>'; }

  /* ============================ Supplier detail modal ============================ */
  function openSupplierModal(id) {
    const s = state.suppliers.find(x => x.id === id); if (!s) return;
    const fam = state.families.find(f => f.id === s.duplicateGroup);
    const yearMax = Math.max.apply(null, state.yearCols.map(y => s.years[y] || 0)) || 1;
    const yearBars = state.yearCols.map(y => { const v = s.years[y] || 0; return '<div class="ts-yearbar"><span class="lab">' + escapeHTML(y) + '</span><div class="track"><i style="width:' + clamp(v / yearMax * 100, 1, 100) + '%"></i></div><span class="val">' + fmtMoney(v) + '</span></div>'; }).join("");
    const similar = state.suppliers.filter(x => x.category === s.category && x.id !== s.id).sort((a, b) => b.totalSpend - a.totalSpend).slice(0, 5);
    const simPills = similar.length ? similar.map(supplierPill).join(" ") : '<span style="color:var(--ink-soft)">None.</span>';
    const famPills = fam && fam.size > 1 ? fam.members.filter(m => m.id !== s.id).map(supplierPill).join(" ") : '<span style="color:var(--ink-soft)">No duplicate / family matches.</span>';
    const yoyTxt = s.yoy ? fmtPct(s.yoy.pct, 1) + " (" + fmtMoney(s.yoy.abs) + " from " + s.yoy.from + " to " + s.yoy.to + ")" : "Not enough year columns";
    const tagB = supplierTagBadges(s);
    const body = '<div class="nx-modal-grid">' + mstat("Total spend", fmtMoney(s.totalSpend)) + mstat("Category", s.category) + mstat("Four-E action", s.fourE) + mstat("Risk", s.riskLevel) + '</div>' +
      '<div class="nx-modal-section"><h4>Dataset intelligence</h4><div style="display:flex;flex-wrap:wrap;gap:6px">' + (tagB || '<span style="color:var(--ink-soft)">No special flags.</span>') + '</div><p style="margin:8px 0 0;font-size:12px;color:var(--ink-soft);line-height:1.5">Classified using only this uploaded file and embedded procurement rules — not external company research.</p></div>' +
      '<div class="nx-modal-section"><h4>Spend by year</h4><div class="ts-yearbars">' + yearBars + '</div><div style="margin-top:8px;font-size:12.5px;color:var(--ink-soft)"><b>YOY change:</b> ' + escapeHTML(yoyTxt) + '</div></div>' +
      '<div class="ts-detail-grid"><div class="nx-modal-section"><h4>Category confidence</h4><p class="nx-modal-copy">' + escapeHTML(s.categoryConfidence) + ' — ' + escapeHTML(s.categoryReason) + '</p></div><div class="nx-modal-section"><h4>Supplier family</h4><p class="nx-modal-copy">' + escapeHTML(s.supplierFamily) + (s.familySize > 1 ? ' (' + s.familySize + ' records · ' + s.duplicateConfidence + '% match)' : ' (no duplicates)') + '</p></div></div>' +
      section("Tail spend rationale", s.tailSpendReason) +
      section("Recommended action · " + s.fourE, s.actionRationale + " Next step: " + s.nextStep + " Owner: " + s.owner + ".") +
      section("Risk guardrails", s.riskControl + " Estimated risk-gated opportunity: " + fmtMoney(s.savingsOpportunity) + ".") +
      '<div class="nx-modal-section"><h4>Similar suppliers (same category)</h4><div style="display:flex;flex-wrap:wrap;gap:6px">' + simPills + '</div></div>' +
      '<div class="nx-modal-section"><h4>Consolidation candidates</h4><div style="display:flex;flex-wrap:wrap;gap:6px">' + famPills + '</div></div>' +
      '<div class="ts-insight-actions"><button type="button" class="nx-btn primary" data-ask-supplier="' + s.id + '">' + icon("sparkle", 15) + ' Ask Tail Spend Genius</button></div>';
    state.activeModal = { title: s.supplier, subtitle: s.category + " · " + fourELabel(s) + " · " + s.sheet + " row " + s.rowNumber, body };
    render();
  }
  function fourELabel(s) { return s.fourE + " (" + s.fourEConfidence + ")"; }

  /* ============================ Tail Spend Genius ============================ */
  const GENIUS_DISCLAIMER = "Based only on the uploaded file and local procurement rules — validate before final sourcing decisions.";

  /* ----- Local intelligence primitives ----- */
  const TAG_META = {
    "duplicate": { label: "Duplicate family", color: BRAND.violet },
    "zero-spend": { label: "Zero-spend", color: BRAND.slate },
    "tail": { label: "Tail supplier", color: BRAND.amber },
    "strategic": { label: "Strategic / head", color: BRAND.blue600 },
    "clinical-sensitive": { label: "Clinical-sensitive", color: BRAND.teal },
    "regulated": { label: "Regulated", color: BRAND.rose },
    "growth-risk": { label: "High-growth", color: BRAND.mint }
  };
  function supplierTags(s) {
    const p = SPEND_PCT, tags = [];
    if (s.familySize > 1) tags.push("duplicate");
    if (s.totalSpend <= 0) tags.push("zero-spend");
    if (p && s.totalSpend >= p.p90) tags.push("strategic");
    else if (s.totalSpend > 0 && p && s.totalSpend < p.p80) tags.push("tail");
    if (CLINICAL_SENSITIVE.has(s.category)) tags.push("clinical-sensitive");
    if (REGULATED.has(s.category)) tags.push("regulated");
    if (s.yoy && s.yoy.pct >= 25 && p && s.yoy.b > p.p50) tags.push("growth-risk");
    return tags;
  }
  function supplierTagBadges(s) {
    return supplierTags(s).map(t => { const m = TAG_META[t]; return m ? badge(m.label, m.color + "1e", m.color) : ""; }).join(" ");
  }
  // Fuzzy supplier matching across name, normalized name and family — returns best matches with confidence.
  function findSupplierMatches(query, limit = 5) {
    const q = normalizeText(query); if (!q) return [];
    const qc = q.replace(/\s+/g, ""); const qt = q.split(" ").filter(t => t.length > 2);
    const scored = [];
    state.suppliers.forEach(s => {
      const name = normalizeText(s.supplier), fam = normalizeText(s.supplierFamily || "");
      const nc = name.replace(/\s+/g, ""); let score = 0;
      if (name === q) score = 1;
      else if (nc === qc) score = 0.97;
      else if (name.includes(q) || q.includes(name)) score = 0.85;
      else if (fam && (fam.includes(q) || q.includes(fam))) score = 0.72;
      else {
        const nt = name.split(" "); const overlap = qt.filter(t => nt.includes(t)).length;
        if (overlap) score = Math.min(0.8, 0.45 + 0.13 * overlap);
        else { const d = levenshtein(qc, nc), m = Math.max(qc.length, nc.length) || 1, sim = 1 - d / m; if (sim > 0.72) score = sim * 0.6; }
      }
      if (score > 0.4) scored.push({ supplier: s, score });
    });
    scored.sort((a, b) => b.score - a.score || b.supplier.totalSpend - a.supplier.totalSpend);
    // de-dup by supplier id
    const seen = new Set(); const out = [];
    for (const r of scored) { if (seen.has(r.supplier.id)) continue; seen.add(r.supplier.id); out.push(r); if (out.length >= limit) break; }
    return out;
  }
  function confLabel(score) { return score >= 0.95 ? "exact match" : score >= 0.8 ? "high confidence" : score >= 0.6 ? "likely match" : "possible match"; }
  // Concise expert narrative for a supplier (HTML).
  function getSupplierNarrative(s) {
    const fam = state.families.find(f => f.id === s.duplicateGroup);
    const tagB = supplierTagBadges(s);
    let html = '<h4>' + escapeHTML(s.supplier) + ' — ' + escapeHTML(s.fourE) + ' (' + escapeHTML(s.fourEConfidence) + ' confidence)</h4>';
    if (tagB) html += '<p>' + tagB + '</p>';
    html += '<p><strong>Spend:</strong> ' + fmtFull(s.totalSpend) + ' in <strong>' + escapeHTML(s.category) + '</strong>' + (s.yoy ? ', YOY ' + fmtPct(s.yoy.pct, 0) + ' (' + escapeHTML(s.yoy.from) + '→' + escapeHTML(s.yoy.to) + ')' : '') + '. ' + escapeHTML(s.tailSpendReason) + '</p>';
    if (fam && fam.size > 1) html += '<p><strong>Vendor family:</strong> “' + escapeHTML(fam.name) + '” — ' + fam.size + ' records at ' + fam.confidence + '% match' + (s.isPrimaryInFamily ? ' (this is the primary record to keep)' : '; merge into <strong>' + escapeHTML(fam.primary.supplier) + '</strong>') + '.</p>';
    html += '<p><strong>Why ' + escapeHTML(s.fourE) + ':</strong> ' + escapeHTML(s.actionRationale) + '</p>';
    html += '<p><strong>Next action:</strong> ' + escapeHTML(s.nextStep) + ' <em>(Owner: ' + escapeHTML(s.owner) + ')</em></p>';
    html += '<p><strong>Risk guardrails:</strong> ' + escapeHTML(s.riskControl) + '</p>';
    html += '<p><strong>Savings estimate:</strong> ' + fmtMoney(s.savingsOpportunity) + ' — risk-gated (' + escapeHTML(s.savingsLever) + ').</p>';
    return html;
  }
  // Prioritized low-risk wins: duplicates, zero-spend, auto-approvable non-clinical eliminations.
  function getQuickWins(limit = 10) {
    const score = s => {
      let sc = 0;
      if (s.applied) return -1000;
      if (CLINICAL_SENSITIVE.has(s.category) || REGULATED.has(s.category)) return -1000;
      if (s.familySize > 1 && !s.isPrimaryInFamily) sc += 100;
      if (s.totalSpend <= 0) sc += 70;
      if (s.fourE === "Eliminate" && s.autoApply) sc += 60;
      if (s.fourE === "Eliminate") sc += 25;
      if (s.fourEConfidence === "High") sc += 15;
      return sc;
    };
    return state.suppliers.map(s => ({ s, sc: score(s) })).filter(x => x.sc > 0)
      .sort((a, b) => b.sc - a.sc || b.s.savingsOpportunity - a.s.savingsOpportunity).map(x => x.s).slice(0, limit);
  }
  // Fragmentation scoring blends vendor count, HHI, tail count, and duplicate groups.
  function getFragmentedCategories(limit = 6) {
    const p = SPEND_PCT;
    return categoryRollup().filter(c => c.count >= 3).map(c => {
      const hhi = categoryHHI(c);
      const tailCount = c.suppliers.filter(s => s.totalSpend > 0 && p && s.totalSpend < p.p80).length;
      const dupGroups = new Set(c.suppliers.filter(s => s.familySize > 1).map(s => s.duplicateGroup)).size;
      const score = c.count * 2 + Math.max(0, (3000 - hhi) / 80) + tailCount + dupGroups * 5;
      return { cat: c, hhi, tailCount, dupGroups, score };
    }).sort((a, b) => b.score - a.score).slice(0, limit);
  }
  // Suppliers that look unmanaged / off-contract / one-off — never clinical.
  function getMaverickSpendSignals(limit = 8) {
    const p = SPEND_PCT;
    return state.suppliers.filter(s => {
      if (s.totalSpend <= 0 || CLINICAL_SENSITIVE.has(s.category)) return false;
      const unmanaged = s.fourE === "Engage" || s.categoryConfidence === "Needs Review" || s.categoryConfidence === "Low";
      const tinyOneOff = s.familySize === 1 && p && s.totalSpend < p.p50;
      const tail = p && s.totalSpend < p.p80;
      return unmanaged || (tail && (tinyOneOff || s.familySize > 1));
    }).sort((a, b) => b.totalSpend - a.totalSpend).slice(0, limit);
  }
  function geniusStatus() {
    const k = getKpis();
    return '<div class="nx-genius-status"><div class="mini"><b>' + state.suppliers.length.toLocaleString() + '</b><span>Suppliers</span></div><div class="mini"><b>' + fmtMoney(k.tailSpend) + '</b><span>Tail spend</span></div><div class="mini"><b>' + k.dupGroups + '</b><span>Dup families</span></div></div>';
  }

  /* ---- Secure Smart Reader (local priority pass over the supplier file) ---- */
  function supplierPriorityReason(s) {
    if (s.familySize > 1) return s.familySize + " duplicate vendor records collapse to one primary supplier.";
    if (s.fourE === "Eliminate") return s.autoApply ? "Routed to Eliminate — auto-approvable removal." : "Routed to Eliminate — remove after a quick commitment check.";
    if (s.categoryConfidence === "Needs Review" || s.categoryConfidence === "Low") return "Category mapping needs review before any sourcing action.";
    if (s.fourE === "Engage") return "Off-contract / maverick tail spend to bring under management.";
    return "Tail supplier carrying " + fmtMoney(s.savingsOpportunity) + " of risk-gated opportunity.";
  }
  function runSmartReader() {
    if (!state.loaded || !state.suppliers.length) {
      state.welcomeOpen = true;
      pushToast("No data loaded", "Add a supplier file or load the demo portfolio before running the Smart Reader.");
      render();
      return;
    }
    state.drawerOpen = true;
    state.suggestOpen = false;
    state.smartLoading = true;
    state.smartError = null;
    state.smartResult = null;
    preserveWindowScroll(() => render({ focusId: null }));
    setTimeout(() => {
      try {
        // Savings percentile (0–1) — robust to a single mega-supplier dominating the raw max.
        const savingsVals = state.suppliers.map(s => s.savingsOpportunity || 0).sort((a, b) => a - b);
        const savingsPct = v => { if (!savingsVals.length) return 0; let lo = 0; for (let i = 0; i < savingsVals.length; i++) { if (savingsVals[i] <= v) lo = i + 1; } return lo / savingsVals.length; };
        const ranked = state.suppliers.map(s => {
          let sc = 0;
          if (s.fourE === "Eliminate") sc += 30;
          if (s.fourE === "Eliminate" && s.autoApply) sc += 16;
          if (s.fourE === "Engage") sc += 22;
          if (s.familySize > 1) sc += Math.min(22, s.familySize * 8);
          if (s.categoryConfidence === "Needs Review") sc += 16;
          else if (s.categoryConfidence === "Low") sc += 9;
          sc += Math.round(28 * savingsPct(s.savingsOpportunity || 0));
          const score = Math.max(8, Math.min(99, sc));
          const riskLevel = score >= 70 ? "High" : score >= 45 ? "Medium" : "Low";
          return {
            id: s.id,
            vendor: s.supplier,
            sub: (s.category || "Uncategorized") + (s.familySize > 1 ? " · " + s.familySize + " records" : ""),
            riskScore: score,
            riskLevel,
            spend: fmtMoney(s.totalSpend),
            fourE: s.fourE,
            savings: fmtMoney(s.savingsOpportunity),
            owner: s.owner || "Unassigned",
            anomaly: supplierPriorityReason(s),
            leverage: [s.nextStep].filter(Boolean)
          };
        }).sort((a, b) => b.riskScore - a.riskScore).slice(0, 6);
        const k = getKpis();
        state.smartResult = {
          summary: k.tailCount.toLocaleString() + " tail suppliers hold " + fmtMoney(k.tailSpend) + ", " + k.dupGroups + " duplicate families can collapse to one record each, and " + k.eliminate + " suppliers route to Eliminate — about " + fmtMoney(k.savings) + " in risk-gated opportunity.",
          vendors: ranked
        };
      } catch (err) {
        state.smartError = "The local reader did not complete. Try again after reloading the file.";

  /* ---- Genius chat helpers (scroll, suggestions, saved insights) ---- */
  function preserveWindowScroll(fn) {

    return result;
  }
  function scrollGeniusToBottom() {

    if (h) h.scrollTop = h.scrollHeight;
  }
  function cssEscape(v) {
    const s = String(v == null ? "" : v);

  }
  function scrollGeniusToLatestUserPrompt() {
    const history = document.getElementById("genius-history");

    const prompt = (id ? history.querySelector('[data-message-id="' + cssEscape(id) + '"]') : null) || [...history.querySelectorAll('[data-message-role="user"]')].pop();
    if (!prompt) { history.scrollTop = history.scrollHeight; return; }
    const targetTop = Math.max(0, prompt.offsetTop - history.offsetTop - 10);
    try { history.scrollTo({ top: targetTop, behavior: "smooth" }); }
    catch (err) { history.scrollTop = targetTop; }

    const drawerRect = drawer ? drawer.getBoundingClientRect() : { bottom: window.innerHeight };
    const bottomLimit = Math.min(window.innerHeight, drawerRect.bottom) - 12;
    const available = Math.max(96, Math.floor(bottomLimit - panelRect.top));

  // Build a formatted HTML answer. sections is an array of {h, p, ul:[], ol:[], note:bool}.
  function ansHTML(title, sections, refs, opts = {}) {
    let html = '<h4>' + title + '</h4>';
    (sections || []).forEach(sec => {
      if (!sec) return;
      if (sec.h) html += '<p><strong>' + sec.h + '</strong></p>';
      if (sec.p) html += '<p>' + (sec.label ? '<strong>' + sec.label + '</strong> ' : '') + sec.p + '</p>';
      if (sec.ul && sec.ul.length) html += '<ul>' + sec.ul.map(li => '<li>' + li + '</li>').join("") + '</ul>';
      if (sec.ol && sec.ol.length) html += '<ol>' + sec.ol.map(li => '<li>' + li + '</li>').join("") + '</ol>';
      if (sec.html) html += sec.html;
    });
    if (refs && refs.length) html += '<div class="nx-answer-actions">' + refs.map(supplierPill).join(" ") + '</div>';

  // Compact supplier bullet list with name, spend, category and action.
  function supplierBullets(arr, n = 6) {
    return arr.slice(0, n).map(s => '<li><strong>' + escapeHTML(s.supplier) + '</strong> — ' + fmtFull(s.totalSpend) + ' · ' + escapeHTML(s.category) + ' · <em>' + escapeHTML(s.fourE) + '</em></li>');
  }
  function detectNamedSupplier(q) {
    let best = null;
    state.suppliers.forEach(s => { const n = normalizeText(s.supplier); if (n.length > 4 && q.includes(n) && (!best || n.length > best.n.length)) best = { s, n }; });
    return best ? best.s : null;
  }
  function answerGenius(qRaw) {
    if (!state.loaded) return { html: '<h4>No supplier data loaded yet</h4><p>I work entirely offline from your file. Load the <strong>demo portfolio</strong> or import a supplier-spend workbook (CSV / XLSX) first, then I can answer with your real suppliers, spend, duplicates, categories, and Four-E actions.</p>' };
    const q = normalizeText(qRaw); const list = state.suppliers; const k = getKpis(); const cats = categoryRollup();
    const top = list.slice().sort((a, b) => b.totalSpend - a.totalSpend);
    const dupFamilies = state.families.filter(f => f.size > 1).sort((a, b) => b.totalSpend - a.totalSpend);

    // ---- Supplier-specific intents ("why is X Evaluate", "what should I do with X", "tell me about X") ----
    let named = detectNamedSupplier(q);
    const supplierIntent = /what should|do with|explain|why is|why was|tell me about|about |action plan for|categor/.test(q);
    if (!named && supplierIntent) { const m = findSupplierMatches(qRaw, 3); if (m.length && m[0].score >= 0.6) named = m[0].supplier; }
    if (named && (supplierIntent || findSupplierMatches(qRaw, 1).some(m => m.score >= 0.9 && m.supplier.id === named.id))) {
      return { html: getSupplierNarrative(named) + '<div class="nx-answer-actions">' + supplierPill(named) + '</div><div class="nx-answer-note">' + GENIUS_DISCLAIMER + '</div>' };
    }
    // Named but ambiguous (multiple candidates, no strong action verb) → disambiguate
    if (supplierIntent && !named) {
      const m = findSupplierMatches(qRaw, 5);
      if (m.length) return ansHTML("A few possible supplier matches", [{ p: "I couldn't pin down one supplier. Did you mean one of these?", ul: m.map(x => '<strong>' + escapeHTML(x.supplier.supplier) + '</strong> — ' + fmtFull(x.supplier.totalSpend) + ' (' + confLabel(x.score) + ')') }], m.map(x => x.supplier));
    }

    // ---- Focus / what next / priorities ----
    if (/focus|start|priorit|what next|do next|where do i begin|first thing/.test(q)) {
      const wins = getQuickWins(5); const frag = getFragmentedCategories(1)[0];
      return ansHTML("Start where leverage is highest", [
        { label: "Picture:", p: k.dupGroups + " duplicate families (" + k.dupCount + " redundant records), " + k.tailCount.toLocaleString() + " tail suppliers worth " + fmtMoney(k.tailSpend) + ", and an estimated " + fmtMoney(k.savings) + " risk-gated opportunity." },
        { h: "Do this first (low risk → high leverage)", ol: [
          "Apply duplicate consolidations in Consolidation Command — fastest clean win.",
          "Clear zero-spend and auto-approvable Eliminate vendors to cut the vendor master.",
          frag ? "Consolidate <strong>" + escapeHTML(frag.cat.name) + "</strong> (" + frag.cat.count + " vendors, HHI " + frag.hhi + ") for pricing leverage." : "Engage the largest unmanaged tail suppliers for preferred-supplier migration."
        ] },
        { label: "Guardrail:", p: "Hold clinical-sensitive and regulated suppliers for Evaluate review — never blunt-cut them." }
      ], wins);
    }

    // ---- Duplicates ----
    if (/duplicate|same company|same supplier|same vendor|look like the same|vendor famil|merge/.test(q)) {
      if (!dupFamilies.length) return ansHTML("No duplicate families detected", [{ p: "Supplier names were normalized and clustered, but none crossed the similarity threshold. Re-check after loading a fuller vendor master." }], []);
      const refs = dupFamilies.slice(0, 6).map(f => f.primary);
      return ansHTML("Found " + dupFamilies.length + " duplicate / similar supplier families", [
        { p: "Together they hold " + k.dupCount + " redundant records. Largest families:", ul: dupFamilies.slice(0, 6).map(f => '<strong>' + escapeHTML(f.name) + '</strong> — ' + f.size + ' records, ' + fmtFull(f.totalSpend) + ', ' + f.confidence + '% match') },
        { label: "Recommended action:", p: "Merge each family's non-primary records into the ★ primary vendor and block POs on the rest." },
        { label: "Why this matters:", p: "One vendor master record per supplier restores pricing leverage, cleans spend analytics, and removes duplicate-payment risk." },
        { label: "Risk guardrails:", p: "For clinical families, confirm product equivalency before blocking any device / supply / pharmacy vendor." }
      ], refs);
    }

    // ---- Quick wins / low risk / safe ----
    if (/quick win|safe|low.?risk|easy|low hanging/.test(q)) {
      const wins = getQuickWins(10);
      if (!wins.length) return ansHTML("No clear low-risk wins right now", [{ p: "Nothing currently qualifies as an auto-approvable, non-clinical elimination. Start with duplicate consolidation instead." }], dupFamilies.slice(0, 4).map(f => f.primary));
      const spend = wins.reduce((a, b) => a + b.totalSpend, 0);
      return ansHTML(wins.length + " low-risk quick wins", [
        { p: "Duplicates, zero-spend, and auto-approvable non-clinical eliminations totaling " + fmtFull(spend) + ":", ul: supplierBullets(wins, 10) },
        { label: "Recommended action:", p: "Apply these in Consolidation Command now — minimal business disruption." },
        { label: "Risk guardrails:", p: "Confirm no open POs before deactivating; none of these touch clinical or regulated categories." }
      ], wins.slice(0, 6));
    }

    // ---- Maverick / off-contract ----
    if (/maverick|off.?contract|unmanaged|leakage|rogue/.test(q)) {
      const mav = getMaverickSpendSignals(8);
      const spend = list.filter(s => s.fourE === "Engage").reduce((a, b) => a + b.totalSpend, 0);
      return ansHTML("Maverick / unmanaged tail signals", [
        { label: "Picture:", p: "Roughly " + fmtMoney(spend) + " sits with suppliers that look unmanaged, off-contract, or one-off." },

        { label: "Recommended action:", p: "Assign category owners, confirm requirements, and migrate to preferred suppliers or catalog with PO compliance." },
        { label: "Risk guardrails:", p: "Validate any clinical items for equivalency before switching suppliers." }

    }

    // ---- Fragmented categories / too many suppliers ----
    if (/fragment|hhi|concentrat|too many (supplier|vendor)|many (supplier|vendor)|consolidat|reduce vendor|fewer vendor/.test(q) && !/reduce.*20|cut.*20|reduce.*count by/.test(q)) {

      if (!frag.length) return ansHTML("No materially fragmented categories", [{ p: "No category has enough competing vendors to flag for consolidation yet." }], []);
      const refs = frag[0].cat.suppliers.slice().sort((a, b) => b.totalSpend - a.totalSpend).slice(0, 4);
      return ansHTML("Most fragmented categories (consolidation opportunities)", [

    // ---- Eliminate ----

      const elim = list.filter(s => s.fourE === "Eliminate").sort((a, b) => b.totalSpend - a.totalSpend);

        { label: "Recommended action:", p: "Block / redirect demand to preferred suppliers or catalog / P-card, then deactivate the vendor records." },
        { label: "Risk guardrails:", p: clin.length ? clin.length + " of these sit in clinical-sensitive categories — confirm equivalency and continuity before removing any of them." : "Confirm no open commitments before deactivating; none of these are clinical-sensitive." }

    }

    // ---- Strategic / evolve / contract / GPO ----
    if (/strategic|evolve|catalog|contract|gpo|govern/.test(q)) {
      const evolve = list.filter(s => s.fourE === "Evolve").sort((a, b) => b.totalSpend - a.totalSpend);
      if (!evolve.length) return ansHTML("No suppliers currently routed to Evolve", [{ p: "No high-value or fast-growing suppliers met the strategic threshold." }], top.slice(0, 4));
      return ansHTML(evolve.length + " suppliers should become strategic (Evolve)", [
        { p: "High-value and fast-growing suppliers to bring under governed sourcing:", ul: supplierBullets(evolve, 8) },
        { label: "Recommended action:", p: "Bring under contract / GPO governance, load to catalog, and add to the quarterly strategic-supplier review cadence — Evolve, not Eliminate." },

    // ---- Clinical / risk review ----

      return ansHTML(clin.length + " suppliers need clinical / compliance review before action", [
        { p: "Protect these from blunt cuts — route through review first:", ul: supplierBullets(clin, 8) },
        { label: "Recommended action:", p: "Send to clinical value analysis or Legal / Compliance; do not consolidate or cut without equivalency and continuity sign-off." },
        { label: "Why this matters:", p: "These protect patient-care continuity and regulatory / PHI obligations — every savings claim here must be risk-gated." }
      ], clin.slice(0, 6));

    // ---- Biggest savings opportunities ----
    if (/saving|opportunit|biggest|value|where.*money|reduce cost|cost out/.test(q)) {
      const opp = list.filter(s => !s.applied && s.savingsOpportunity > 0).sort((a, b) => b.savingsOpportunity - a.savingsOpportunity).slice(0, 8);
      return ansHTML("Biggest risk-gated savings opportunities", [
        { label: "Total modeled opportunity:", p: fmtFull(k.savings) + " across the portfolio (conservative, risk-gated)." },
        opp.length ? { p: "Largest individual opportunities:", ul: opp.map(s => '<strong>' + escapeHTML(s.supplier) + '</strong> — ' + fmtFull(s.savingsOpportunity) + ' (' + escapeHTML(s.fourE) + ' · ' + escapeHTML(s.category) + ')') } : { p: "No individual opportunities are modeled yet." },
        { label: "How it is estimated:", p: "Duplicate consolidation ≈8% of combined spend, tail rationalization recovers process/admin cost, managed-spend price improvement 3–6%. Clinical savings require equivalency review." }

      const ys = state.yearCols;

      const grow = cats.map(c => { const a = c.suppliers.reduce((s, x) => s + (x.years[ys[0]] || 0), 0); const b = c.suppliers.reduce((s, x) => s + (x.years[ys[ys.length - 1]] || 0), 0); return { c, pct: a ? (b - a) / a * 100 : 0 }; }).filter(x => x.pct > 0).sort((a, b) => b.pct - a.pct).slice(0, 5);

      if (!weak.length) return ansHTML("Category coverage looks solid", [{ p: "No high-spend suppliers have weak category data right now." }], []);

        { p: "Real money, unreliable categorization — classify these first:", ul: supplierBullets(weak, 8) },
        { label: "Recommended action:", p: "Assign commodities in the Supplier Ledger, then re-run Four-E before any sourcing move." }
      ], weak.slice(0, 6));
    }

    // ---- Explicit 20% vendor-count reduction ----
    if (/reduce.*20|cut.*20|reduce.*count|fewer.*record|vendor count/.test(q)) return reduceVendorsAnswer();

    // ---- Default overview ----
    return ansHTML("Portfolio overview", [
      { p: state.suppliers.length.toLocaleString() + " suppliers · " + fmtFull(k.total) + " total spend · " + k.tailCount.toLocaleString() + " tail suppliers (" + fmtMoney(k.tailSpend) + ") · " + k.dupGroups + " duplicate families · est. " + fmtMoney(k.savings) + " opportunity." },

  function debounce(fn, ms) { let t; return function (...a) { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), ms); }; }
  function wireDrop(zoneId, inputId) {
    const zone = document.getElementById(zoneId); if (!zone) return;
    const open = () => document.getElementById(inputId)?.click();
    // Toggle the highlight class directly so the cue follows the cursor smoothly
    // and clears on dragleave — without re-rendering (and replacing) the drop target mid-drag.
    zone.addEventListener("click", open);
    zone.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
    zone.addEventListener("dragover", e => { e.preventDefault(); state.drag = true; zone.classList.add("drag"); });
    zone.addEventListener("dragleave", () => { state.drag = false; zone.classList.remove("drag"); });
    zone.addEventListener("drop", e => { e.preventDefault(); state.drag = false; zone.classList.remove("drag"); if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
  }

      case "show-welcome": state.welcomeOpen = true; render(); break;
      case "close-welcome": state.welcomeOpen = false; render(); break;

      const k = getKpis(); const cats = categoryRollup(); const ys = state.yearCols;
      const q = state.quality; const confidence = state.review ? state.review.confidence : 0;
      const REL = "http://schemas.openxmlformats.org/officeDocument/2006/relationships/";
      const xmlHead = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';

      /* ---- Sheet 1: Executive Summary cover ---- */
      const coverRows = [];
      brandHeader(coverRows, "Corewell Tail Spend Intelligence", "Supplier Spend Command · Executive Summary", 2);
      coverRows.push([cs("Generated", ST.metaLabel), cs(new Date().toLocaleString(), ST.metaVal)]);
      coverRows.push([cs("Source file", ST.metaLabel), cs(state.uploadName || "—", ST.metaVal)]);
      coverRows.push([cs("Workbook", ST.metaLabel), cs("8 tabs · cleaned, categorized & risk-scored", ST.metaVal)]);
      coverRows.push([]);
      const secRow = coverRows.length + 1;
      coverRows.push([cs("Portfolio Summary", ST.section), cs("", ST.section)]);
      [
        ["Suppliers", k.suppliers, "int"], ["Total spend", k.total, "money"],
        ["Tail suppliers", k.tailCount, "int"], ["Tail spend", k.tailSpend, "money"],
        ["Duplicate families", k.dupGroups, "int"], ["Redundant records", k.dupCount, "int"],
        ["Eliminate-lane suppliers", k.eliminate, "int"], ["Est. risk-gated opportunity", k.savings, "money"],
        ["Import confidence", confidence / 100, "pct"]
      ].forEach(([l, v, kind]) => {
        const val = kind === "money" ? cn(v, ST.coverMoney) : kind === "pct" ? cn(v, ST.coverPct) : cn(v, ST.coverInt);
        coverRows.push([cs(l, ST.coverLabel), val]);
      });
      const coverModel = { rows: coverRows, opts: { cols: [{ min: 1, max: 1, width: 40 }, { min: 2, max: 2, width: 26 }], merges: bandMerges(2).concat(['A' + secRow + ':B' + secRow]), freeze: 3, rowHeights: { 1: 44, 2: 18, 3: 5 } } };

      /* ---- Sheet 2: Cleaned Supplier Ledger ---- */
      const ledgerCols = [
        { h: "Supplier", w: 30, kind: "text" }, { h: "Supplier Family", w: 26, kind: "text" },
        { h: "Dup Group", w: 11, kind: "text" }, { h: "Dup Conf.", w: 10, kind: "pct" }
      ].concat(ys.map(y => ({ h: String(y), w: 14, kind: "money" }))).concat([
        { h: "Total Spend", w: 15, kind: "money" }, { h: "YOY", w: 10, kind: "pct" },
        { h: "Category", w: 28, kind: "text" }, { h: "Cat. Confidence", w: 15, kind: "text" },
        { h: "Status", w: 12, kind: "text" }, { h: "Four-E", w: 12, kind: "fourE" },
        { h: "Risk", w: 11, kind: "risk" }, { h: "Savings Opp.", w: 15, kind: "money" },
        { h: "Source Sheet", w: 18, kind: "text" }, { h: "Row", w: 7, kind: "int" }
      ]);
      const ledgerData = state.suppliers.map(s => [
        s.supplier, s.supplierFamily, s.duplicateGroup, s.familySize > 1 ? s.duplicateConfidence / 100 : null
      ].concat(ys.map(y => s.years[y] ? s.years[y] : null)).concat([
        s.totalSpend, s.yoy ? s.yoy.pct / 100 : null, s.category, s.categoryConfidence,
        s.statusRaw || "—", s.fourE, s.riskLevel, s.savingsOpportunity, s.sheet, s.rowNumber
      ]));

      /* ---- Sheet 3: Four-E Action Plan ---- */
      const planCols = [
        { h: "Supplier", w: 28, kind: "text" }, { h: "Four-E", w: 12, kind: "fourE" },
        { h: "Confidence", w: 12, kind: "text" }, { h: "Owner", w: 26, kind: "text" },
        { h: "Next Step", w: 46, kind: "wrap" }, { h: "Rationale", w: 50, kind: "wrap" },
        { h: "Risk Control", w: 34, kind: "wrap" }, { h: "Savings Lever", w: 30, kind: "wrap" },
        { h: "Auto-apply", w: 12, kind: "text" }
      ];
      const planData = state.suppliers.map(s => [s.supplier, s.fourE, s.fourEConfidence, s.owner, s.nextStep, s.actionRationale, s.riskControl, s.savingsLever, s.autoApply ? "Yes" : "Review"]);

      /* ---- Sheet 4: Duplicate / similar families ---- */
      const dupCols = [
        { h: "Family", w: 28, kind: "text" }, { h: "Primary (keep)", w: 28, kind: "text" },
        { h: "Members", w: 52, kind: "wrap" }, { h: "Records", w: 9, kind: "int" },
        { h: "Combined Spend", w: 16, kind: "money" }, { h: "Match Conf.", w: 11, kind: "pct" },
        { h: "Category", w: 26, kind: "text" }
      ];
      const dupData = state.families.filter(f => f.size > 1).sort((a, b) => b.totalSpend - a.totalSpend)
        .map(f => [f.name, f.primary.supplier, f.members.map(m => m.supplier).join(" • "), f.size, f.totalSpend, f.confidence / 100, f.category]);

      /* ---- Sheet 5: Category rollup ---- */
      const catCols = [
        { h: "Category", w: 30, kind: "text" }, { h: "Spend", w: 16, kind: "money" },
        { h: "Suppliers", w: 11, kind: "int" }, { h: "HHI", w: 9, kind: "int" },
        { h: "Concentration", w: 15, kind: "text" }, { h: "Needs Review", w: 13, kind: "int" }
      ];
      const catData = cats.map(c => { const h = categoryHHI(c); return [c.name, c.spend, c.count, h, h < 1500 ? "Fragmented" : h < 3000 ? "Moderate" : "Concentrated", c.suppliers.filter(s => s.categoryConfidence === "Needs Review").length]; });

      /* ---- Sheets 6-8: quality / assumptions / notes ---- */
      const qualItems = [
        { section: "Ingestion" },
        { l: "Selected sheet", v: q.selectedSheet }, { l: "Rows read", v: q.rowsRead, kind: "int" },
        { l: "Imported", v: q.imported, kind: "int" }, { l: "Skipped", v: q.skipped, kind: "int" },
        { l: "Missing supplier", v: q.missingSupplier, kind: "int" }, { l: "Missing / zero spend", v: q.missingSpend, kind: "int" },
        { l: "Summary rows ignored", v: q.summaryRows, kind: "int" },
        { section: "Classification & matching" },
        { l: "Duplicate candidates", v: q.duplicateCandidates, kind: "int" }, { l: "Inferred categories", v: q.inferredCategories, kind: "int" },
        { l: "Year columns", v: q.yearCols.join(", ") || "none" }, { l: "Mapped fields", v: q.mappedFields.join(", ") || "none" },
        { l: "Unmapped fields", v: (q.unmappedFields && q.unmappedFields.length) ? q.unmappedFields.join(", ") : "none" },
        { l: "Import confidence", v: confidence / 100, kind: "pct" }
      ];
      const assumeItems = [
        { section: "Method & thresholds" },
        { l: "Tail threshold", v: "Below the 80th percentile of supplier spend" },
        { l: "Duplicate consolidation savings", v: "≈ 8% of combined family spend" },
        { l: "Tail rationalization", v: "Process / admin cost recovery; ≈ 60% of tiny one-off spend" },
        { l: "Managed price improvement", v: "3–6% on governed spend" },
        { l: "Clinical-sensitive categories", v: "Evaluate / Evolve only — risk-gated, no blunt elimination" }
      ];
      const notesLines = [
        "1. All classifications are inferred decision-support, not final sourcing decisions.",
        "2. Savings are estimates and must be validated with category owners and finance.",
        "3. Clinical, regulated, and PHI-touching suppliers require equivalency / compliance review before action.",
        "4. No external data sources were used; analysis is grounded only in the imported file.",
        "5. Edited categories and applied actions are reflected as of export time."
      ];

      const sheets = [
        { name: "Executive Summary", model: coverModel },
        { name: "Cleaned Supplier Ledger", model: buildTableSheet("Cleaned Supplier Ledger", "Every supplier — cleaned, categorized, deduped and risk-scored", ledgerCols, ledgerData) },
        { name: "Four-E Action Plan", model: buildTableSheet("Four-E Action Plan", "Recommended action, owner, next step and rationale per supplier", planCols, planData) },
        { name: "Duplicate Groups", model: buildTableSheet("Duplicate & Similar Families", "Consolidation candidates with match confidence", dupCols, dupData) },
        { name: "Category Rollup", model: buildTableSheet("Category Rollup", "Spend, supplier count and fragmentation (HHI) by commodity", catCols, catData) },
        { name: "Import Quality", model: buildKVSheet("Import Quality Report", "Deterministic local ingestion diagnostics", qualItems, [36, 46]) },
        { name: "Scenario Assumptions", model: buildKVSheet("Scenario Assumptions", "Savings levers and thresholds behind the estimates", assumeItems, [34, 64]) },
        { name: "Validation Notes", model: buildNotesSheet("Validation Notes", "Decision-support disclaimers", notesLines) }
      ];

      const logoBytes = await renderLogoPng(128);
      const hasLogo = !!logoBytes;
      const files = [];

      let ct = xmlHead + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
        + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
        + '<Default Extension="xml" ContentType="application/xml"/>'
        + (hasLogo ? '<Default Extension="png" ContentType="image/png"/>' : '')
        + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
        + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
        + sheets.map((_, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("")
        + (hasLogo ? sheets.map((_, i) => '<Override PartName="/xl/drawings/drawing' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>').join("") : "")
        + '</Types>';
      files.push({ name: "[Content_Types].xml", data: strBytes(ct) });
      files.push({ name: "_rels/.rels", data: strBytes(xmlHead + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="' + REL + 'officeDocument" Target="xl/workbook.xml"/></Relationships>') });

      const sheetsXml = sheets.map((s, i) => '<sheet name="' + xesc(s.name.slice(0, 31)) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join("");
      files.push({ name: "xl/workbook.xml", data: strBytes(xmlHead + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' + sheetsXml + '</sheets></workbook>') });
      const wbRels = sheets.map((_, i) => '<Relationship Id="rId' + (i + 1) + '" Type="' + REL + 'worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join("") + '<Relationship Id="rId' + (sheets.length + 1) + '" Type="' + REL + 'styles" Target="styles.xml"/>';
      files.push({ name: "xl/_rels/workbook.xml.rels", data: strBytes(xmlHead + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + wbRels + '</Relationships>') });
      files.push({ name: "xl/styles.xml", data: strBytes(XLSX_STYLES.styles) });

      sheets.forEach((s, i) => {
        const opts = Object.assign({}, s.model.opts, { drawingId: hasLogo ? "rId1" : null });
        files.push({ name: "xl/worksheets/sheet" + (i + 1) + ".xml", data: strBytes(sheetXML(s.model.rows, opts)) });
        if (hasLogo) {
          files.push({ name: "xl/worksheets/_rels/sheet" + (i + 1) + ".xml.rels", data: strBytes(xmlHead + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="' + REL + 'drawing" Target="../drawings/drawing' + (i + 1) + '.xml"/></Relationships>') });
          files.push({ name: "xl/drawings/drawing" + (i + 1) + ".xml", data: strBytes(xmlHead + logoDrawingXML(i + 2)) });
          files.push({ name: "xl/drawings/_rels/drawing" + (i + 1) + ".xml.rels", data: strBytes(xmlHead + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="' + REL + 'image" Target="../media/image1.png"/></Relationships>') });
        }
      });
      if (hasLogo) files.push({ name: "xl/media/image1.png", data: logoBytes });

      const zip = buildZip(files);
      const blob = new Blob([zip], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      const url = URL.createObjectURL(blob); const a = document.createElement("a");
      a.href = url; a.download = "Corewell_Tail_Spend_Cleaned.xlsx"; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      pushToast("Export ready", "Corewell_Tail_Spend_Cleaned.xlsx — 8 branded tabs" + (hasLogo ? " with logo." : "."));
    } catch (err) {
      pushToast("Export failed", String(err && err.message || err));
    }
  }

  /* ============================ Keyboard + init ============================ */
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      if (state.suggestOpen) { state.suggestOpen = false; render({ focusId: "genius-input", scrollGenius: false }); }
      else if (state.activeModal) { state.activeModal = null; render(); }
      else if (state.notifOpen) { state.notifOpen = false; render(); }
      else if (state.welcomeOpen) { state.welcomeOpen = false; render(); }
      else if (state.drawerOpen) { state.drawerOpen = false; render(); }
    }
  });
  // Close the Genius suggestions popup when clicking outside of it.
  document.addEventListener("click", e => {
    const target = e.target;
    if (state.suggestOpen && !(target && (target.closest(".nx-suggest") || target.closest(".nx-suggest-pop") || target.closest(".nx-chat-toolbar")))) {
      state.suggestOpen = false;
      preserveWindowScroll(() => render({ scrollGenius: false }));
    }
  });
  saveTheme(state.theme);
  render();
})();

  </script>
</body>
</html>
